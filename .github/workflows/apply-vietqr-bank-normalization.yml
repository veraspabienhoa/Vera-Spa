name: Apply universal VietQR bank normalization

on:
  push:
    paths:
      - '.github/workflows/apply-vietqr-bank-normalization.yml'

permissions:
  contents: write

concurrency:
  group: vera-spa-production
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2" "httpx2>=2,<3" -r requirements.txt
      - name: Patch bank normalization paths
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          once('vera_web_v2_live_tour_payment.py',
               'from vera_partial_leave_hours import DEFAULT_HOURS\n',
               'from vera_partial_leave_hours import DEFAULT_HOURS\nfrom vera_vietqr_bank import resolve_vietqr_bank_id\n',
               'payment import')
          once('vera_web_v2_live_tour_payment.py',
               "    bank = {'enabled': True, 'bank_id': str(row.get('bank_name') or '').strip(),\n            'account_no': str(row.get('bank_account') or '').strip(),\n            'account_name': str(row.get('full_name') or '').strip()}\n    if (not re.fullmatch(r'[A-Za-z0-9]{2,20}', bank['bank_id'])\n            or not re.fullmatch(r'[0-9]{6,19}', bank['account_no']) or not bank['account_name']):\n",
               "    bank = {'enabled': True, 'bank_id': resolve_vietqr_bank_id(row.get('bank_name')),\n            'account_no': str(row.get('bank_account') or '').strip(),\n            'account_name': str(row.get('full_name') or '').strip()}\n    if (not re.fullmatch(r'[A-Za-z0-9]{2,20}', bank['bank_id'])\n            or not re.fullmatch(r'[0-9]{6,19}', bank['account_no']) or not bank['account_name']):\n",
               'payment profile bank resolver')

          once('vera_web_v2_profile.py',
               'from vera_web_v2_staff_security import validate_saved_identity_matches\n',
               'from vera_web_v2_staff_security import validate_saved_identity_matches\nfrom vera_vietqr_bank import normalize_bank_for_storage, resolve_vietqr_bank_id\n',
               'profile import')
          once('vera_web_v2_profile.py',
               '                "bank_account": body.bank_account.strip(), "bank_name": body.bank_name.strip(),\n',
               '                "bank_account": body.bank_account.strip(), "bank_name": normalize_bank_for_storage(body.bank_name),\n',
               'profile save normalize')
          once('vera_web_v2_profile.py',
               '            validate_saved_identity_matches(\n',
               '            if updated["bank_account"] and updated["bank_name"] and not resolve_vietqr_bank_id(updated["bank_name"]):\n                raise HTTPException(400, "Ngân hàng chưa khớp danh mục VietQR. Hãy chọn ngân hàng từ danh sách gợi ý.")\n            validate_saved_identity_matches(\n',
               'profile validation')
          PY
      - name: Run focused tests
        run: |
          python -m py_compile vera_vietqr_bank.py vera_web_v2_profile.py vera_web_v2_live_tour_payment.py
          python -m pytest -q tests/test_vietqr_bank_normalization.py tests/test_live_tour_daily_settings.py
      - name: Build frontend
        working-directory: web-v2
        run: |
          npm ci
          npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vera_vietqr_bank.py vera_web_v2_profile.py vera_web_v2_live_tour_payment.py tests/test_vietqr_bank_normalization.py
          git commit -m 'Normalize employee banks for VietQR'
          git push origin HEAD:main
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy patched commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 240 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"
      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'set -e; curl -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:8000/v2/attendance/break-alerts/dispatch/health; echo; systemctl is-active vera-api.service'
