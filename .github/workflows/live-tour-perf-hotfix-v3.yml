name: One-shot Live Tour performance hotfix v3

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: live-tour-perf-hotfix-v3
  cancel-in-progress: false

jobs:
  patch-test-commit-deploy:
    if: contains(github.event.head_commit.message, '[live-tour-perf-hotfix-v3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Patch Live Tour critical section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('vera_web_v2_live_tour.py')
          source = path.read_text(encoding='utf-8')

          def one(old, new, label):
              global source
              n = source.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              source = source.replace(old, new, 1)

          def exact(old, new, expected, label):
              global source
              n = source.count(old)
              if n != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {n}')
              source = source.replace(old, new)

          one(
              '    timezone = vn_tz or VN_TZ\n    attendance = AttendanceBreakReader(attendance_reader) if attendance_reader else None\n\n    scheduler_stop = Event()\n',
              '    timezone = vn_tz or VN_TZ\n    attendance = AttendanceBreakReader(attendance_reader) if attendance_reader else None\n    _ATTENDANCE_UNSET = object()\n\n    scheduler_stop = Event()\n',
              'attendance sentinel')

          one(
              '                with engine_instance().begin() as conn:\n                    # A background refresh must never compete with an operator.\n',
              '                with engine_instance().begin() as conn:\n                    # Resolve the expensive attendance input before competing for STATE_LOCK.\n                    projection_now = datetime.now(timezone)\n                    projection_records = (\n                        attendance.read(conn, projection_now.astimezone(timezone).date(), force=True)\n                        if attendance else None\n                    )\n                    # A background refresh must never compete with an operator.\n',
              'scheduler preload')

          one(
              '                            read_state(conn, datetime.now(timezone), for_update=True)\n',
              '                            read_state(\n                                conn, projection_now, for_update=True,\n                                attendance_records=projection_records,\n                            )\n',
              'scheduler projection')

          one(
              '    def read_state(conn, now, *, for_update=False):\n        # Runtime callback uses the same installed policy chain as Chấm công.\n        records = attendance.read(conn, now.astimezone(timezone).date(), force=for_update) if attendance else None\n',
              '    def read_state(conn, now, *, for_update=False, attendance_records=_ATTENDANCE_UNSET):\n        # Runtime callback uses the same installed policy chain as Chấm công.\n        records = attendance_records\n        if records is _ATTENDANCE_UNSET:\n            records = attendance.read(conn, now.astimezone(timezone).date(), force=for_update) if attendance else None\n',
              'preloaded attendance')

          one(
              '                "combo_upsert", "combo_delete", "set_vip", "update_appointment",\n                "update_started_at", "add_minutes",\n                # These financial mutations validate and update the locked\n',
              '                "combo_upsert", "combo_delete", "set_vip", "update_appointment",\n                "update_started_at", "add_minutes",\n                # Operator transitions mutate only the canonical aggregate. Routine\n                # attendance/roster/leave projection must not lengthen their lock.\n                "start", "start_room", "finish_to_pending", "finish_room",\n                # These financial mutations validate and update the locked\n',
              'operator fast path')

          one(
              '    return next_revision\n\n\ndef _parse_export_bounds(\n',
              '''    return next_revision\n\n\ndef _write_state_compat(\n    conn, state: dict[str, Any], revision: int, actor: str,\n    *, previous_state: dict[str, Any],\n) -> int:\n    \"\"\"Pass the locked snapshot in production while supporting legacy test doubles.\"\"\"\n    try:\n        return _write_state(conn, state, revision, actor, previous_state=previous_state)\n    except TypeError as exc:\n        if \"unexpected keyword argument 'previous_state'\" not in str(exc):\n            raise\n        return _write_state(conn, state, revision, actor)\n\n\ndef _parse_export_bounds(\n''',
              'compat writer')

          exact(
              '            revision = _write_state(\n                conn, state, revision, "live_tour_daily_projection", previous_state=before,\n            )\n',
              '            revision = _write_state_compat(\n                conn, state, revision, "live_tour_daily_projection", previous_state=before,\n            )\n', 1, 'daily writer')
          exact(
              '                revision = _write_state(\n                    conn, state, revision, "attendance_break_projection", previous_state=before,\n                )\n',
              '                revision = _write_state_compat(\n                    conn, state, revision, "attendance_break_projection", previous_state=before,\n                )\n', 1, 'attendance writer')
          exact(
              '            next_revision = _write_state(\n                conn, working, revision, actor, previous_state=state,\n            )\n',
              '            next_revision = _write_state_compat(\n                conn, working, revision, actor, previous_state=state,\n            )\n', 2, 'action writers')
          path.write_text(source, encoding='utf-8')

          Path('tests/test_live_tour_action_lock_performance.py').write_text('''from pathlib import Path\n\ndef src():\n    return Path(\"vera_web_v2_live_tour.py\").read_text(encoding=\"utf-8\")\n\ndef test_operator_actions_use_projection_free_snapshot():\n    block = src().split(\"projection_free_actions = {\", 1)[1].split(\"}\", 1)[0]\n    for action in (\"start\", \"start_room\", \"finish_to_pending\", \"finish_room\"):\n        assert f'\"{action}\"' in block\n\ndef test_scheduler_reads_attendance_before_board_lock():\n    block = src().split(\"def scheduled_projection():\", 1)[1].split(\"def start_scheduler():\", 1)[0]\n    assert block.index(\"attendance.read(\") < block.index(\"try_state_lock(conn, STATE_LOCK)\")\n    assert \"attendance_records=projection_records\" in block\n\ndef test_legacy_test_writers_are_compatible():\n    assert \"def _write_state_compat(\" in src()\n''', encoding='utf-8')

          server_test = Path('tests/test_live_tour_server_only.py')
          server_source = server_test.read_text(encoding='utf-8')
          old = '    assert database.employee_reads == 5\n'
          if server_source.count(old) != 1:
              raise SystemExit('server-only employee read assertion changed unexpectedly')
          server_source = server_source.replace(
              old,
              '    # start uses the projection-free mutation path, avoiding one redundant employee-directory read.\n    assert database.employee_reads == 4\n',
              1,
          )
          server_test.write_text(server_source, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "pytest==8.4.2" "httpx2>=2,<3" -r requirements.txt
      - name: Run focused Live Tour regression tests
        run: |
          python -m py_compile vera_web_v2_live_tour.py
          python -m pytest -q tests/test_live_tour_action_lock_performance.py tests/test_live_tour_admin_start.py tests/test_live_tour_appointments.py tests/test_live_tour_expired.py tests/test_live_tour_invoice_permissions.py tests/test_live_tour_room_actions.py tests/test_live_tour_roster_booking.py tests/test_live_tour_safety.py tests/test_live_tour_server_only.py
      - name: Run full Python test suite
        run: python -m pytest -q
      - name: Commit tested hotfix
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-tour-perf-hotfix.yml .github/workflows/live-tour-perf-hotfix-v2.yml .github/workflows/live-tour-perf-hotfix-v3.yml
          git add vera_web_v2_live_tour.py tests/test_live_tour_action_lock_performance.py tests/test_live_tour_server_only.py
          git commit -m "Speed up Live Tour start and finish actions"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
      - name: Deploy tested commit to VPS production
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh workflow run deploy-vps.yml --ref main
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow deploy-vps.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,headSha --jq ".[] | select(.headSha == \"${PATCH_SHA}\") | .databaseId" | head -n 1)
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo "Could not locate deploy run for ${PATCH_SHA}" >&2; exit 1; }
          gh run watch "$run_id" --exit-status
