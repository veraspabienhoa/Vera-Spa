name: Repair verified FaceGate IP bindings

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview only, or apply an unchanged verified preview'
        type: choice
        options: [preview, apply]
        default: preview
        required: true
      expected_commit:
        description: 'Full commit SHA already deployed on the VPS'
        type: string
        required: true
      address:
        description: 'Current registered FaceGate IP'
        type: string
        default: '192.168.1.26'
        required: true
      expected_count:
        description: 'Expected number of existing mappings'
        type: string
        default: '51'
        required: true
      operator:
        description: 'Existing VERA Admin username authorizing repair'
        type: string
        default: 'admin'
        required: true
      preview_digest:
        description: 'Exact digest from the successful preview; required for apply'
        type: string
        required: false
      refresh_date:
        description: 'Optional YYYY-MM-DD to republish after apply; must be today in Vietnam'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: vera-vps-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Validate bounded operator inputs
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ADDRESS: ${{ inputs.address }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          OPERATOR: ${{ inputs.operator }}
          PREVIEW_DIGEST: ${{ inputs.preview_digest }}
          REFRESH_DATE: ${{ inputs.refresh_date }}
        run: |
          set -euo pipefail
          [[ "$MODE" == preview || "$MODE" == apply ]]
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ADDRESS" =~ ^192\.168\.1\.[0-9]{1,3}$ ]]
          [[ "$EXPECTED_COUNT" =~ ^[1-9][0-9]{0,2}$ ]]
          [[ "$OPERATOR" =~ ^[A-Za-z0-9_-]{1,64}$ ]]
          [[ -z "$PREVIEW_DIGEST" || "$PREVIEW_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          [[ -z "$REFRESH_DATE" || "$REFRESH_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          if [[ "$MODE" == apply ]]; then test -n "$PREVIEW_DIGEST"; fi
          if [[ "$MODE" == preview ]]; then test -z "$REFRESH_DATE"; fi

      - name: Configure existing pinned SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/vera-repair-ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vera-repair-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/vera-repair-ssh/known_hosts"

      - name: Verify live release and run requested repair mode
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MODE: ${{ inputs.mode }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          ADDRESS: ${{ inputs.address }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          OPERATOR: ${{ inputs.operator }}
          PREVIEW_DIGEST: ${{ inputs.preview_digest }}
          REFRESH_DATE: ${{ inputs.refresh_date }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          [[ "$VPS_HOST" != -* && "$VPS_USER" != -* ]]
          ssh -i "$RUNNER_TEMP/vera-repair-ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/vera-repair-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 \
            "${VPS_USER}@${VPS_HOST}" \
            "timeout 360 bash -s -- '$MODE' '$EXPECTED_COMMIT' '$ADDRESS' '$EXPECTED_COUNT' '$OPERATOR' '$PREVIEW_DIGEST' '$REFRESH_DATE'" <<'REMOTE'
          set -euo pipefail
          mode="$1"; expected_commit="$2"; address="$3"; count="$4"; operator="$5"; digest="$6"; day="$7"
          pid=$(pgrep -n -f '[v]era_web_v2_api_v38:app')
          release_dir=$(readlink -f "/proc/$pid/cwd")
          cd "$release_dir"
          origin=$(git remote get-url origin)
          case "$origin" in
            https://github.com/veraspabienhoa/Vera-Spa|https://github.com/veraspabienhoa/Vera-Spa.git|git@github.com:veraspabienhoa/Vera-Spa.git) ;;
            *) echo 'STOP: unexpected runtime repository'; exit 3 ;;
          esac
          test "$(git rev-parse HEAD)" = "$expected_commit"
          args=(--address "$address" --operator "$operator" --expected-count "$count" --expected-commit "$expected_commit")
          if [ "$mode" = apply ]; then args+=(--apply --preview-digest "$digest"); fi
          if [ -n "$day" ]; then args+=(--refresh-date "$day"); fi
          /opt/vera-spa/.venv/bin/python -B vera_facegate_ip_repair.py "${args[@]}"
          REMOTE
