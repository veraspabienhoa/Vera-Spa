name: One-shot PostgreSQL Live Tour queue v6

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: live-tour-postgres-queue-v6
  cancel-in-progress: false

jobs:
  patch-test-commit-deploy:
    if: contains(github.event.head_commit.message, '[live-tour-postgres-queue-v6]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Rebuild fully tested v5 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/live-tour-postgres-queue-v5.yml').read_text(encoding='utf-8')
          for name, out in [
              ('Build v4 queue patch', '/tmp/v5_build.sh'),
              ('Align legacy projection tests with background worker semantics', '/tmp/v5_align.sh'),
          ]:
              sm = f"      - name: {name}\n        shell: bash\n        run: |\n"
              start = wf.index(sm) + len(sm)
              end = wf.index('\n      - name:', start)
              script = wf[start:end]
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
              Path(out).write_text('#!/usr/bin/env bash\nset -euo pipefail\n' + script + '\n', encoding='utf-8')
          PY
          bash /tmp/v5_build.sh
          bash /tmp/v5_align.sh
          # The queue implementation does not require a deploy-workflow edit.
          # Keep the already-proven production deploy workflow byte-for-byte unchanged
          # so GITHUB_TOKEN does not need workflow-file write scope.
          git checkout HEAD -- .github/workflows/deploy-vps.yml

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "pytest==8.4.2" \
            "httpx2>=2,<3" \
            -r requirements.txt

      - name: Reconfirm queue regression suite
        run: |
          python -m py_compile vera_postgres_job_queue.py vera_web_v2_live_tour.py timesoft_snapshot_job.py vera_vps_concurrency_schema.py
          python -m pytest -q \
            tests/test_postgres_job_queue_source.py \
            tests/test_live_tour_action_lock_performance.py \
            tests/test_live_tour_lock_scope.py \
            tests/test_live_tour_lock_backpressure.py \
            tests/test_live_tour_concurrent_readers.py \
            tests/test_live_tour_attendance_breaktime.py \
            tests/test_live_tour_daily_settings.py \
            tests/test_live_tour_server_only.py \
            tests/test_early_leave_live_projection.py \
            tests/test_live_tour_checkin_projection.py \
            tests/test_live_tour_lifespan.py \
            tests/test_live_tour_quick_combo_auto.py \
            tests/test_live_tour_roster_booking.py \
            tests/test_live_tour_shift_effective_date.py \
            tests/test_direct_break_return_penalty.py \
            tests/test_missing_checkin_notifications.py

      - name: Reconfirm full Python suite
        run: python -m pytest -q

      - name: Commit tested queue implementation
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/live-tour-postgres-queue-v6.yml \
            .github/workflows/live-tour-postgres-queue-v5.yml \
            .github/workflows/live-tour-postgres-queue-v4.yml \
            .github/workflows/live-tour-postgres-queue-v3.yml \
            .github/workflows/live-tour-postgres-queue-v2.yml \
            .github/workflows/live-tour-postgres-queue.yml \
            .github/workflows/live-tour-5m-refresh.yml
          git add \
            vera_postgres_job_queue.py \
            vera_web_v2_live_tour.py \
            timesoft_snapshot_job.py \
            cloudbuild.yaml \
            vera_vps_concurrency_schema.py \
            tests/test_postgres_job_queue_source.py \
            tests/test_live_tour_action_lock_performance.py \
            tests/test_live_tour_lock_scope.py \
            tests/test_live_tour_lock_backpressure.py \
            tests/test_live_tour_attendance_breaktime.py \
            tests/test_live_tour_daily_settings.py \
            tests/test_live_tour_server_only.py \
            tests/test_early_leave_live_projection.py \
            tests/test_live_tour_checkin_projection.py \
            tests/test_live_tour_lifespan.py \
            tests/test_live_tour_quick_combo_auto.py \
            tests/test_live_tour_roster_booking.py \
            tests/test_live_tour_shift_effective_date.py \
            tests/test_direct_break_return_penalty.py \
            tests/test_missing_checkin_notifications.py
          git diff --cached --name-only | grep -v '^.github/workflows/live-tour-' | grep '^.github/workflows/' && {
            echo 'Unexpected persistent workflow mutation' >&2
            exit 1
          } || true
          git commit -m "Move Live Tour projections to PostgreSQL queue"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy tested commit to VPS production
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh workflow run deploy-vps.yml --ref main
          run_id=""
          for attempt in $(seq 1 40); do
            run_id=$(gh run list --workflow deploy-vps.yml --branch main --event workflow_dispatch --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${PATCH_SHA}\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id" || { echo "Deploy run not found for ${PATCH_SHA}" >&2; exit 1; }
          echo "Deploy run ${run_id} for ${PATCH_SHA}"
          gh run watch "$run_id" --exit-status
