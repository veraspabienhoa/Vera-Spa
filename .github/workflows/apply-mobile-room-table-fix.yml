name: Apply mobile room and table layout fix

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-room-table-fix.yml'

permissions:
  contents: write

concurrency:
  group: live-tour-mobile-room-table-fix
  cancel-in-progress: false

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Apply requested mobile layout changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          page = 'web-v2/src/pages/LiveTourPage.jsx'
          css = 'web-v2/src/pages/LiveTourControls.css'

          replace_once(
              page,
              "  if (key === 'TRANG THAI') return 'tour-col-status center'\n  if (key === 'TG CON LAI' || key === 'THOI GIAN CON LAI') return 'tour-col-remaining center'",
              "  if (key === 'TRANG THAI') return 'tour-col-status center'\n  if (key === 'DICH VU' || key.startsWith('DICH VU (')) return 'tour-col-service'\n  if (key === 'TG CON LAI' || key === 'THOI GIAN CON LAI') return 'tour-col-remaining center'",
              'service column class',
          )

          p = Path(css)
          text = p.read_text(encoding='utf-8')
          marker = "@media(max-width:820px){\n  .live-tour-page .tour-heading-actions button{min-height:16.56px!important;height:auto!important;padding-top:1.15px!important;padding-bottom:1.15px!important}\n  .live-tour-page .tour-room-panel .tour-room-grid .tour-room-card-head>strong{font-size:12px!important;line-height:1.15!important;white-space:normal!important;overflow-wrap:anywhere!important}\n  .live-tour-page .tour-room-panel .tour-room-grid .tour-room-type{font-size:6px!important}\n}"
          replacement = "@media(max-width:820px){\n  .live-tour-page .tour-heading-actions button{min-height:16.56px!important;height:auto!important;padding-top:1.15px!important;padding-bottom:1.15px!important}\n  .live-tour-page .tour-room-panel .tour-room-grid{grid-auto-rows:96px!important;align-items:stretch!important}\n  .live-tour-page .tour-room-panel .tour-room-grid .tour-room-card{height:96px!important;min-height:96px!important;max-height:96px!important;align-self:stretch!important;overflow:hidden!important}\n  .live-tour-page .tour-room-panel .tour-room-grid .tour-room-booking-button{height:auto!important;min-height:0!important;max-height:100%!important;overflow:hidden!important}\n  .live-tour-page .tour-room-panel .tour-room-grid .tour-room-card-head>strong{font-size:min(12px,8.5cqw)!important;line-height:1.15!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;overflow-wrap:normal!important;word-break:normal!important}\n  .live-tour-page .tour-room-panel .tour-room-grid .tour-room-type{font-size:6px!important}\n  .live-tour-page .tour-table .tour-col-room{width:80px!important;min-width:80px!important;max-width:80px!important}\n  .live-tour-page .tour-table .tour-col-remaining{width:70.4px!important;min-width:70.4px!important;max-width:70.4px!important}\n  .live-tour-page .tour-table .tour-col-request{width:65.6px!important;min-width:65.6px!important;max-width:65.6px!important}\n  .live-tour-page .tour-table .tour-col-service{display:table-cell!important;min-width:120px!important;width:120px!important;white-space:normal!important;overflow-wrap:anywhere!important}\n}"
          if text.count(marker) != 1:
              raise SystemExit(f'mobile override block: expected 1 match, found {text.count(marker)}')
          p.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Verify requested layout invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('web-v2/src/pages/LiveTourPage.jsx').read_text(encoding='utf-8')
          css = Path('web-v2/src/pages/LiveTourControls.css').read_text(encoding='utf-8')
          checks = {
              'service class': "return 'tour-col-service'" in page,
              'mobile fixed room height': 'height:96px!important;min-height:96px!important;max-height:96px!important' in css,
              'room title nowrap': 'white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important' in css,
              'room width +60%': 'width:80px!important;min-width:80px!important;max-width:80px!important' in css,
              'remaining width +60%': 'width:70.4px!important;min-width:70.4px!important;max-width:70.4px!important' in css,
              'request width +60%': 'width:65.6px!important;min-width:65.6px!important;max-width:65.6px!important' in css,
              'service visible mobile': '.tour-col-service{display:table-cell!important;min-width:120px!important' in css,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('FAILED: ' + ', '.join(failed))
          print('LAYOUT_CHECK=OK')
          PY

      - name: Build frontend
        working-directory: web-v2
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git diff --check
          git config user.name 'vera-spa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add web-v2/src/pages/LiveTourPage.jsx web-v2/src/pages/LiveTourControls.css
          git commit -m 'Fix mobile room height and table columns'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy patched commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 180 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify production commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "set -e; pid=\$(pgrep -n -f '[v]era_web_v2_api_v38:app'); release_dir=\$(readlink -f /proc/\${pid}/cwd); test \"\$(git -C \"\${release_dir}\" rev-parse HEAD)\" = '${DEPLOY_SHA}'; echo PRODUCTION_COMMIT=${DEPLOY_SHA}"
