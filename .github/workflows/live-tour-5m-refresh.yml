name: One-shot Live Tour 5-minute refresh policy

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: live-tour-5m-refresh
  cancel-in-progress: false

jobs:
  patch-test-commit-deploy:
    if: contains(github.event.head_commit.message, '[live-tour-5m-refresh]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Patch 5-minute refresh cadence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          live_path = Path('vera_web_v2_live_tour.py')
          live = live_path.read_text(encoding='utf-8')

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return source.replace(old, new, 1)

          live = replace_once(
              live,
              'from threading import Event, Thread\n',
              'from threading import Event, Lock, Thread\nfrom time import monotonic\n',
              'thread/time imports',
          )
          live = replace_once(
              live,
              'STATE_VERSION = 1\nBUSINESS_DAY_CUTOFF = time(11, 10)\n',
              'STATE_VERSION = 1\nPROJECTION_REFRESH_SECONDS = 300\nBUSINESS_DAY_CUTOFF = time(11, 10)\n',
              'projection refresh constant',
          )
          live = replace_once(
              live,
              '    attendance = AttendanceBreakReader(attendance_reader) if attendance_reader else None\n    _ATTENDANCE_UNSET = object()\n\n    scheduler_stop = Event()\n',
              '''    attendance = AttendanceBreakReader(attendance_reader) if attendance_reader else None\n    _ATTENDANCE_UNSET = object()\n    projection_gate = Lock()\n    projection_next_at = 0.0\n\n    def projection_refresh_due() -> bool:\n        with projection_gate:\n            return monotonic() >= projection_next_at\n\n    def projection_mark_refreshed() -> None:\n        nonlocal projection_next_at\n        with projection_gate:\n            projection_next_at = monotonic() + PROJECTION_REFRESH_SECONDS\n\n    scheduler_stop = Event()\n''',
              'projection refresh gate',
          )
          live = replace_once(
              live,
              '                    # If a mutation owns the aggregate lock, skip this tick and\n                    # let the next 15-second pass refresh the projections.\n',
              '                    # If a mutation owns the aggregate lock, skip this tick and\n                    # let the next 5-minute pass refresh the projections.\n',
              'scheduler comment',
          )
          live = replace_once(
              live,
              '''                            read_state(\n                                conn, projection_now, for_update=True,\n                                attendance_records=projection_records,\n                            )\n''',
              '''                            read_state(\n                                conn, projection_now, for_update=True,\n                                attendance_records=projection_records,\n                            )\n                            projection_mark_refreshed()\n''',
              'scheduler refresh marker',
          )
          live = replace_once(
              live,
              '            scheduler_stop.wait(15)\n',
              '            scheduler_stop.wait(PROJECTION_REFRESH_SECONDS)\n',
              'scheduler interval',
          )
          live = replace_once(
              live,
              '''        if project and try_state_lock(conn, STATE_LOCK):\n            return read_state(conn, now)\n''',
              '''        if project and projection_refresh_due() and try_state_lock(conn, STATE_LOCK):\n            projected = read_state(conn, now)\n            projection_mark_refreshed()\n            return projected\n''',
              'on-demand projection gate',
          )
          live_path.write_text(live, encoding='utf-8')

          snapshot_path = Path('timesoft_snapshot_job.py')
          snapshot = snapshot_path.read_text(encoding='utf-8')
          old_main = '''def main() -> int:\n    ts.process_tour_penalties = _skip_tour_penalties\n    ts._log(\n        f"V85.1 DIRECT ATTENDANCE: HTTP auth -> TimeSoft -> PostgreSQL -> "\n        "phạt đi trễ đầu ca/vào lại trễ sau nghỉ giữa ca; "\n        f"fast check-in mỗi {FAST_INTERVAL_SECONDS}s trong {FAST_WINDOW_SECONDS}s; "\n        "Playwright chỉ fallback; TourVera cache theo công tắc Admin."\n    )\n    result = int(ts.run_sync())\n    if result != 0:\n        return result\n    try:\n        _fast_checkin_tail()\n    except Exception as exc:\n        ts._log(f"FAST CHECKIN TAIL ABORTED: {type(exc).__name__}: {exc}")\n    return 0\n'''
          new_main = '''def main() -> int:\n    ts.process_tour_penalties = _skip_tour_penalties\n    ts._log(\n        "V85.2 DIRECT ATTENDANCE: HTTP auth -> TimeSoft -> PostgreSQL; "\n        "mỗi lần Cloud Scheduler chạy chỉ đồng bộ một chu kỳ. "\n        "Không còn fast tail 30 giây; cadence chuẩn là 5 phút."\n    )\n    return int(ts.run_sync())\n'''
          snapshot = replace_once(snapshot, old_main, new_main, 'timesoft main cadence')
          snapshot = snapshot.replace(
              'RELEASE = "timesoft-direct-attendance-penalty-2026-09-07-v3-http-auth"',
              'RELEASE = "timesoft-direct-attendance-penalty-2026-09-16-v4-5min-cadence"',
              1,
          )
          snapshot_path.write_text(snapshot, encoding='utf-8')

          test_path = Path('tests/test_direct_break_return_penalty.py')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(
              test,
              '    assert calls == ["sync", "tail"]\n',
              '    assert calls == ["sync"]\n',
              'timesoft cadence test',
          )
          test_path.write_text(test, encoding='utf-8')

          Path('tests/test_live_tour_5m_refresh.py').write_text('''from pathlib import Path\n\n\ndef test_live_tour_projection_refresh_is_five_minutes():\n    source = Path("vera_web_v2_live_tour.py").read_text(encoding="utf-8")\n    assert "PROJECTION_REFRESH_SECONDS = 300" in source\n    assert "scheduler_stop.wait(PROJECTION_REFRESH_SECONDS)" in source\n    assert "projection_refresh_due() and try_state_lock(conn, STATE_LOCK)" in source\n    assert "projection_mark_refreshed()" in source\n\n\ndef test_timesoft_snapshot_has_no_fast_tail_in_main():\n    source = Path("timesoft_snapshot_job.py").read_text(encoding="utf-8")\n    main = source.split("def main() -> int:", 1)[1].split("if __name__ ==", 1)[0]\n    assert "return int(ts.run_sync())" in main\n    assert "_fast_checkin_tail()" not in main\n    assert "cadence chuẩn là 5 phút" in main\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "pytest==8.4.2" \
            "httpx2>=2,<3" \
            -r requirements.txt

      - name: Run focused concurrency and cadence tests
        run: |
          python -m py_compile vera_web_v2_live_tour.py timesoft_snapshot_job.py
          python -m pytest -q \
            tests/test_live_tour_5m_refresh.py \
            tests/test_live_tour_action_lock_performance.py \
            tests/test_live_tour_lock_scope.py \
            tests/test_live_tour_lock_backpressure.py \
            tests/test_live_tour_concurrent_readers.py \
            tests/test_live_tour_attendance_breaktime.py \
            tests/test_direct_break_return_penalty.py

      - name: Run full Python test suite
        run: python -m pytest -q

      - name: Commit tested refresh policy and remove workflow
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-tour-5m-refresh.yml
          git add vera_web_v2_live_tour.py timesoft_snapshot_job.py tests/test_direct_break_return_penalty.py tests/test_live_tour_5m_refresh.py
          git commit -m "Refresh TimeSoft and leave projection every 5 minutes"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy tested commit to VPS production
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh workflow run deploy-vps.yml --ref main
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow deploy-vps.yml --branch main --event workflow_dispatch --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${PATCH_SHA}\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id" || { echo "Deploy run not found for ${PATCH_SHA}" >&2; exit 1; }
          gh run watch "$run_id" --exit-status
