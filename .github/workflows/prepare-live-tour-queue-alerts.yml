name: Prepare Live Tour Queue Alerts

on:
  push:
    branches:
      - ops/live-tour-queue-alerts-20260916
    paths:
      - '.github/workflows/prepare-live-tour-queue-alerts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/live-tour-queue-alerts-20260916
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "pytest==8.4.2" \
            "httpx2>=2,<3" \
            -r requirements.txt

      - name: Integrate queue alert monitor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('vera_web_v2_live_tour.py')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'import vera_postgres_job_queue as job_queue\n',
                  'import vera_postgres_job_queue as job_queue\nimport vera_live_tour_queue_alerts as queue_alerts\n',
              ),
              (
                  'PROJECTION_RELEASE = "live-tour-projection-queue-2026-09-16.2-hardening"',
                  'PROJECTION_RELEASE = "live-tour-projection-queue-2026-09-16.3-alerts"',
              ),
              (
                  '    scheduler_thread = None\n    worker_thread = None\n',
                  '    scheduler_thread = None\n    worker_thread = None\n    alert_thread = None\n',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'Unexpected Live Tour anchor count for {old!r}: {source.count(old)}')
              source = source.replace(old, new, 1)

          worker_anchor = '''                scheduler_stop.wait(2)\n\n    def start_scheduler():\n        nonlocal scheduler_thread, worker_thread\n        # Fail startup before any background thread can touch a missing queue table.\n        job_queue.ensure_schema(engine_instance)\n        scheduler_stop.clear()\n        scheduler_thread = Thread(target=scheduled_projection, name="live-tour-projection-scheduler", daemon=True)\n        worker_thread = Thread(target=projection_worker, name="live-tour-projection-worker", daemon=True)\n        scheduler_thread.start()\n        worker_thread.start()\n\n    def stop_scheduler():\n        scheduler_stop.set()\n        for thread in (scheduler_thread, worker_thread):\n'''
          worker_replacement = '''                scheduler_stop.wait(2)\n\n    def queue_alert_monitor():\n        while not scheduler_stop.is_set():\n            try:\n                metrics = job_queue.health_metrics(engine_instance, PROJECTION_QUEUE)\n                queue_alerts.monitor_once(engine_instance, PROJECTION_QUEUE, metrics)\n            except Exception:\n                logging.getLogger(__name__).exception("Live Tour queue alert monitor failed")\n            scheduler_stop.wait(queue_alerts.MONITOR_SECONDS)\n\n    def start_scheduler():\n        nonlocal scheduler_thread, worker_thread, alert_thread\n        # Fail startup before any background thread can touch a missing queue table.\n        job_queue.ensure_schema(engine_instance)\n        scheduler_stop.clear()\n        scheduler_thread = Thread(target=scheduled_projection, name="live-tour-projection-scheduler", daemon=True)\n        worker_thread = Thread(target=projection_worker, name="live-tour-projection-worker", daemon=True)\n        alert_thread = Thread(target=queue_alert_monitor, name="live-tour-queue-alert-monitor", daemon=True)\n        scheduler_thread.start()\n        worker_thread.start()\n        alert_thread.start()\n\n    def stop_scheduler():\n        scheduler_stop.set()\n        for thread in (scheduler_thread, worker_thread, alert_thread):\n'''
          if source.count(worker_anchor) != 1:
              raise SystemExit(f'Unexpected worker/start anchor count: {source.count(worker_anchor)}')
          source = source.replace(worker_anchor, worker_replacement, 1)

          health_anchor = '''    @app.get("/v2/live-tour/projection-queue/health")\n    def live_tour_projection_queue_health():\n        metrics = job_queue.health_metrics(engine_instance, PROJECTION_QUEUE)\n        return {\n            "ok": True, "release": PROJECTION_RELEASE,\n            "queue_release": job_queue.RELEASE,\n            "refresh_seconds": PROJECTION_REFRESH_SECONDS,\n            "claim_strategy": "for_update_skip_locked",\n            "counts": job_queue.counts(engine_instance, PROJECTION_QUEUE),\n            **metrics,\n        }\n'''
          health_replacement = '''    @app.get("/v2/live-tour/projection-queue/health")\n    def live_tour_projection_queue_health():\n        metrics = job_queue.health_metrics(engine_instance, PROJECTION_QUEUE)\n        alerting = queue_alerts.health_status(engine_instance, PROJECTION_QUEUE, metrics)\n        return {\n            "ok": not alerting["active"], "release": PROJECTION_RELEASE,\n            "queue_release": job_queue.RELEASE,\n            "refresh_seconds": PROJECTION_REFRESH_SECONDS,\n            "claim_strategy": "for_update_skip_locked",\n            "counts": job_queue.counts(engine_instance, PROJECTION_QUEUE),\n            **metrics,\n            "alerting": alerting,\n        }\n'''
          if source.count(health_anchor) != 1:
              raise SystemExit(f'Unexpected health anchor count: {source.count(health_anchor)}')
          source = source.replace(health_anchor, health_replacement, 1)
          path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_live_tour_lifespan.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              "            assert events == ['app-start', 'queue-schema-ready', 'scheduler-start', 'scheduler-start']",
              "            assert events == ['app-start', 'queue-schema-ready', 'scheduler-start', 'scheduler-start', 'scheduler-start']",
              1,
          )
          test = test.replace(
              "    assert events == ['app-start', 'queue-schema-ready', 'scheduler-start', 'scheduler-start', 'scheduler-stop', 'scheduler-stop', 'app-stop']",
              "    assert events == ['app-start', 'queue-schema-ready', 'scheduler-start', 'scheduler-start', 'scheduler-start', 'scheduler-stop', 'scheduler-stop', 'scheduler-stop', 'app-stop']",
              1,
          )
          health_setup = "    monkeypatch.setattr(live.job_queue, 'counts', lambda engine_instance, queue_name: {'done': 23})\n"
          health_setup_new = health_setup + "    monkeypatch.setattr(live.queue_alerts, 'health_status', lambda engine_instance, queue_name, metrics: {'active': False, 'conditions': []})\n"
          if test.count(health_setup) != 1:
              raise SystemExit(f'Unexpected health test setup count: {test.count(health_setup)}')
          test = test.replace(health_setup, health_setup_new, 1)
          assertion = "    assert payload['stale_processing'] == 0\n"
          assertion_new = assertion + "    assert payload['ok'] is True\n    assert payload['alerting']['active'] is False\n"
          if test.count(assertion) != 1:
              raise SystemExit(f'Unexpected health assertion count: {test.count(assertion)}')
          test = test.replace(assertion, assertion_new, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

          git diff --check
          rm .github/workflows/prepare-live-tour-queue-alerts.yml

      - name: Run targeted queue alert tests
        run: |
          python -m pytest -q \
            tests/test_live_tour_queue_alerts.py \
            tests/test_live_tour_lifespan.py \
            tests/test_postgres_job_queue_health.py

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Commit prepared alert implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add automatic Live Tour queue alerts'
          git push origin HEAD:ops/live-tour-queue-alerts-20260916
