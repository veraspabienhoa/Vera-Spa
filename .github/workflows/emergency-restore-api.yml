name: Emergency restore API file

on:
  push:
    paths:
      - '.github/workflows/emergency-restore-api.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore accidentally truncated API file
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout fa07e2b54aada90dd0c5a6c4ea1e56a83eab7163 -- vera_web_v2_api.py
          git add vera_web_v2_api.py
          git commit -m 'Restore full Web V2 API file'
          git push origin HEAD:main
