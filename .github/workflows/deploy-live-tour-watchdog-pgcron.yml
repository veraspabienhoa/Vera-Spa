name: Deploy Live Tour Watchdog systemd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-live-tour-watchdog-pgcron.yml'
      - 'vera_web_v2_api.py'
      - 'vera_web_v2_attendance_break_dispatch.py'
      - 'vera_live_tour_queue_alerts.py'
      - 'web-v2/src/lib/pushNotifications.js'
      - 'ops/bootstrap_vapid_identity.py'
      - 'ops/systemd/vera-live-tour-queue-watchdog.sh'
      - 'ops/systemd/vera-live-tour-queue-watchdog.service'
      - 'ops/systemd/vera-live-tour-queue-watchdog.timer'

permissions:
  contents: read

concurrency:
  group: vera-spa-production
  cancel-in-progress: false

jobs:
  deploy-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy current main commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            "timeout 180 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify systemd bootstrap and watchdog
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'set -euo pipefail; systemctl is-enabled vera-live-tour-queue-watchdog.timer; systemctl is-active vera-live-tour-queue-watchdog.timer; systemctl list-timers vera-live-tour-queue-watchdog.timer --no-pager; systemctl show vera-live-tour-queue-watchdog.service -p Result -p ExecMainStatus; journalctl -u vera-live-tour-queue-watchdog.service -n 20 --no-pager'

      - name: Verify production watchdog endpoint registration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'curl -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:8000/v2/attendance/break-alerts/dispatch/health'
