name: Sync watchdog env fallback

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-watchdog-env-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch only _vault_secret
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vera_web_v2_api.py')
          s = p.read_text()
          old = '''def _vault_secret(conn, name: str) -> str:\n    value = conn.execute(text("""\n        SELECT decrypted_secret\n        FROM vault.decrypted_secrets\n        WHERE name=:name\n        LIMIT 1\n    """), {"name": name}).scalar_one_or_none()\n    return str(value or "").strip()\n'''
          new = '''def _vault_secret(conn, name: str) -> str:\n    env_name = {\n        "vera_v2_push_webhook_secret": "VERA_V2_PUSH_WEBHOOK_SECRET",\n    }.get(name)\n    if env_name:\n        value = str(os.getenv(env_name) or "").strip()\n        if value:\n            return value\n    if conn.execute(text("SELECT to_regclass('vault.decrypted_secrets')")).scalar_one_or_none() is None:\n        return ""\n    value = conn.execute(text("""\n        SELECT decrypted_secret\n        FROM vault.decrypted_secrets\n        WHERE name=:name\n        LIMIT 1\n    """), {"name": name}).scalar_one_or_none()\n    return str(value or "").strip()\n'''
          if s.count(old) != 1:
              raise SystemExit('expected exactly one original _vault_secret block')
          p.write_text(s.replace(old, new))
          PY
          python3 -m py_compile vera_web_v2_api.py
          git diff --check
          git diff -- vera_web_v2_api.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vera_web_v2_api.py
          git commit -m 'Use environment fallback for watchdog secret'
          git push origin HEAD:main
