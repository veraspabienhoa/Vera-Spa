name: Apply Live Tour appearance settings

on:
  push:
    paths:
      - '.github/workflows/apply-live-tour-appearance-settings.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply appearance settings patch
        run: |
          python .github/scripts/add_live_tour_appearance.py
          python .github/scripts/fix_live_tour_appearance_order.py

      - name: Backend syntax and focused invariants
        run: |
          python -m py_compile vera_web_v2_live_tour.py
          python - <<'PY'
          from pathlib import Path
          source = Path('vera_web_v2_live_tour.py').read_text(encoding='utf-8')
          tests = Path('tests/test_live_tour_appearance_settings.py').read_text(encoding='utf-8')
          page = Path('web-v2/src/pages/LiveTourPage.jsx').read_text(encoding='utf-8')
          assert 'appearance_settings_update' in source
          assert '"appearance_settings": deepcopy(state.get("appearance_settings") or {})' in source
          assert 'state["appearance_settings"] = _appearance_settings_update(payload)' in source
          assert 'test_appearance_settings_are_persistent_and_projected' in tests
          assert page.index("const canOperate = capability('operate'") < page.index('const appearanceTableColumns = useMemo')
          print('BACKEND_APPEARANCE_INVARIANTS=OK')
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Frontend tests and production build
        working-directory: web-v2
        run: |
          npm ci
          node --test tests/liveTourAppointments.test.mjs tests/bookingControls.test.mjs tests/bookingAvailability.test.mjs
          npm run build

      - name: Verify appearance invariants
        run: |
          grep -q "label: 'Giao diện'" web-v2/src/components/AppShell.jsx
          grep -q "appearance_settings_update" vera_web_v2_live_tour.py
          grep -q "appearanceTableColumns" web-v2/src/pages/LiveTourPage.jsx
          grep -q "Desktop" web-v2/src/pages/AppearanceSettingsPage.jsx
          grep -q "Mobile" web-v2/src/pages/AppearanceSettingsPage.jsx

      - name: Commit functional change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            vera_web_v2_live_tour.py \
            web-v2/src/lib/liveTourAppearance.js \
            web-v2/src/pages/AppearanceSettingsPage.jsx \
            web-v2/src/App.jsx \
            web-v2/src/components/AppShell.jsx \
            web-v2/src/pages/LiveTourPage.jsx \
            tests/test_live_tour_appearance_settings.py
          git commit -m 'Add admin Live Tour appearance settings'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 180 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "set -e; pid=\$(pgrep -n -f '[v]era_web_v2_api_v38:app'); release_dir=\$(readlink -f /proc/\${pid}/cwd); live_sha=\$(git -C \"\${release_dir}\" rev-parse HEAD); test \"\${live_sha}\" = '${DEPLOY_SHA}'; curl -fsS http://127.0.0.1:8000/v2/auth/health >/dev/null; echo PRODUCTION_COMMIT=\${live_sha}; echo PRODUCTION_HEALTH=OK"
