name: Fix Live Tour CI and deploy report layout

on:
  push:
    paths:
      - '.github/workflows/fix-live-tour-ci-and-deploy-report.yml'

permissions:
  contents: write

concurrency:
  group: fix-live-tour-ci-deploy-report
  cancel-in-progress: false

jobs:
  fix-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Update stale Live Tour regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/test_live_tour_frontend.py',
              "    controls = source.split('className=\"panel live-tour-operator live-tour-controls\"', 1)[1].split('</section>', 1)[0]\n",
              "    controls_anchor = 'live-tour-operator live-tour-controls'\n    assert controls_anchor in source\n    controls = source.split(controls_anchor, 1)[1].split('</section>', 1)[0]\n",
              'dynamic controls class regression',
          )
          replace_once(
              'tests/test_live_tour_frontend.py',
              "    for label in ('Cập nhật lịch nghỉ', 'Đi làm', 'Nghỉ phép', 'Nghỉ giữa ca', 'Kết thúc nghỉ', 'Hủy Booking', 'Đổi nhân viên', 'Xuống cuối', 'Lên đầu', 'STT', 'Đổi STT'):\n",
              "    for label in ('Cập nhật lịch nghỉ', 'Đi làm', 'Nghỉ phép', 'Nghỉ giữa ca', 'Kết thúc nghỉ', 'Hủy Booking', 'Hủy Thực hiện', 'Đổi nhân viên', 'Xuống cuối', 'Lên đầu', 'STT', 'Đổi STT'):\n",
              'cancel-start control regression',
          )
          replace_once(
              'web-v2/tests/liveTourAppointments.test.mjs',
              "    assert.deepEqual(actions.slice(0, 10), [\n      'Cập nhật lịch nghỉ', 'Đi làm', 'Nghỉ phép', 'Hủy Booking',\n      'Đổi nhân viên', 'Nghỉ giữa ca', 'Kết thúc nghỉ', 'Xuống cuối',\n      'Lên đầu', 'Đổi STT',\n    ])",
              "    assert.deepEqual(actions.slice(0, 11), [\n      'Cập nhật lịch nghỉ', 'Đi làm', 'Nghỉ phép', 'Hủy Booking',\n      'Hủy Thực hiện', 'Đổi nhân viên', 'Nghỉ giữa ca', 'Kết thúc nghỉ',\n      'Xuống cuối', 'Lên đầu', 'Đổi STT',\n    ])",
              'admin action order regression',
          )
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check "pytest==8.4.2" "httpx2>=2,<3" -r requirements.txt
          cd web-v2
          npm ci

      - name: Run full regression suites
        run: |
          python -m pytest -q
          cd web-v2
          npm test
          npm run build

      - name: Validate report one-row layout
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('web-v2/src/components/LiveTourRevenueSummary.css').read_text(encoding='utf-8')
          if css.count('grid-template-columns:repeat(4,minmax(0,1fr))') < 2:
              raise SystemExit('Report summary is not fixed to four columns on desktop and mobile')
          print('REPORT_LAYOUT=FOUR_COLUMNS_DESKTOP_AND_MOBILE')
          PY
          git diff --check

      - name: Commit regression fixes
        run: |
          git config user.name 'vera-spa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/test_live_tour_frontend.py web-v2/tests/liveTourAppointments.test.mjs
          git commit -m 'Update Live Tour regression expectations'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy latest tested main to production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 180 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify production commit and API health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "set -e; pid=\$(pgrep -n -f '[v]era_web_v2_api_v38:app'); release_dir=\$(readlink -f /proc/\${pid}/cwd); live_sha=\$(git -C \"\${release_dir}\" rev-parse HEAD); test \"\${live_sha}\" = '${DEPLOY_SHA}'; curl -fsS http://127.0.0.1:8000/v2/auth/health >/dev/null; echo PRODUCTION_COMMIT=\${live_sha}; echo PRODUCTION_HEALTH=OK"
