name: Set appearance room height max 1000

on:
  push:
    paths:
      - '.github/workflows/set-appearance-room-height-max-1000.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Raise room height limit to 1000 px
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web-v2/src/pages/AppearanceSettingsPage.jsx')
          text = path.read_text(encoding='utf-8')
          old = 'label="Độ cao phòng (px)" value={current.room.height} min={0} max={260}'
          new = 'label="Độ cao phòng (px)" value={current.room.height} min={0} max={1000}'
          if old not in text:
              raise SystemExit('room height max=260 anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('ROOM_HEIGHT_MAX_1000=OK')
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Verify and build
        working-directory: web-v2
        run: |
          set -euo pipefail
          npm ci
          grep -q 'label="Độ cao phòng (px)" value={current.room.height} min={0} max={1000}' src/pages/AppearanceSettingsPage.jsx
          npm run build

      - name: Commit functional change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-v2/src/pages/AppearanceSettingsPage.jsx
          git commit -m 'Allow Live Tour room height up to 1000 px'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact functional commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 180 /opt/vera-spa/deploy.sh '$DEPLOY_SHA'"

      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "set -e; pid=\$(pgrep -n -f '[v]era_web_v2_api_v38:app'); release_dir=\$(readlink -f /proc/\${pid}/cwd); live_sha=\$(git -C \"\${release_dir}\" rev-parse HEAD); test \"\${live_sha}\" = '$DEPLOY_SHA'; curl -fsS http://127.0.0.1:8000/v2/auth/health >/dev/null; echo PRODUCTION_COMMIT=\${live_sha}; echo PRODUCTION_HEALTH=OK"
