name: Fix TourVera health release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cloudbuild-env-delimiter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align TourVera health release and clean temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cloudbuild.yaml')
          text = path.read_text(encoding='utf-8')
          old = "expected='tour-leave-sync-2026-09-01.1'"
          new = "expected='tour-leave-sync-2026-09-02.2-cp-only'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old TourVera health release, found={count}')
          updated = text.replace(old, new, 1)
          if new not in updated:
              raise SystemExit('New TourVera health release was not written')
          path.write_text(updated, encoding='utf-8')
          PY

          git rm --ignore-unmatch \
            .github/workflows/fix-cloudbuild-env-delimiter.yml \
            .github/workflows/cloudrun-timesoft-queue-check.yml

          git diff --check
          git diff -- cloudbuild.yaml .github/workflows

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align TourVera health release'
          git push origin HEAD:main
