name: Production Queue Runtime Inspection

on:
  push:
    branches:
      - ops/queue-runtime-check-20260916
    paths:
      - '.github/workflows/queue-runtime-production-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect PostgreSQL Queue and Live Tour worker
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          pid="$(pgrep -n -f '[v]era_web_v2_api_v38:app' || true)"
          if [ -z "$pid" ]; then
            echo 'RUNTIME_PROCESS=missing'
            exit 1
          fi
          release_dir="$(readlink -f "/proc/${pid}/cwd")"
          echo "RUNTIME_PROCESS=present"
          echo "RUNTIME_PID=$pid"
          echo "RUNTIME_RELEASE_DIR=$release_dir"
          echo "RUNTIME_SHA=$(git -C "$release_dir" rev-parse HEAD 2>/dev/null || echo unknown)"
          echo "RUNTIME_STARTED=$(ps -o lstart= -p "$pid" | sed 's/^ *//')"

          echo '--- LOCAL_QUEUE_HEALTH ---'
          curl -fsS http://127.0.0.1:8000/v2/live-tour/projection-queue/health
          echo

          env_dump="$(mktemp)"
          trap 'rm -f "$env_dump"' EXIT
          tr '\0' '\n' < "/proc/${pid}/environ" > "$env_dump"
          for key in DB_HOST DB_PORT DB_NAME DB_USER DB_PASS; do
            value="$(grep -m1 "^${key}=" "$env_dump" | cut -d= -f2- || true)"
            if [ -z "$value" ]; then
              echo "DB_ENV_${key}=missing"
              exit 1
            fi
            export "$key=$value"
          done

          if ! command -v psql >/dev/null 2>&1; then
            echo 'PSQL=missing'
            exit 1
          fi
          echo 'PSQL=present'

          export PGHOST="$DB_HOST"
          export PGPORT="$DB_PORT"
          export PGDATABASE="$DB_NAME"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASS"

          echo '--- QUEUE_COUNTS_AND_METRICS ---'
          psql -X -v ON_ERROR_STOP=1 -A -F '|' -t <<'SQL'
          SELECT 'QUEUE_TABLE', COALESCE(to_regclass('public.vera_background_job')::text,'missing');
          SELECT 'COUNT', status, COUNT(*)
          FROM vera_background_job
          WHERE queue_name='live_tour_projection'
          GROUP BY status
          ORDER BY status;
          SELECT
            'METRIC',
            COUNT(*) FILTER (WHERE status='pending') AS pending,
            COUNT(*) FILTER (WHERE status='retry') AS retry,
            COUNT(*) FILTER (WHERE status='processing') AS processing,
            COUNT(*) FILTER (WHERE status='processing' AND locked_at < NOW() - INTERVAL '10 minutes') AS stale_processing,
            COUNT(*) FILTER (WHERE status='failed') AS failed,
            COUNT(*) FILTER (WHERE attempts > 0) AS jobs_with_attempts,
            COALESCE(MAX(attempts),0) AS max_attempts,
            COALESCE(ROUND(EXTRACT(EPOCH FROM (NOW()-MAX(completed_at)))::numeric,1),-1) AS last_done_age_seconds,
            COUNT(*) FILTER (WHERE completed_at >= NOW()-INTERVAL '30 minutes') AS done_last_30m,
            COUNT(*) FILTER (WHERE completed_at >= NOW()-INTERVAL '2 hours') AS done_last_2h
          FROM vera_background_job
          WHERE queue_name='live_tour_projection';
          SQL

          echo '--- RECENT_QUEUE_JOBS ---'
          psql -X -v ON_ERROR_STOP=1 -A -F '|' -t <<'SQL'
          SELECT
            id,
            job_key,
            status,
            attempts,
            ROUND(EXTRACT(EPOCH FROM (NOW()-created_at))::numeric,1) AS age_seconds,
            ROUND(EXTRACT(EPOCH FROM (NOW()-updated_at))::numeric,1) AS updated_age_seconds,
            COALESCE(TO_CHAR(locked_at AT TIME ZONE 'Asia/Ho_Chi_Minh','YYYY-MM-DD HH24:MI:SS'),'') AS locked_vn,
            COALESCE(TO_CHAR(completed_at AT TIME ZONE 'Asia/Ho_Chi_Minh','YYYY-MM-DD HH24:MI:SS'),'') AS completed_vn,
            LEFT(REPLACE(COALESCE(last_error,''), E'\n', ' '), 240) AS last_error
          FROM vera_background_job
          WHERE queue_name='live_tour_projection'
          ORDER BY id DESC
          LIMIT 20;
          SQL

          echo '--- DONE_CADENCE ---'
          psql -X -v ON_ERROR_STOP=1 -A -F '|' -t <<'SQL'
          WITH recent AS (
            SELECT id, completed_at,
                   LAG(completed_at) OVER (ORDER BY completed_at) AS prev_completed
            FROM vera_background_job
            WHERE queue_name='live_tour_projection'
              AND status='done'
              AND completed_at IS NOT NULL
            ORDER BY completed_at DESC
            LIMIT 15
          )
          SELECT id,
                 TO_CHAR(completed_at AT TIME ZONE 'Asia/Ho_Chi_Minh','YYYY-MM-DD HH24:MI:SS'),
                 CASE WHEN prev_completed IS NULL THEN NULL
                      ELSE ROUND(EXTRACT(EPOCH FROM (completed_at-prev_completed))::numeric,1)
                 END AS gap_seconds
          FROM recent
          ORDER BY completed_at DESC;
          SQL

          echo '--- RECENT_PROJECTION_ERRORS ---'
          if command -v journalctl >/dev/null 2>&1; then
            journalctl --since '12 hours ago' --no-pager 2>/dev/null \
              | grep -Ei 'Live Tour projection|projection enqueue failed|projection worker|worker lease expired|vera_background_job' \
              | tail -n 120 || true
          else
            echo 'journalctl unavailable'
          fi
          REMOTE
