name: Deploy VERA SPA Web V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vera-web-v2-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vera-web-v2-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Validate Web V2 public configuration
        env:
          # These are browser-visible public values, not database/service-role secrets.
          # Repository variables can still override the known VERA production defaults.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://nunxfjhrszmlyyrvphuq.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_idnn4HeEozpAonmSqM4Tgw_bB8HW4FX' }}
          VITE_VERA_API_BASE_URL: https://api.veraspa.vn
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing repository variable: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing repository variable: VITE_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$VITE_VERA_API_BASE_URL" || { echo "Missing repository variable: VITE_VERA_API_BASE_URL"; exit 1; }

      - name: Install Web V2 dependencies
        working-directory: web-v2
        run: npm ci

      - name: Lint Web V2
        working-directory: web-v2
        run: npm run lint

      - name: Build Web V2
        working-directory: web-v2
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://nunxfjhrszmlyyrvphuq.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_idnn4HeEozpAonmSqM4Tgw_bB8HW4FX' }}
          VITE_VERA_API_BASE_URL: https://api.veraspa.vn
          VITE_VERA_DEMO_MODE: "0"
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web-v2/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
