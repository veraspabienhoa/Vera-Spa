name: Fix Cloud Build Policy V3.9 health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cloudbuild-policy-v39-health.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align Policy V3.9 health assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cloudbuild.yaml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "expected='3.9-policy-payroll-period'": "expected='3.9-policy-payroll-named-report-sheet'",
              "payload.get('payroll_sheet') == 'Sheet2'": "payload.get('payroll_sheet') == 'Báo cáo doanh thu hóa đơn'",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found={count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/fix-cloudbuild-policy-v39-health.yml
          git diff --check
          git diff -- cloudbuild.yaml .github/workflows/fix-cloudbuild-policy-v39-health.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align Policy V3.9 health check'
          git push origin HEAD:main
