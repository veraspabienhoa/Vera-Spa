name: Diagnose retired employee name reuse (read only)

on:
  push:
    branches: [codex/diagnose-new-name-20261009]
    paths: [.github/workflows/diagnose-staff-name-reuse.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect reference locations without personal data or database writes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); cd "$release_dir"; git rev-parse HEAD; /opt/vera-spa/.venv/bin/python -' <<'PY'
          import json, os, time
          from sqlalchemy import create_engine, text
          from sqlalchemy.pool import NullPool
          from vera_vps_data_check import _database_url, _running_api_environment
          from vera_web_v2_runtime_env import RUNTIME_ENV_KEYS, load_managed_runtime_environment
          env = {k: os.environ.get(k, '') for k in RUNTIME_ENV_KEYS} if load_managed_runtime_environment() else _running_api_environment()
          engine = create_engine(_database_url(env), poolclass=NullPool, connect_args={'connect_timeout':5, 'sslmode':env.get('DB_SSLMODE','require'), 'options':'-c default_transaction_read_only=on -c statement_timeout=2500 -c lock_timeout=500'})
          started = time.monotonic()
          try:
              with engine.begin() as conn:
                  quote = conn.dialect.identifier_preparer.quote
                  directory = conn.execute(text("SELECT COALESCE(payload->>'__deleted','false') AS deleted, COALESCE(payload->>'Trạng thái làm việc',payload->>'employment_status','') AS status FROM employees WHERE lower(btrim(username))='new'")).mappings().all()
                  print('DIRECTORY_STATE='+json.dumps([dict(r) for r in directory], ensure_ascii=True))
                  def locations(value, path='$'):
                      if isinstance(value,str) and value.strip().lower()=='new': return [path]
                      if isinstance(value,list): return sorted({p for item in value for p in locations(item,path+'[*]')})
                      if isinstance(value,dict): return sorted({p for key,item in value.items() for p in locations(item,path+'.'+str(key))})
                      return []
                  for table in ('vera_dataset_cache','vera_primary_dataset'):
                      rows=conn.execute(text(f"SELECT dataset_key,payload FROM {table} WHERE dataset_key IN ('payroll_history','tichluy')")).mappings().all()
                      for row in rows:
                          print('PAYLOAD_SHAPE='+json.dumps({'table':table,'dataset':row['dataset_key'],'type':type(row['payload']).__name__,'name_paths':locations(row['payload'])},ensure_ascii=True))
                  rows=conn.execute(text("SELECT dataset,payload FROM vera_phase16_record WHERE jsonb_path_exists(payload, '$.** ? (@ == $name)', CAST(:vars AS jsonb)) LIMIT 50"),{'vars':json.dumps({'name':'New'})}).mappings().all()
                  for row in rows:
                      print('AUDIT_SHAPE='+json.dumps({'dataset':row['dataset'],'name_paths':locations(row['payload'])},ensure_ascii=True))
                  print('DATABASE_WRITES=false')
          except Exception as exc:
              print('INSPECTION_ERROR='+type(exc).__name__)
              raise SystemExit(1)
          finally:
              engine.dispose()
          PY
