name: One-shot PostgreSQL Live Tour queue

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: live-tour-postgres-queue
  cancel-in-progress: false

jobs:
  patch-test-commit-deploy:
    if: contains(github.event.head_commit.message, '[live-tour-postgres-queue]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Implement PostgreSQL outbox and 5-minute projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return source.replace(old, new, 1)

          queue = '''"""Small durable PostgreSQL job queue for background application work.

          Claim transactions are intentionally short.  A worker marks one item processing
          with FOR UPDATE SKIP LOCKED, commits, performs slow work without a checked-out
          queue transaction, then opens a new transaction to mark success/retry.
          """
          from __future__ import annotations

          import json
          from typing import Any

          from sqlalchemy import text

          TABLE = "vera_background_job"
          RELEASE = "postgres-job-queue-2026-09-16.1"
          MAX_ATTEMPTS = 12


          def ensure_schema_conn(conn) -> None:
              conn.execute(text(f"""
                  CREATE TABLE IF NOT EXISTS {TABLE} (
                      id BIGSERIAL PRIMARY KEY,
                      queue_name TEXT NOT NULL,
                      job_key TEXT NOT NULL,
                      payload JSONB NOT NULL DEFAULT '{{}}'::jsonb,
                      status TEXT NOT NULL DEFAULT 'pending',
                      attempts INTEGER NOT NULL DEFAULT 0,
                      available_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                      locked_at TIMESTAMPTZ,
                      completed_at TIMESTAMPTZ,
                      last_error TEXT,
                      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                      updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                      UNIQUE(queue_name, job_key)
                  )
              """))
              conn.execute(text(
                  f"CREATE INDEX IF NOT EXISTS idx_{TABLE}_ready "
                  f"ON {TABLE}(queue_name,status,available_at,id)"
              ))


          def enqueue_conn(conn, queue_name: str, job_key: str, payload: dict[str, Any] | None = None) -> bool:
              result = conn.execute(text(f"""
                  INSERT INTO {TABLE}(queue_name,job_key,payload,status,attempts,available_at,created_at,updated_at)
                  VALUES(:queue_name,:job_key,CAST(:payload AS jsonb),'pending',0,NOW(),NOW(),NOW())
                  ON CONFLICT(queue_name,job_key) DO NOTHING
              """), {
                  "queue_name": str(queue_name), "job_key": str(job_key),
                  "payload": json.dumps(payload or {}, ensure_ascii=False, default=str),
              })
              return bool(getattr(result, "rowcount", 1))


          def enqueue(engine_instance, queue_name: str, job_key: str, payload: dict[str, Any] | None = None) -> bool:
              with engine_instance().begin() as conn:
                  return enqueue_conn(conn, queue_name, job_key, payload)


          def _payload(value: Any) -> dict[str, Any]:
              if isinstance(value, dict):
                  return dict(value)
              try:
                  parsed = json.loads(str(value or "{}"))
                  return dict(parsed) if isinstance(parsed, dict) else {}
              except Exception:
                  return {}


          def claim_one(engine_instance, queue_name: str) -> dict[str, Any] | None:
              with engine_instance().begin() as conn:
                  # Recover a worker killed after claim without allowing permanent zombies.
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status='retry', available_at=NOW(), locked_at=NULL,
                          last_error=COALESCE(last_error,'worker lease expired'), updated_at=NOW()
                      WHERE queue_name=:queue_name AND status='processing'
                        AND locked_at < NOW() - INTERVAL '10 minutes'
                  """), {"queue_name": queue_name})
                  row = conn.execute(text(f"""
                      SELECT id,queue_name,job_key,payload,attempts
                      FROM {TABLE}
                      WHERE queue_name=:queue_name
                        AND status IN ('pending','retry')
                        AND available_at<=NOW()
                      ORDER BY available_at,id
                      FOR UPDATE SKIP LOCKED
                      LIMIT 1
                  """), {"queue_name": queue_name}).mappings().first()
                  if not row:
                      return None
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status='processing',locked_at=NOW(),updated_at=NOW()
                      WHERE id=:id
                  """), {"id": row["id"]})
                  item = dict(row)
                  item["payload"] = _payload(item.get("payload"))
                  return item


          def mark_done(engine_instance, item_id: int) -> None:
              with engine_instance().begin() as conn:
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status='done',completed_at=NOW(),locked_at=NULL,last_error=NULL,updated_at=NOW()
                      WHERE id=:id
                  """), {"id": int(item_id)})


          def reschedule(engine_instance, item_id: int, *, delay_seconds: int = 5) -> None:
              with engine_instance().begin() as conn:
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status='retry',available_at=NOW()+(:delay*INTERVAL '1 second'),
                          locked_at=NULL,updated_at=NOW()
                      WHERE id=:id
                  """), {"id": int(item_id), "delay": max(1, int(delay_seconds))})


          def mark_retry(engine_instance, item: dict[str, Any], exc: Exception) -> None:
              attempts = int(item.get("attempts") or 0) + 1
              delay = min(3600, 15 * (2 ** min(attempts - 1, 8)))
              status = "failed" if attempts >= MAX_ATTEMPTS else "retry"
              with engine_instance().begin() as conn:
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status=:status,attempts=:attempts,
                          available_at=NOW()+(:delay*INTERVAL '1 second'),locked_at=NULL,
                          last_error=:error,updated_at=NOW()
                      WHERE id=:id
                  """), {
                      "id": int(item["id"]), "status": status, "attempts": attempts,
                      "delay": delay, "error": f"{type(exc).__name__}: {exc}"[:2000],
                  })


          def counts(engine_instance, queue_name: str) -> dict[str, int]:
              with engine_instance().connect() as conn:
                  rows = conn.execute(text(f"""
                      SELECT status,COUNT(*) AS n FROM {TABLE}
                      WHERE queue_name=:queue_name GROUP BY status
                  """), {"queue_name": queue_name}).mappings().all()
              return {str(row["status"]): int(row["n"]) for row in rows}
          '''
          queue = "\n".join(line[10:] if line.startswith("          ") else line for line in queue.splitlines()) + "\n"
          Path('vera_postgres_job_queue.py').write_text(queue, encoding='utf-8')

          path = Path('vera_web_v2_live_tour.py')
          source = path.read_text(encoding='utf-8')
          source = one(
              source,
              'import vera_live_tour_relational as relational_store\n',
              'import vera_live_tour_relational as relational_store\nimport vera_postgres_job_queue as job_queue\n',
              'queue import',
          )
          source = one(
              source,
              'STATE_VERSION = 1\nBUSINESS_DAY_CUTOFF = time(11, 10)\n',
              'STATE_VERSION = 1\nPROJECTION_REFRESH_SECONDS = 300\nPROJECTION_QUEUE = "live_tour_projection"\nPROJECTION_RELEASE = "live-tour-projection-queue-2026-09-16.1"\nBUSINESS_DAY_CUTOFF = time(11, 10)\n',
              'projection constants',
          )
          source = one(
              source,
              'def _read_state(conn, now: datetime, *, for_update: bool = False, attendance_records=None) -> tuple[dict[str, Any], int]:\n',
              'def _read_state(conn, now: datetime, *, for_update: bool = False, attendance_records=None, directory_records=None, leave_records=None) -> tuple[dict[str, Any], int]:\n',
              'read state signature',
          )
          source = one(
              source,
              '''        directory = _employee_directory(conn, now)\n        _reconcile_roster(\n            state, directory, _new_directory_employee,\n            today=now.astimezone(VN_TZ).date().isoformat(),\n        )\n        leave_day = (now.astimezone(VN_TZ) - timedelta(hours=5)).date()\n        leaves = [dict(item) for item in conn.execute(text(\n            "SELECT employee_name, leave_reason, leave_type FROM leave_records WHERE leave_date=:day ORDER BY id"\n        ), {"day": leave_day}).mappings().all()]\n''',
              '''        directory = _employee_directory(conn, now) if directory_records is None else directory_records\n        _reconcile_roster(\n            state, directory, _new_directory_employee,\n            today=now.astimezone(VN_TZ).date().isoformat(),\n        )\n        leave_day = (now.astimezone(VN_TZ) - timedelta(hours=5)).date()\n        leaves = leave_records\n        if leaves is None:\n            leaves = [dict(item) for item in conn.execute(text(\n                "SELECT employee_name, leave_reason, leave_type FROM leave_records WHERE leave_date=:day ORDER BY id"\n            ), {"day": leave_day}).mappings().all()]\n''',
              'preloaded directory leaves',
          )
          source = one(
              source,
              '    attendance = AttendanceBreakReader(attendance_reader) if attendance_reader else None\n',
              '    attendance = AttendanceBreakReader(attendance_reader, ttl=PROJECTION_REFRESH_SECONDS) if attendance_reader else None\n',
              'attendance ttl',
          )

          start = source.index('    scheduler_stop = Event()\n')
          end = source.index('    previous_lifespan = app.router.lifespan_context\n', start)
          scheduler = '''    scheduler_stop = Event()\n    scheduler_thread = None\n    worker_thread = None\n\n    def projection_job_key(now):\n        bucket = int(now.timestamp()) // PROJECTION_REFRESH_SECONDS\n        return f"{now.astimezone(timezone).date().isoformat()}:{bucket}"\n\n    def enqueue_projection(*, reason="scheduled", job_key=None):\n        now = datetime.now(timezone)\n        return job_queue.enqueue(\n            engine_instance, PROJECTION_QUEUE, job_key or projection_job_key(now),\n            {"reason": reason, "requested_at": now.isoformat()},\n        )\n\n    def projection_inputs(now):\n        # No Live Tour board lock is held while reading attendance/directory/leave inputs.\n        with engine_instance().begin() as conn:\n            records = (\n                attendance.read(conn, now.astimezone(timezone).date(), force=True)\n                if attendance else None\n            )\n            directory = _employee_directory(conn, now)\n            leave_day = (now.astimezone(timezone) - timedelta(hours=5)).date()\n            leaves = [dict(item) for item in conn.execute(text(\n                "SELECT employee_name, leave_reason, leave_type FROM leave_records WHERE leave_date=:day ORDER BY id"\n            ), {"day": leave_day}).mappings().all()]\n        return records, directory, leaves\n\n    def apply_projection(now, records, directory, leaves):\n        # The critical section contains only canonical state read/merge/write.\n        with engine_instance().begin() as conn:\n            if not try_state_lock(conn, STATE_LOCK):\n                return False\n            exists = conn.execute(text(\n                "SELECT revision FROM vera_app_setting WHERE category=:category AND setting_key=:key"\n            ), {"category": STATE_CATEGORY, "key": STATE_KEY}).mappings().first()\n            if not exists:\n                return True  # Never bootstrap an unused board from a background job.\n            read_state(\n                conn, now, for_update=True, attendance_records=records,\n                directory_records=directory, leave_records=leaves,\n            )\n        return True\n\n    def scheduled_projection():\n        while not scheduler_stop.is_set():\n            try:\n                enqueue_projection(reason="scheduled")\n            except Exception:\n                logging.getLogger(__name__).exception("Live Tour projection enqueue failed")\n            scheduler_stop.wait(PROJECTION_REFRESH_SECONDS)\n\n    def projection_worker():\n        while not scheduler_stop.is_set():\n            item = None\n            try:\n                item = job_queue.claim_one(engine_instance, PROJECTION_QUEUE)\n                if not item:\n                    scheduler_stop.wait(2)\n                    continue\n                now = datetime.now(timezone)\n                records, directory, leaves = projection_inputs(now)\n                if not apply_projection(now, records, directory, leaves):\n                    job_queue.reschedule(engine_instance, int(item["id"]), delay_seconds=5)\n                    continue\n                job_queue.mark_done(engine_instance, int(item["id"]))\n            except Exception as exc:\n                if item is not None:\n                    try:\n                        job_queue.mark_retry(engine_instance, item, exc)\n                    except Exception:\n                        logging.getLogger(__name__).exception("Live Tour projection retry bookkeeping failed")\n                else:\n                    logging.getLogger(__name__).exception("Live Tour projection worker failed before claim")\n                scheduler_stop.wait(2)\n\n    def start_scheduler():\n        nonlocal scheduler_thread, worker_thread\n        scheduler_stop.clear()\n        scheduler_thread = Thread(target=scheduled_projection, name="live-tour-projection-scheduler", daemon=True)\n        worker_thread = Thread(target=projection_worker, name="live-tour-projection-worker", daemon=True)\n        scheduler_thread.start()\n        worker_thread.start()\n\n    def stop_scheduler():\n        scheduler_stop.set()\n        for thread in (scheduler_thread, worker_thread):\n            if thread:\n                thread.join(timeout=2)\n\n'''
          source = source[:start] + scheduler + source[end:]

          source = one(
              source,
              '    def read_state(conn, now, *, for_update=False, attendance_records=_ATTENDANCE_UNSET):\n',
              '    def read_state(conn, now, *, for_update=False, attendance_records=_ATTENDANCE_UNSET, directory_records=None, leave_records=None):\n',
              'route read state signature',
          )
          source = one(
              source,
              '        state, revision = _read_state(conn, now, for_update=for_update, attendance_records=records)\n',
              '        state, revision = _read_state(conn, now, for_update=for_update, attendance_records=records, directory_records=directory_records, leave_records=leave_records)\n',
              'route read state preloads',
          )

          read_start = source.index('    def read_board(conn, now, *, project=True):\n')
          read_end = source.index('    def permissions(conn, ident)', read_start)
          read_board = '''    def read_board(conn, now, *, project=True):\n        # Request threads only read the last committed board snapshot. Projection is\n        # owned by the PostgreSQL queue worker, so GET traffic cannot extend STATE_LOCK.\n        row = conn.execute(text("""\n            SELECT value_json, revision FROM vera_app_setting\n            WHERE category=:category AND setting_key=:key\n        """), {"category": STATE_CATEGORY, "key": STATE_KEY}).mappings().first()\n        if row:\n            return _normalize_state(row.get("value_json"), now), int(row.get("revision") or 0)\n        # First bootstrap is the only request-path projection and happens once.\n        acquire_state_lock(conn, STATE_LOCK)\n        return read_state(conn, now)\n\n'''
          source = source[:read_start] + read_board + source[read_end:]

          marker = '            grants = permissions(conn, ident)\n            acquire_state_lock(conn, STATE_LOCK)\n'
          replacement = '''            grants = permissions(conn, ident)\n            if action == "sync_daily_status":\n                state, revision = read_board(conn, now, project=False)\n                if body.expected_revision is None:\n                    raise HTTPException(428, "Thiếu phiên bản Live Tour. Hãy tải lại bảng trước khi thao tác.")\n                if body.expected_revision != revision:\n                    raise HTTPException(409, "Live Tour đã thay đổi ở thiết bị khác. Hãy làm mới rồi thao tác lại.")\n                job_queue.enqueue_conn(\n                    conn, PROJECTION_QUEUE, f"manual:{idempotency_key}",\n                    {"reason": "manual", "actor": actor, "requested_at": now.isoformat()},\n                )\n                return action_response(\n                    state=state, revision=revision, now=now, action=action,\n                    result={"queued": True, "refresh_seconds": PROJECTION_REFRESH_SECONDS}, grants=grants,\n                )\n            acquire_state_lock(conn, STATE_LOCK)\n'''
          source = one(source, marker, replacement, 'manual projection enqueue')

          action_start = source.index('            projection_free_actions = {\n')
          action_end_marker = '            previous = _idempotency_replay(\n'
          action_end = source.index(action_end_marker, action_start)
          source = source[:action_start] + '            state, revision = read_state_without_projection(conn, now, for_update=True)\n' + source[action_end:]
          source = source.replace(
              '            if action == "sync_daily_status":\n                payload = {**payload, "today": now.astimezone(VN_TZ).date().isoformat(), "directory": _employee_directory(conn), "leaves": [dict(row) for row in conn.execute(text("SELECT employee_name, leave_reason, leave_type FROM leave_records WHERE leave_date=:day ORDER BY id"), {"day": now.astimezone(VN_TZ).date()}).mappings().all()]}\n',
              '', 1,
          )

          health_anchor = '    @app.get("/v2/live-tour/export.xlsx")\n'
          health_route = '''    @app.get("/v2/live-tour/projection-queue/health")\n    def live_tour_projection_queue_health():\n        return {\n            "ok": True, "release": PROJECTION_RELEASE,\n            "queue_release": job_queue.RELEASE,\n            "refresh_seconds": PROJECTION_REFRESH_SECONDS,\n            "claim_strategy": "for_update_skip_locked",\n            "counts": job_queue.counts(engine_instance, PROJECTION_QUEUE),\n        }\n\n'''
          source = one(source, health_anchor, health_route + health_anchor, 'queue health route')
          path.write_text(source, encoding='utf-8')

          # TimeSoft is already an out-of-process scheduled job. One scheduler invocation now
          # performs one sync only; the 30-second tail is deliberately removed.
          snapshot = '''"""Five-minute TimeSoft snapshot job.

          The external scheduler owns cadence. Each invocation performs exactly one TimeSoft
          sync and exits; there is no 30-second polling tail competing with application work.
          """
          from __future__ import annotations

          import sys

          import timesoft_sync_job as ts
          from timesoft_detailed_checkin import install as install_detailed_checkin
          from timesoft_http_auth import install as install_http_auth
          from timesoft_recalculate_checkin import install as install_recalculate_checkin
          from timesoft_tour_snapshot_cache import install as install_tour_snapshot_cache

          RELEASE = "timesoft-direct-attendance-2026-09-16-v4-5min"

          install_recalculate_checkin(ts)
          install_detailed_checkin(ts)
          install_http_auth(ts)
          install_tour_snapshot_cache(ts)


          def _skip_tour_penalties(*_args, **_kwargs):
              return {"eligible": 0, "added": 0, "skipped": 0, "errors": 0}


          def main() -> int:
              ts.process_tour_penalties = _skip_tour_penalties
              ts._log(
                  "V85.2 DIRECT ATTENDANCE: one TimeSoft -> PostgreSQL synchronization per "
                  "scheduled run; scheduler cadence is five minutes; no fast polling tail."
              )
              return int(ts.run_sync())


          if __name__ == "__main__":
              sys.exit(main())
          '''
          snapshot = "\n".join(line[10:] if line.startswith("          ") else line for line in snapshot.splitlines()) + "\n"
          Path('timesoft_snapshot_job.py').write_text(snapshot, encoding='utf-8')

          cloud = Path('cloudbuild.yaml')
          cloud_source = cloud.read_text(encoding='utf-8')
          cloud_source = cloud_source.replace(',TIMESOFT_FAST_CHECKIN_SECONDS=30,TIMESOFT_FAST_CHECKIN_WINDOW_SECONDS=240', '')
          cloud.write_text(cloud_source, encoding='utf-8')

          schema_path = Path('vera_vps_concurrency_schema.py')
          schema = schema_path.read_text(encoding='utf-8')
          schema = one(schema, 'import vera_resource_concurrency as concurrency\n', 'import vera_resource_concurrency as concurrency\nimport vera_postgres_job_queue as background_queue\n', 'schema queue import')
          schema = one(schema, '    live_tour.CLAIM_TABLE,\n)', '    live_tour.CLAIM_TABLE,\n    background_queue.TABLE,\n)', 'required queue table')
          schema = one(schema, '    concurrency.ensure_schema(conn)\n    live_tour.ensure_schema(conn)\n', '    concurrency.ensure_schema(conn)\n    live_tour.ensure_schema(conn)\n    background_queue.ensure_schema_conn(conn)\n', 'ensure queue schema')
          schema_path.write_text(schema, encoding='utf-8')

          # Production deploy verifies the queue after schema migration.
          deploy_path = Path('.github/workflows/deploy-vps.yml')
          deploy = deploy_path.read_text(encoding='utf-8')
          verify_anchor = '      - name: Verify production local Auth health\n'
          verify_step = '''      - name: Verify Live Tour projection queue health\n        shell: bash\n        run: |\n          python - <<'PY'\n          import json, time, urllib.request\n          url = "https://api.veraspa.vn/v2/live-tour/projection-queue/health"\n          last = None\n          for attempt in range(1, 7):\n              try:\n                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})\n                  with urllib.request.urlopen(request, timeout=10) as response:\n                      payload = json.load(response)\n                  if (payload.get("ok") is True\n                          and payload.get("release") == "live-tour-projection-queue-2026-09-16.1"\n                          and int(payload.get("refresh_seconds") or 0) == 300\n                          and payload.get("claim_strategy") == "for_update_skip_locked"):\n                      print(json.dumps(payload, ensure_ascii=False, sort_keys=True))\n                      break\n                  last = RuntimeError(f"unexpected payload: {payload!r}")\n              except Exception as exc:\n                  last = exc\n              time.sleep(3)\n          else:\n              raise SystemExit(f"Live Tour projection queue health failed: {last}")\n          PY\n\n'''
          deploy = one(deploy, verify_anchor, verify_step + verify_anchor, 'deploy queue health')
          deploy_path.write_text(deploy, encoding='utf-8')

          # Intentional architecture test updates.
          Path('tests/test_live_tour_action_lock_performance.py').write_text('''from pathlib import Path\n\ndef src():\n    return Path("vera_web_v2_live_tour.py").read_text(encoding="utf-8")\n\ndef test_all_interactive_actions_use_canonical_snapshot_only():\n    action = src().split('@app.post("/v2/live-tour/action")', 1)[1].split('@app.get("/v2/live-tour/projection-queue/health")', 1)[0]\n    assert "read_state_without_projection(conn, now, for_update=True)" in action\n    assert "projection_free_actions" not in action\n\ndef test_projection_reads_inputs_before_board_lock():\n    body = src()\n    inputs = body.split("def projection_inputs(now):", 1)[1].split("def apply_projection", 1)[0]\n    apply = body.split("def apply_projection", 1)[1].split("def scheduled_projection", 1)[0]\n    assert "attendance.read(" in inputs\n    assert "_employee_directory(" in inputs\n    assert "FROM leave_records" in inputs\n    assert "STATE_LOCK" not in inputs\n    assert "try_state_lock(conn, STATE_LOCK)" in apply\n    assert "attendance.read(" not in apply\n\ndef test_projection_is_queued_every_five_minutes():\n    body = src()\n    assert "PROJECTION_REFRESH_SECONDS = 300" in body\n    assert "scheduler_stop.wait(PROJECTION_REFRESH_SECONDS)" in body\n    assert "job_queue.claim_one(engine_instance, PROJECTION_QUEUE)" in body\n\ndef test_legacy_test_writers_are_compatible():\n    assert "def _write_state_compat(" in src()\n''', encoding='utf-8')

          Path('tests/test_live_tour_lock_scope.py').write_text('''from pathlib import Path\n\nSOURCE = Path(__file__).parents[1] / "vera_web_v2_live_tour.py"\n\ndef source(): return SOURCE.read_text(encoding="utf-8")\n\ndef test_background_projection_reschedules_when_operator_holds_lock():\n    body = source()\n    apply = body[body.index("    def apply_projection"):body.index("    def scheduled_projection") ]\n    worker = body[body.index("    def projection_worker"):body.index("    def start_scheduler") ]\n    assert "if not try_state_lock(conn, STATE_LOCK):" in apply\n    assert "acquire_state_lock(conn, STATE_LOCK)" not in apply\n    assert "job_queue.reschedule" in worker\n\ndef test_permissions_are_resolved_before_mutation_lock():\n    body = source()\n    action = body[body.index('@app.post("/v2/live-tour/action")'):body.index('@app.get("/v2/live-tour/projection-queue/health")')]\n    assert action.index("grants = permissions(conn, ident)") < action.index("acquire_state_lock(conn, STATE_LOCK)")\n\ndef test_request_actions_never_run_attendance_or_leave_projection_under_board_lock():\n    body = source()\n    action = body[body.index('@app.post("/v2/live-tour/action")'):body.index('@app.get("/v2/live-tour/projection-queue/health")')]\n    locked = action[action.index("acquire_state_lock(conn, STATE_LOCK)"):]\n    assert "read_state_without_projection(conn, now, for_update=True)" in locked\n    assert "attendance.read(" not in locked\n    assert "FROM leave_records" not in locked\n    assert "_employee_directory(conn" not in locked\n\ndef test_manual_daily_refresh_enqueues_instead_of_projecting_inline():\n    action = source().split('@app.post("/v2/live-tour/action")', 1)[1].split('@app.get("/v2/live-tour/projection-queue/health")', 1)[0]\n    assert 'action == "sync_daily_status"' in action\n    assert "job_queue.enqueue_conn(" in action\n''', encoding='utf-8')

          backpressure = Path('tests/test_live_tour_lock_backpressure.py')
          bp = backpressure.read_text(encoding='utf-8')
          bp_start = bp.index('def test_all_board_locks_use_nonblocking_guard():')
          bp = bp[:bp_start] + '''def test_all_board_locks_use_nonblocking_guard():\n    source = (Path(__file__).parents[1] / "vera_web_v2_live_tour.py").read_text()\n    assert "pg_advisory_xact_lock(" not in source\n    apply = source[source.index("    def apply_projection"):source.index("    def scheduled_projection") ]\n    assert "try_state_lock(conn, STATE_LOCK)" in apply\n    assert "acquire_state_lock(conn, STATE_LOCK)" not in apply\n    queue = (Path(__file__).parents[1] / "vera_postgres_job_queue.py").read_text()\n    assert "FOR UPDATE SKIP LOCKED" in queue\n'''
          backpressure.write_text(bp, encoding='utf-8')

          direct = Path('tests/test_direct_break_return_penalty.py')
          ds = direct.read_text(encoding='utf-8')
          ds = one(ds, '    assert calls == ["sync", "tail"]\n', '    assert calls == ["sync"]\n', 'direct timesoft test')
          direct.write_text(ds, encoding='utf-8')

          missing = Path('tests/test_missing_checkin_notifications.py')
          ms = missing.read_text(encoding='utf-8')
          ms = ms.replace('def test_alert_is_wired_outside_auto_check_and_into_fast_tail():', 'def test_alert_is_wired_into_the_single_five_minute_timesoft_sync():', 1)
          ms = ms.replace('    snapshot_source = (ROOT / "timesoft_snapshot_job.py").read_text(encoding="utf-8")\n', '    snapshot_source = (ROOT / "timesoft_snapshot_job.py").read_text(encoding="utf-8")\n', 1)
          ms = one(ms, '    assert call in snapshot_source\n', '    assert "return int(ts.run_sync())" in snapshot_source\n    assert "_fast_checkin_tail" not in snapshot_source\n', 'missing alert cadence assertion')
          missing.write_text(ms, encoding='utf-8')

          attendance_test = Path('tests/test_live_tour_attendance_breaktime.py')
          ats = attendance_test.read_text(encoding='utf-8')
          old_start = ats.index('def test_booking_rechecks_faceid_that_arrives_after_board_was_loaded(monkeypatch):')
          replacement_test = '''def test_booking_uses_last_projected_faceid_snapshot_until_five_minute_worker_refresh(monkeypatch):\n    class Clock(datetime):\n        @classmethod\n        def now(cls, tz=None): return NOW\n    monkeypatch.setattr(live, 'datetime', Clock)\n    db, rows = SettingsDatabase(board()), []\n    app = FastAPI()\n    live.install_live_tour_routes(app, engine_instance=lambda: db,\n        current_identity=lambda: RouteIdentity(), require_feature=lambda *_: None,\n        feature_allowed=lambda *_: True, identity_type=RouteIdentity,\n        attendance_reader=lambda *args: rows)\n    client = TestClient(app)\n    loaded = client.get('/v2/live-tour').json()\n    rows.append(record())\n    service = next(row for row in db.stored['services'] if row['name'] == 'Body 90')\n    request = {'action': 'booking', 'expected_revision': loaded['revision'],\n               'idempotency_key': 'booking-before-five-minute-projection',\n               'payload': {'employee_id': 'e1', 'room': '1.1', 'service_id': service['id']}}\n    response = client.post('/v2/live-tour/action', json=request)\n    assert response.status_code == 200, response.text\n    assert db.stored['employees'][0]['service'] == 'Body 90'\n'''
          ats = ats[:old_start] + replacement_test
          attendance_test.write_text(ats, encoding='utf-8')

          daily = Path('tests/test_live_tour_daily_settings.py')
          dsrc = daily.read_text(encoding='utf-8')
          old_start = dsrc.index('def test_daily_route_uses_server_leaves_and_rejects_stale_revision():')
          old_end = dsrc.index('\n\ndef test_directory_shift_refreshes_board_without_resetting_service():', old_start)
          new_daily = '''def test_daily_route_queues_server_projection_and_rejects_stale_revision(monkeypatch):\n    from test_live_tour_server_only import SettingsDatabase\n    queued = []\n    monkeypatch.setattr(live.job_queue, 'enqueue_conn', lambda conn, queue, key, payload: queued.append((queue, key, payload)) or True)\n    db = SettingsDatabase(state_with(employee('e1','An')))\n    client = route_client(db, 'quanly')\n    current = client.get('/v2/live-tour').json()\n    body = {'action':'sync_daily_status', 'expected_revision':current['revision'],'idempotency_key':'daily-status-server',\n        'payload':{'leaves':[], 'directory':[]}}\n    response = client.post('/v2/live-tour/action',json=body)\n    assert response.status_code == 200, response.text\n    assert response.json()['result']['queued'] is True\n    assert queued and queued[-1][0] == live.PROJECTION_QUEUE\n    assert db.revision == current['revision']  # enqueue does not mutate the board transaction\n    body['expected_revision'] = current['revision'] - 1\n    body['idempotency_key'] = 'daily-status-stale'\n    assert client.post('/v2/live-tour/action',json=body).status_code == 409\n'''
          dsrc = dsrc[:old_start] + new_daily + dsrc[old_end:]
          daily.write_text(dsrc, encoding='utf-8')

          server = Path('tests/test_live_tour_server_only.py')
          ss = server.read_text(encoding='utf-8')
          ss = ss.replace('    assert database.employee_reads == 2  # Directory is refreshed on each read.\n', '    assert database.employee_reads == 1  # Only first bootstrap reads the directory; GETs use the snapshot.\n', 1)
          ss = ss.replace('    assert database.employee_reads == 4\n', '    assert database.employee_reads == 1\n', 1)
          ss = ss.replace('    assert database.employee_reads == 1\n    assert data["state"]["invoices"] == state["invoices"]\n', '    assert database.employee_reads == 0\n    assert data["state"]["invoices"] == state["invoices"]\n', 1)
          server.write_text(ss, encoding='utf-8')

          Path('tests/test_postgres_job_queue_source.py').write_text('''from pathlib import Path\n\ndef test_claim_commits_before_slow_work_and_uses_skip_locked():\n    source = Path("vera_postgres_job_queue.py").read_text(encoding="utf-8")\n    claim = source.split("def claim_one", 1)[1].split("def mark_done", 1)[0]\n    assert "FOR UPDATE SKIP LOCKED" in claim\n    assert "status='processing'" in claim\n    assert "handler" not in claim\n\ndef test_live_tour_queue_has_short_input_and_apply_phases():\n    source = Path("vera_web_v2_live_tour.py").read_text(encoding="utf-8")\n    inputs = source.split("def projection_inputs", 1)[1].split("def apply_projection", 1)[0]\n    apply = source.split("def apply_projection", 1)[1].split("def scheduled_projection", 1)[0]\n    assert "STATE_LOCK" not in inputs\n    assert "try_state_lock(conn, STATE_LOCK)" in apply\n    assert "directory_records=directory" in apply\n    assert "leave_records=leaves" in apply\n\ndef test_timesoft_has_one_sync_per_scheduler_invocation():\n    source = Path("timesoft_snapshot_job.py").read_text(encoding="utf-8")\n    assert "return int(ts.run_sync())" in source\n    assert "_fast_checkin_tail" not in source\n    cloud = Path("cloudbuild.yaml").read_text(encoding="utf-8")\n    assert "TIMESOFT_FAST_CHECKIN_SECONDS" not in cloud\n    assert "TIMESOFT_FAST_CHECKIN_WINDOW_SECONDS" not in cloud\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "pytest==8.4.2" \
            "httpx2>=2,<3" \
            -r requirements.txt

      - name: Run focused queue and concurrency tests
        run: |
          python -m py_compile \
            vera_postgres_job_queue.py \
            vera_web_v2_live_tour.py \
            timesoft_snapshot_job.py \
            vera_vps_concurrency_schema.py
          python -m pytest -q \
            tests/test_postgres_job_queue_source.py \
            tests/test_live_tour_action_lock_performance.py \
            tests/test_live_tour_lock_scope.py \
            tests/test_live_tour_lock_backpressure.py \
            tests/test_live_tour_concurrent_readers.py \
            tests/test_live_tour_attendance_breaktime.py \
            tests/test_live_tour_daily_settings.py \
            tests/test_live_tour_server_only.py \
            tests/test_direct_break_return_penalty.py \
            tests/test_missing_checkin_notifications.py

      - name: Run full Python test suite
        run: python -m pytest -q

      - name: Commit tested queue implementation
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-tour-postgres-queue.yml .github/workflows/live-tour-5m-refresh.yml
          git add \
            vera_postgres_job_queue.py \
            vera_web_v2_live_tour.py \
            timesoft_snapshot_job.py \
            cloudbuild.yaml \
            vera_vps_concurrency_schema.py \
            .github/workflows/deploy-vps.yml \
            tests/test_postgres_job_queue_source.py \
            tests/test_live_tour_action_lock_performance.py \
            tests/test_live_tour_lock_scope.py \
            tests/test_live_tour_lock_backpressure.py \
            tests/test_live_tour_attendance_breaktime.py \
            tests/test_live_tour_daily_settings.py \
            tests/test_live_tour_server_only.py \
            tests/test_direct_break_return_penalty.py \
            tests/test_missing_checkin_notifications.py
          git commit -m "Move Live Tour projections to PostgreSQL queue"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy tested commit to VPS production
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh workflow run deploy-vps.yml --ref main
          run_id=""
          for attempt in $(seq 1 40); do
            run_id=$(gh run list --workflow deploy-vps.yml --branch main --event workflow_dispatch --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${PATCH_SHA}\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id" || { echo "Deploy run not found for ${PATCH_SHA}" >&2; exit 1; }
          echo "Watching production deploy run ${run_id} for ${PATCH_SHA}"
          gh run watch "$run_id" --exit-status
