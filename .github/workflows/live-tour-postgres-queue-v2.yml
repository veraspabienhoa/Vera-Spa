name: One-shot PostgreSQL Live Tour queue v2

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: live-tour-postgres-queue-v2
  cancel-in-progress: false

jobs:
  patch-test-commit-deploy:
    if: contains(github.event.head_commit.message, '[live-tour-postgres-queue-v2]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Reapply v1 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/live-tour-postgres-queue.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, 'live-tour-postgres-queue-v1-generator', 'exec'))
          PY

          cat > vera_postgres_job_queue.py <<'PYQUEUE'
          """Durable PostgreSQL job queue for slow background application work.

          A claim transaction uses ``FOR UPDATE SKIP LOCKED`` and commits before
          the worker performs slow work. Completion/retry is recorded in a later
          transaction, so external I/O never holds a queue row lock or DB session.
          """
          from __future__ import annotations

          import json
          from typing import Any

          from sqlalchemy import text

          TABLE = "vera_background_job"
          RELEASE = "postgres-job-queue-2026-09-16.1"
          MAX_ATTEMPTS = 12


          def ensure_schema_conn(conn) -> None:
              conn.execute(text(f"""
                  CREATE TABLE IF NOT EXISTS {TABLE} (
                      id BIGSERIAL PRIMARY KEY,
                      queue_name TEXT NOT NULL,
                      job_key TEXT NOT NULL,
                      payload JSONB NOT NULL DEFAULT '{{}}'::jsonb,
                      status TEXT NOT NULL DEFAULT 'pending',
                      attempts INTEGER NOT NULL DEFAULT 0,
                      available_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                      locked_at TIMESTAMPTZ,
                      completed_at TIMESTAMPTZ,
                      last_error TEXT,
                      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                      updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                      UNIQUE(queue_name, job_key)
                  )
              """))
              conn.execute(text(
                  f"CREATE INDEX IF NOT EXISTS idx_{TABLE}_ready "
                  f"ON {TABLE}(queue_name,status,available_at,id)"
              ))


          def enqueue_conn(conn, queue_name: str, job_key: str,
                           payload: dict[str, Any] | None = None) -> bool:
              result = conn.execute(text(f"""
                  INSERT INTO {TABLE}(
                      queue_name,job_key,payload,status,attempts,
                      available_at,created_at,updated_at
                  ) VALUES(
                      :queue_name,:job_key,CAST(:payload AS jsonb),'pending',0,
                      NOW(),NOW(),NOW()
                  )
                  ON CONFLICT(queue_name,job_key) DO NOTHING
              """), {
                  "queue_name": str(queue_name),
                  "job_key": str(job_key),
                  "payload": json.dumps(payload or {}, ensure_ascii=False, default=str),
              })
              return bool(getattr(result, "rowcount", 1))


          def enqueue(engine_instance, queue_name: str, job_key: str,
                      payload: dict[str, Any] | None = None) -> bool:
              with engine_instance().begin() as conn:
                  return enqueue_conn(conn, queue_name, job_key, payload)


          def _payload(value: Any) -> dict[str, Any]:
              if isinstance(value, dict):
                  return dict(value)
              try:
                  parsed = json.loads(str(value or "{}"))
                  return dict(parsed) if isinstance(parsed, dict) else {}
              except Exception:
                  return {}


          def claim_one(engine_instance, queue_name: str) -> dict[str, Any] | None:
              with engine_instance().begin() as conn:
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status='retry', available_at=NOW(), locked_at=NULL,
                          last_error=COALESCE(last_error,'worker lease expired'),
                          updated_at=NOW()
                      WHERE queue_name=:queue_name
                        AND status='processing'
                        AND locked_at < NOW() - INTERVAL '10 minutes'
                  """), {"queue_name": queue_name})
                  row = conn.execute(text(f"""
                      SELECT id,queue_name,job_key,payload,attempts
                      FROM {TABLE}
                      WHERE queue_name=:queue_name
                        AND status IN ('pending','retry')
                        AND available_at<=NOW()
                      ORDER BY available_at,id
                      FOR UPDATE SKIP LOCKED
                      LIMIT 1
                  """), {"queue_name": queue_name}).mappings().first()
                  if not row:
                      return None
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status='processing',locked_at=NOW(),updated_at=NOW()
                      WHERE id=:id
                  """), {"id": row["id"]})
                  item = dict(row)
                  item["payload"] = _payload(item.get("payload"))
                  return item


          def mark_done(engine_instance, item_id: int) -> None:
              with engine_instance().begin() as conn:
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status='done',completed_at=NOW(),locked_at=NULL,
                          last_error=NULL,updated_at=NOW()
                      WHERE id=:id
                  """), {"id": int(item_id)})


          def reschedule(engine_instance, item_id: int, *, delay_seconds: int = 5) -> None:
              with engine_instance().begin() as conn:
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status='retry',
                          available_at=NOW()+(:delay*INTERVAL '1 second'),
                          locked_at=NULL,updated_at=NOW()
                      WHERE id=:id
                  """), {
                      "id": int(item_id),
                      "delay": max(1, int(delay_seconds)),
                  })


          def mark_retry(engine_instance, item: dict[str, Any], exc: Exception) -> None:
              attempts = int(item.get("attempts") or 0) + 1
              delay = min(3600, 15 * (2 ** min(attempts - 1, 8)))
              status = "failed" if attempts >= MAX_ATTEMPTS else "retry"
              with engine_instance().begin() as conn:
                  conn.execute(text(f"""
                      UPDATE {TABLE}
                      SET status=:status,attempts=:attempts,
                          available_at=NOW()+(:delay*INTERVAL '1 second'),
                          locked_at=NULL,last_error=:error,updated_at=NOW()
                      WHERE id=:id
                  """), {
                      "id": int(item["id"]),
                      "status": status,
                      "attempts": attempts,
                      "delay": delay,
                      "error": f"{type(exc).__name__}: {exc}"[:2000],
                  })


          def counts(engine_instance, queue_name: str) -> dict[str, int]:
              with engine_instance().connect() as conn:
                  rows = conn.execute(text(f"""
                      SELECT status,COUNT(*) AS n
                      FROM {TABLE}
                      WHERE queue_name=:queue_name
                      GROUP BY status
                  """), {"queue_name": queue_name}).mappings().all()
              return {str(row["status"]): int(row["n"]) for row in rows}
          PYQUEUE

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "pytest==8.4.2" \
            "httpx2>=2,<3" \
            -r requirements.txt

      - name: Run focused queue and concurrency tests
        run: |
          python -m py_compile \
            vera_postgres_job_queue.py \
            vera_web_v2_live_tour.py \
            timesoft_snapshot_job.py \
            vera_vps_concurrency_schema.py
          python -m pytest -q \
            tests/test_postgres_job_queue_source.py \
            tests/test_live_tour_action_lock_performance.py \
            tests/test_live_tour_lock_scope.py \
            tests/test_live_tour_lock_backpressure.py \
            tests/test_live_tour_concurrent_readers.py \
            tests/test_live_tour_attendance_breaktime.py \
            tests/test_live_tour_daily_settings.py \
            tests/test_live_tour_server_only.py \
            tests/test_direct_break_return_penalty.py \
            tests/test_missing_checkin_notifications.py

      - name: Run full Python test suite
        run: python -m pytest -q

      - name: Commit tested queue implementation
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/live-tour-postgres-queue-v2.yml \
            .github/workflows/live-tour-postgres-queue.yml \
            .github/workflows/live-tour-5m-refresh.yml
          git add \
            vera_postgres_job_queue.py \
            vera_web_v2_live_tour.py \
            timesoft_snapshot_job.py \
            cloudbuild.yaml \
            vera_vps_concurrency_schema.py \
            .github/workflows/deploy-vps.yml \
            tests/test_postgres_job_queue_source.py \
            tests/test_live_tour_action_lock_performance.py \
            tests/test_live_tour_lock_scope.py \
            tests/test_live_tour_lock_backpressure.py \
            tests/test_live_tour_attendance_breaktime.py \
            tests/test_live_tour_daily_settings.py \
            tests/test_live_tour_server_only.py \
            tests/test_direct_break_return_penalty.py \
            tests/test_missing_checkin_notifications.py
          git commit -m "Move Live Tour projections to PostgreSQL queue"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy tested commit to VPS production
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh workflow run deploy-vps.yml --ref main
          run_id=""
          for attempt in $(seq 1 40); do
            run_id=$(gh run list --workflow deploy-vps.yml --branch main --event workflow_dispatch --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${PATCH_SHA}\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id" || { echo "Deploy run not found for ${PATCH_SHA}" >&2; exit 1; }
          gh run watch "$run_id" --exit-status
