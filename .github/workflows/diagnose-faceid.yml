name: Diagnose FaceGate photo update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    # Authorized single upload completed: state 105 (no face), profiles unchanged.
    # Retained for audit only. No further device upload is authorized here.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure existing SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Probe multipart upload using a synthetic image without registering any profile
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'cd /opt/vera-spa/current && timeout 60 /opt/vera-spa/.venv/bin/python -' <<'PYCODE'
          import json, os, re
          from collections import Counter
          from sqlalchemy import create_engine,text
          from sqlalchemy.pool import NullPool
          from vera_vps_data_check import _database_url,_running_api_environment
          from vera_web_v2_runtime_env import RUNTIME_ENV_KEYS,load_managed_runtime_environment
          from vera_facegate_readiness import runtime_device_environment
          from vera_facegate_enrollment import FaceGateEnrollmentClient,fields,EnrollmentError
          from vera_web_v2_devices import use_registered_facegate
          runtime_device_environment()
          env={k:os.environ.get(k,'') for k in RUNTIME_ENV_KEYS} if load_managed_runtime_environment() else _running_api_environment()
          engine=create_engine(_database_url(env),poolclass=NullPool,connect_args={'connect_timeout':5,'sslmode':env.get('DB_SSLMODE','require'),'options':'-c default_transaction_read_only=on -c statement_timeout=3000 -c lock_timeout=1000'})
          client=None
          def safe_error(exc):
              return {'error_type':type(exc).__name__,'error_code':exc.code if isinstance(exc,EnrollmentError) else 'unknown'}
          try:
              with engine.connect() as conn:
                  busy=conn.execute(text("SELECT COUNT(*) FROM vera_facegate_enrollment WHERE status IN ('running','unverified')")).scalar()
              if busy:
                  print('SYNTHETIC_PROBE_SKIPPED_BUSY_DEVICE')
              else:
                  from io import BytesIO
                  from PIL import Image
                  import requests,secrets
                  class NativeFormSession(requests.Session):
                      upload_count=0
                      def post(self,url,**kwargs):
                          if kwargs.get('files'):
                              self.upload_count+=1
                              if self.upload_count>1: raise RuntimeError('second_upload_blocked')
                              kwargs['data']={'txt':'FaceID.jpg'}
                          return super().post(url,**kwargs)
                  class ProbeClient(FaceGateEnrollmentClient):
                      def request(self,path,params,*,photo=None):
                          if path not in ('/webs/login','/webs/getWhitelist','/webs/uploadfile','/webs/getUploadPercent'):
                              raise RuntimeError('outside_probe_scope')
                          raw=super().request(path,params,photo=photo)
                          if path in ('/webs/uploadfile','/webs/getUploadPercent'):
                              values=re.findall(r'root\.([A-Za-z0-9_.]+)=(.*?)(?=\s+root\.|</html>|$)',raw,re.S)
                              safe={k:v.strip() for k,v in values if k in ('UPLOAD.state','ERR.no') and re.fullmatch(r'[0-9-]{1,12}',v.strip())}
                              print('SYNTHETIC_PROTOCOL',path,json.dumps(safe),flush=True)
                          return raw
                  photo=BytesIO()
                  Image.new('RGB',(320,320),(0,90,180)).save(photo,'JPEG')
                  with use_registered_facegate(engine):
                      client=ProbeClient(session=NativeFormSession())
                      client.login()
                      before=client.profiles()
                      session_id=str(secrets.randbelow(90000000)+10000000)
                      try:
                          client.upload(photo.getvalue(),session_id)
                          print('SYNTHETIC_UPLOAD_RESULT','temporary_image_accepted')
                      except EnrollmentError as exc:
                          print('SYNTHETIC_UPLOAD_RESULT',exc.code)
                      after=client.profiles()
                      print('SYNTHETIC_PROBE_PROFILES_UNCHANGED',before==after)

          except Exception as exc:
              print('DIAGNOSTIC_ERROR',json.dumps(safe_error(exc)))
          finally:
              if client: client.close()
              engine.dispose()
          PYCODE
