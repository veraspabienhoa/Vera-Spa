name: Diagnose FaceGate photo update
on:
  push:
    branches: [codex/faceid-diagnostics]
    paths: [.github/workflows/diagnose-faceid.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure existing SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read update journal and device result without uploads or profile writes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'cd /opt/vera-spa/current && timeout 60 /opt/vera-spa/.venv/bin/python -' <<'PYCODE'
          import json, os, re, subprocess
          from collections import Counter
          from sqlalchemy import create_engine,text
          from sqlalchemy.pool import NullPool
          from vera_vps_data_check import _database_url,_running_api_environment
          from vera_web_v2_runtime_env import RUNTIME_ENV_KEYS,load_managed_runtime_environment
          from vera_facegate_readiness import runtime_device_environment
          from vera_facegate_enrollment import FaceGateEnrollmentClient,fields,EnrollmentError
          from vera_facegate_control_log import registration_ref
          from vera_web_v2_devices import use_registered_facegate
          print('ACTIVE_COMMIT',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          runtime_device_environment()
          env={k:os.environ.get(k,'') for k in RUNTIME_ENV_KEYS} if load_managed_runtime_environment() else _running_api_environment()
          engine=create_engine(_database_url(env),poolclass=NullPool,connect_args={'connect_timeout':5,'sslmode':env.get('DB_SSLMODE','require'),'options':'-c default_transaction_read_only=on -c statement_timeout=3000 -c lock_timeout=1000'})
          client=None
          def safe_error(exc):
              return {'error_type':type(exc).__name__,'error_code':exc.code if isinstance(exc,EnrollmentError) else 'unknown'}
          try:
              with engine.connect() as conn:
                  rows=[dict(r) for r in conn.execute(text("SELECT status,stage,error_code,upload_session,operation_type,profile_id,previous_ref,registration_ref,created_at,updated_at FROM vera_facegate_enrollment WHERE profile_id=189 ORDER BY created_at DESC LIMIT 1")).mappings()]
                  busy=conn.execute(text("SELECT COUNT(*) FROM vera_facegate_enrollment WHERE status='running'")).scalar()
              from datetime import datetime,timezone
              print('OPERATION_TIMING',json.dumps([{'after_deploy':r['created_at']>=datetime(2026,10,6,16,19,tzinfo=timezone.utc),'duration_seconds':round((r['updated_at']-r['created_at']).total_seconds(),1)} for r in rows]))
              print('UPDATE_JOURNAL',json.dumps([{**{k:r[k] for k in ('status','stage','error_code','operation_type')},'has_uploaded_ref':bool(r['registration_ref'])} for r in rows]))
              if busy:
                  print('DEVICE_READ_SKIPPED_ACTIVE_OPERATION')
              elif rows:
                  row=rows[0]
                  with use_registered_facegate(engine):
                      client=FaceGateEnrollmentClient()
                      client.login()
                      print('DEVICE_LOGIN_OK')
                      raw=client.request('/webs/getUploadPercent',{'action':'list','group':'UPLOAD','sessionid':row['upload_session']})
                      matches=re.findall(r'root\.([A-Za-z0-9_.]+)=(.*?)(?=\s+root\.|</html>|$)',raw,re.S)
                      print('UPLOAD_FIELD_COUNTS',json.dumps(dict(Counter(k for k,v in matches if k.startswith('UPLOAD.') or k.startswith('ERR.')))))
                      print('UPLOAD_RESULT',json.dumps({k:v.strip() for k,v in matches if k in ('UPLOAD.state','ERR.no') and re.fullmatch(r'[0-9-]{1,12}',v.strip())}))
                      print('UPLOAD_SESSION_MATCH',any(k=='UPLOAD.sessionid' and v.strip()==row['upload_session'] for k,v in matches))
                      result_fields={k:v.strip() for k,v in matches}
                      def number(key):
                          value=result_fields.get(key,'')
                          return int(value) if re.fullmatch(r'-?\d{1,20}',value) else None
                      file_type=number('UPLOAD.dwfiletype')
                      file_index=number('UPLOAD.dwfileindex')
                      file_position=number('UPLOAD.dwfilepos')
                      print('UPLOAD_REFERENCE_SHAPE',json.dumps({'file_type':file_type if file_type is not None and -1<=file_type<=16 else 'other','index_valid':file_index is not None and 0<=file_index<=65535,'position_positive':file_position is not None and file_position>0,'position_in_range':file_position is not None and 0<file_position<=2**63-1,'error_kind':result_fields.get('ERR.des') if result_fields.get('ERR.des') in ('OK','ImportingList','LoginTimeout','') else 'other'}))
                      try:
                          value=fields(raw)
                          print('UPLOAD_PARSE_OK')
                          print('UPLOAD_REFERENCE_VALID',bool(registration_ref({k.removeprefix('UPLOAD.'):v for k,v in value.items()})))
                      except Exception as exc: print('UPLOAD_PARSE',json.dumps(safe_error(exc)))
                      profile=client.profile_details(int(row['profile_id']))
                      ref=registration_ref(profile)
                      print('PROFILE_REFERENCE_CHECK',json.dumps({'previous':ref==row['previous_ref'],'uploaded':bool(row['registration_ref']) and ref==row['registration_ref']}))
                      print('PROFILE_READ_OK')
          except Exception as exc:
              print('DIAGNOSTIC_ERROR',json.dumps(safe_error(exc)))
          finally:
              if client: client.close()
              engine.dispose()
          PYCODE
