name: Diagnose FaceGate photo update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure existing SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: One authorized saved-photo upload, with no profile commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'cd /opt/vera-spa/current && timeout 60 /opt/vera-spa/.venv/bin/python -' <<'PYCODE'
          import json, os, re, time
          from sqlalchemy import create_engine,text
          from sqlalchemy.pool import NullPool
          from vera_vps_data_check import _database_url,_running_api_environment
          from vera_web_v2_runtime_env import RUNTIME_ENV_KEYS,load_managed_runtime_environment
          from vera_facegate_readiness import runtime_device_environment
          from vera_facegate_enrollment import FaceGateEnrollmentClient,EnrollmentError,jpeg_photo
          from vera_facegate_control_log import registration_ref
          from vera_web_v2_devices import use_registered_facegate
          from vera_web_v2_facegate_enrollment import mappings,target
          runtime_device_environment()
          env={k:os.environ.get(k,'') for k in RUNTIME_ENV_KEYS} if load_managed_runtime_environment() else _running_api_environment()
          engine=create_engine(_database_url(env),poolclass=NullPool,connect_args={'connect_timeout':5,'sslmode':env.get('DB_SSLMODE','require'),'options':'-c default_transaction_read_only=on -c statement_timeout=3000 -c lock_timeout=1000'})
          client=None
          def safe_error(exc):
              return {'error_type':type(exc).__name__,'error_code':exc.code if isinstance(exc,EnrollmentError) else 'unknown'}
          try:
              with engine.connect() as conn:
                  row=conn.execute(text("SELECT employee_username,photo_sha256,device_id,device_address,profile_id,previous_ref FROM vera_facegate_enrollment WHERE profile_id=189 AND operation_type='replace' ORDER BY created_at DESC LIMIT 1")).mappings().first()
                  if not row: raise RuntimeError('missing_reported_operation')
                  row=dict(row)
                  busy=conn.execute(text("SELECT COUNT(*) FROM vera_facegate_enrollment WHERE status IN ('running','unverified')")).scalar()
                  photo=conn.execute(text("SELECT content,sha256 FROM vera_employee_face_id WHERE employee_username=:username"),{'username':row['employee_username']}).mappings().first()
                  owned=[m for m in mappings(conn,row['device_id']) if m.get('username')==row['employee_username']]
                  unchanged=(len(owned)==1 and owned[0].get('profile_id')==row['profile_id'] and owned[0].get('registration_ref')==row['previous_ref'] and owned[0].get('device_address')==row['device_address'] and bool(owned[0].get('confirmed_by')) and target(conn)==row['device_address'])
                  jpeg=jpeg_photo(bytes(photo['content'])) if photo and photo['sha256']==row['photo_sha256'] else None
              if busy or not unchanged or jpeg is None:
                  print('REAL_PHOTO_PROBE_SKIPPED',json.dumps({'busy':bool(busy),'mapping_unchanged':unchanged,'photo_unchanged':jpeg is not None}))
              else:
                  import requests,secrets
                  class OneUploadSession(requests.Session):
                      upload_count=0
                      def post(self,url,**kwargs):
                          if not kwargs.get('files'): raise RuntimeError('profile_write_blocked')
                          self.upload_count+=1
                          if self.upload_count>1: raise RuntimeError('second_upload_blocked')
                          began=time.monotonic()
                          try:
                              response=super().post(url,**kwargs)
                              print('UPLOAD_HTTP_RESULT',json.dumps({'status':response.status_code,'elapsed_seconds':round(time.monotonic()-began,2)}),flush=True)
                              return response
                          except Exception as exc:
                              print('UPLOAD_HTTP_FAILURE',json.dumps({**safe_error(exc),'elapsed_seconds':round(time.monotonic()-began,2)}),flush=True)
                              raise
                  class ProbeClient(FaceGateEnrollmentClient):
                      def request(self,path,params,*,photo=None):
                          if path not in ('/webs/login','/webs/getWhitelist','/webs/uploadfile','/webs/getUploadPercent'):
                              raise RuntimeError('outside_probe_scope')
                          raw=super().request(path,params,photo=photo)
                          if path in ('/webs/uploadfile','/webs/getUploadPercent'):
                              fields=dict(re.findall(r'root\.([A-Za-z0-9_.]+)=(.*?)(?=\s+root\.|</html>|$)',raw,re.S))
                              safe={k:v.strip() for k,v in fields.items() if k in ('UPLOAD.state','ERR.no','UPLOAD.dwfiletype') and re.fullmatch(r'-?[0-9]{1,8}',v.strip())}
                              safe['login_form']=bool(re.search(r'<input[^>]+type=["\x27]?password',raw,re.I))
                              safe['reference_valid']=bool(registration_ref({k.removeprefix('UPLOAD.'):v.strip() for k,v in fields.items()}))
                              print('REAL_PHOTO_PROTOCOL',path,json.dumps(safe),flush=True)
                          return raw
                  with use_registered_facegate(engine):
                      client=ProbeClient(session=OneUploadSession())
                      client.login()
                      profiles=client.profiles()
                      matches=[p for p in profiles if p.get('uid')==str(row['profile_id'])]
                      before=client.profile_details(int(row['profile_id']))
                      if len(matches)!=1 or registration_ref(matches[0])!=row['previous_ref'] or registration_ref(before)!=row['previous_ref']:
                          print('REAL_PHOTO_PROBE_SKIPPED_PROFILE_CHANGED')
                      else:
                          upload_session=str(secrets.randbelow(90000000)+10000000)
                          try:
                              client.upload(jpeg,upload_session,profile_id=int(row['profile_id']))
                              print('REAL_PHOTO_UPLOAD_RESULT','temporary_image_accepted_no_profile_commit')
                          except Exception as exc:
                              print('REAL_PHOTO_UPLOAD_RESULT',json.dumps(safe_error(exc)),flush=True)
                          after=client.profile_details(int(row['profile_id']))
                          print('REAL_PHOTO_PROFILE_UNCHANGED',before==after)
          except Exception as exc:
              print('DIAGNOSTIC_ERROR',json.dumps(safe_error(exc)))
          finally:
              if client: client.close()
              engine.dispose()
          PYCODE

