name: Diagnose FaceGate photo update
on:
  push:
    branches: [codex/faceid-diagnostics]
    paths: [.github/workflows/diagnose-faceid.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure existing SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read sanitized enrollment diagnostics without device writes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'cd /opt/vera-spa/current && timeout 60 /opt/vera-spa/.venv/bin/python -' <<'PYCODE'
          import json, os, re
          from collections import Counter
          from sqlalchemy import create_engine,text
          from sqlalchemy.pool import NullPool
          from vera_vps_data_check import _database_url,_running_api_environment
          from vera_web_v2_runtime_env import RUNTIME_ENV_KEYS,load_managed_runtime_environment
          from vera_facegate_readiness import runtime_device_environment
          from vera_facegate_enrollment import FaceGateEnrollmentClient,fields,EnrollmentError
          from vera_web_v2_devices import use_registered_facegate
          runtime_device_environment()
          env={k:os.environ.get(k,'') for k in RUNTIME_ENV_KEYS} if load_managed_runtime_environment() else _running_api_environment()
          engine=create_engine(_database_url(env),poolclass=NullPool,connect_args={'connect_timeout':5,'sslmode':env.get('DB_SSLMODE','require'),'options':'-c default_transaction_read_only=on -c statement_timeout=3000 -c lock_timeout=1000'})
          client=None
          def safe_error(exc):
              return {'error_type':type(exc).__name__,'error_code':exc.code if isinstance(exc,EnrollmentError) else 'unknown'}
          try:
              with engine.connect() as conn:
                  rows=[dict(r) for r in conn.execute(text("SELECT status,stage,error_code,upload_session,operation_type,profile_id FROM vera_facegate_enrollment ORDER BY created_at DESC LIMIT 5")).mappings()]
              print('JOURNAL',json.dumps([{k:r[k] for k in ('status','stage','error_code','operation_type')} for r in rows]))
              from html.parser import HTMLParser
              class FormCheck(HTMLParser):
                  def __init__(self): super().__init__();self.frames=[];self.forms=[];self.inputs=[]
                  def handle_starttag(self,tag,attrs):
                      item=dict(attrs)
                      if tag=='iframe' and item.get('id')=='fileframe': self.frames.append(item.get('src',''))
                      if tag=='form': self.forms.append(item)
                      if tag=='input' and item.get('type','').lower()=='file': self.inputs.append(item)
              with use_registered_facegate(engine):
                  client=FaceGateEnrollmentClient()
                  page=FormCheck();page.feed(client.request('/bwlist.asp',{'action':'list'}))
                  print('UPLOAD_FORM_FRAME_FOUND',len(page.frames)==1)
                  if len(page.frames)==1:
                      from urllib.parse import urlsplit
                      path=urlsplit(page.frames[0]).path.lstrip('/')
                      print('UPLOAD_FORM_SRC_EMPTY',not bool(path))
                      print('UPLOAD_FORM_SRC_QUERY','?' in page.frames[0])
                      if re.fullmatch(r'[A-Za-z0-9_./-]+\\.(asp|html|htm|shtml)',path) and '..' not in path:
                          form=FormCheck();form.feed(client.request('/'+path,{'action':'list'}))
                          print('UPLOAD_FORM_POST',any(f.get('method','').lower()=='post' for f in form.forms))
                          print('UPLOAD_FORM_MULTIPART',any(f.get('enctype','').lower()=='multipart/form-data' for f in form.forms))
                          print('UPLOAD_FORM_FILE_INPUTS',len(form.inputs))
                          for candidate in ('vfileselector','file','filename','uploadfile','Filedata','upfile','upload_file','fileupload'):
                              print('UPLOAD_FORM_NAME_MATCH_'+candidate,any(f.get('name')==candidate for f in form.inputs))

          except Exception as exc:
              print('DIAGNOSTIC_ERROR',json.dumps(safe_error(exc)))
          finally:
              if client: client.close()
              engine.dispose()
          PYCODE
