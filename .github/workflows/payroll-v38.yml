name: Payroll 3.8 CI

on:
  push:
    branches: [main]
    paths:
      - "vera_web_v2_payroll_v38.py"
      - "vera_web_v2_payroll_debt_sync.py"
      - "vera_web_v2_payroll_enhancements.py"
      - "vera_web_v2_payroll_saved_edit.py"
      - "vera_web_v2_api_v38.py"
      - "web-v2/src/pages/PayrollPageV38.jsx"
      - "web-v2/src/pages/PayrollPageEnhanced.jsx"
      - "web-v2/src/pages/PayrollPageEnhanced.css"
      - "web-v2/src/pages/PayrollDebtAdminPanel.jsx"
      - "web-v2/src/pages/PayrollSavedAdminPanel.jsx"
      - "web-v2/src/App.jsx"
      - ".github/workflows/payroll-v38.yml"
      - "cloudbuild.yaml"
  pull_request:
    branches: [main]
    paths:
      - "vera_web_v2_payroll_v38.py"
      - "vera_web_v2_payroll_debt_sync.py"
      - "vera_web_v2_payroll_enhancements.py"
      - "vera_web_v2_payroll_saved_edit.py"
      - "vera_web_v2_api_v38.py"
      - "web-v2/src/pages/PayrollPageV38.jsx"
      - "web-v2/src/pages/PayrollPageEnhanced.jsx"
      - "web-v2/src/pages/PayrollPageEnhanced.css"
      - "web-v2/src/pages/PayrollDebtAdminPanel.jsx"
      - "web-v2/src/pages/PayrollSavedAdminPanel.jsx"
      - "web-v2/src/App.jsx"
      - ".github/workflows/payroll-v38.yml"
      - "cloudbuild.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payroll-v38-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-payroll-v38:
    name: Payroll 3.8 backend + Web V2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Payroll 3.8 Python
        run: python -m py_compile vera_web_v2_payroll_v38.py vera_web_v2_payroll_debt_sync.py vera_web_v2_payroll_enhancements.py vera_web_v2_payroll_saved_edit.py vera_web_v2_api_v38.py

      - name: Verify Payroll 3.8 invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          backend = Path('vera_web_v2_payroll_v38.py').read_text(encoding='utf-8')
          debt_sync = Path('vera_web_v2_payroll_debt_sync.py').read_text(encoding='utf-8')
          enhancements = Path('vera_web_v2_payroll_enhancements.py').read_text(encoding='utf-8')
          saved_edit = Path('vera_web_v2_payroll_saved_edit.py').read_text(encoding='utf-8')
          wrapper = Path('vera_web_v2_api_v38.py').read_text(encoding='utf-8')
          page = Path('web-v2/src/pages/PayrollPageV38.jsx').read_text(encoding='utf-8')
          enhanced_page = Path('web-v2/src/pages/PayrollPageEnhanced.jsx').read_text(encoding='utf-8')
          enhanced_css = Path('web-v2/src/pages/PayrollPageEnhanced.css').read_text(encoding='utf-8')
          debt_admin = Path('web-v2/src/pages/PayrollDebtAdminPanel.jsx').read_text(encoding='utf-8')
          saved_admin = Path('web-v2/src/pages/PayrollSavedAdminPanel.jsx').read_text(encoding='utf-8')
          app = Path('web-v2/src/App.jsx').read_text(encoding='utf-8')
          build = Path('cloudbuild.yaml').read_text(encoding='utf-8')

          ast.parse(backend)
          ast.parse(debt_sync)
          ast.parse(enhancements)
          ast.parse(saved_edit)
          ast.parse(wrapper)

          checks = {
              'release is Payroll 3.8': '3.8-payroll-employee-overrides' in backend,
              'legacy override key is migrated': 'employee_payroll_overrides_json' in backend and 'CauHinhLuong' in backend,
              'PostgreSQL override store exists': "PG_OVERRIDE_KEY = \"employee_overrides\"" in backend,
              '3.7 calculator is delegated first': 'result = await original_calculate(' in backend,
              'canonical net calculation remains authoritative': '_payroll._net(row)' in backend,
              'salary zero rule is documented in v38 wrapper': 'salary=0 clears both deductions' in backend,
              'v38 health endpoint exists': '/v2/payroll-v38/health' in backend,
              'override get save reset endpoints exist': all(token in backend for token in ('@app.get("/v2/payroll-v38/employee-overrides")', '@app.put("/v2/payroll-v38/employee-overrides")', '@app.post("/v2/payroll-v38/employee-overrides/reset")')),
              'legacy NoViPham debt source is refreshed': 'LEGACY_OBLIGATION_WORKSHEET' in debt_sync and 'legacy_google_sheet_auto' in debt_sync,
              'legacy violation debt cache is refreshed': 'LEGACY_DEBT_DATASET_KEY = "violation_debt"' in debt_sync and '_write_dataset_cache(' in debt_sync,
              'debt refresh happens before payroll calculation': debt_sync.find('_refresh_legacy_obligations(') < debt_sync.rfind('result = await original_calculate('),
              'safe cache fallback avoids silently dropping debt': 'cache_exists' in debt_sync and 'Đã dừng tính lương để tránh bỏ sót khấu trừ' in debt_sync,
              'saved payroll list endpoint exists': '/v2/payroll/saved-batches' in enhancements,
              'history batch delete endpoint exists': '@app.delete("/v2/payroll/history/{batch_id}")' in enhancements,
              'completion marks applied obligations done': '_mark_applied_custom_obligations_completed' in enhancements and 'completed_obligations' in enhancements,
              'admin can defer current penalty': '/v2/payroll/penalties/defer' in enhancements and 'Tạm hoãn vi phạm' in enhancements,
              'deferred penalty starts next period': 'period_end + timedelta(days=1)' in enhancements,
              'saved batch can reopen as editable draft': '/v2/payroll/saved-batches/{batch_id}/edit' in saved_edit and '_draft_key(start, end)' in saved_edit,
              'saved edit reuses canonical payroll rows': '_clean_draft_rows' in saved_edit and '_saved_draft' in saved_edit,
              'API wrapper installs saved edit routes': 'install_payroll_saved_edit_routes(' in wrapper,
              'Web V2 loads Payroll 3.8 page': "import('./pages/PayrollPageV38')" in app,
              'V38 uses enhanced payroll UI': "./PayrollPageEnhanced" in page,
              'V38 mounts saved payroll controls': 'PayrollSavedAdminPanel' in page,
              'default config is below payroll history in enhanced UI': enhanced_page.find('LỊCH SỬ BẢNG LƯƠNG') < enhanced_page.find('CÀI ĐẶT KHẤU TRỪ MẶC ĐỊNH'),
              'employee search exists in current payroll': 'Tìm tên nhân viên' in enhanced_page and 'draftSearch' in enhanced_page,
              'complete payroll button exists': 'Hoàn thành bảng lương' in enhanced_page,
              'saved payroll delete controls exist': 'Xóa lịch sử kỳ đang chọn' in enhanced_page and 'deleteHistoryBatch' in enhanced_page,
              'saved payroll save edit delete controls exist': all(token in saved_admin for token in ('Lưu bảng lương', 'Chỉnh sửa', 'Xóa bảng lương đã lưu')),
              'saved payroll edit calls backend': '/v2/payroll/saved-batches/${encodeURIComponent(batch)}/edit' in saved_admin,
              'payroll debt dates are dd/mm/yyyy': debt_admin.count('placeholder="dd/mm/yyyy"') == 3 and 'dateToIso' in debt_admin,
              'nonpositive take-home rows are highlighted': 'payroll-nonpositive' in enhanced_page and 'payroll-nonpositive' in enhanced_css,
              'current penalty can be moved to next payroll': 'Chuyển kỳ sau' in enhanced_page and '/v2/payroll/penalties/defer' in enhanced_page,
              'table overflow is contained': 'overflow-x: auto' in enhanced_css and 'overflow-x: hidden' in enhanced_css,
              'UI exposes employee and leader overrides': 'MỨC RIÊNG THEO NHÂN VIÊN / LEADER · 3.8' in page,
              'Cloud Run deploys v38 wrapper': 'vera_web_v2_api_v38:app' in build,
              'Cloud Build verifies v38 health': '/v2/payroll-v38/health' in build and '3.8-payroll-employee-overrides' in build,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + name)
          if failed:
              raise SystemExit('Payroll 3.8 invariant failures: ' + ', '.join(failed))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Build Web V2
        working-directory: web-v2
        run: |
          npm ci
          npm run build
