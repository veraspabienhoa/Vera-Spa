name: Deploy VPS Production

on:
  workflow_run:
    workflows:
      - "VERA SPA CI"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: vera-spa-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            "/opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify production data sources
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            "SCRIPT=\$(find /opt/vera-spa -maxdepth 4 -name vera_vps_data_check.py -type f -print -quit); test -n \"\$SCRIPT\"; /opt/vera-spa/.venv/bin/python \"\$SCRIPT\""

      - name: Report recent API errors
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            'PID=$(pgrep -o -f "vera_web_v2_api_v38:app" || true); [ -n "$PID" ] || exit 0; UNIT=$(sed -n "s#.*system.slice/\([^/]*\.service\).*#\1#p" "/proc/$PID/cgroup" | head -n 1); [ -n "$UNIT" ] || exit 0; sudo -n journalctl -u "$UNIT" --since "60 minutes ago" --priority err --no-pager -n 250 || journalctl -u "$UNIT" --since "60 minutes ago" --priority err --no-pager -n 250 || true'
