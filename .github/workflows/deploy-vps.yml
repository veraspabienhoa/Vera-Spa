name: Deploy VPS Production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "VERA SPA CI"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: vera-spa-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       (vars.AUTO_DEPLOY_VPS == 'true' ||
        contains(github.event.workflow_run.head_commit.message, '[deploy-vps]')))
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            "/opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Configure PostgreSQL SSL environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VERA_DB_PASS: ${{ secrets.VERA_DB_PASS }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          test -n "$VERA_DB_PASS"
          if [[ "$VERA_DB_PASS" == *$'\n'* || "$VERA_DB_PASS" == *$'\r'* ]]; then
            echo "VERA_DB_PASS must be a single-line secret" >&2
            exit 1
          fi
          printf '%s\n' "$VERA_DB_PASS" | ssh -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            "set -e; pid=\$(pgrep -n -f '[v]era_web_v2_api_v38:app'); release_dir=\$(readlink -f \"/proc/\${pid}/cwd\"); test \"\$(git -C \"\${release_dir}\" rev-parse HEAD)\" = '${DEPLOY_SHA}'; bash \"\${release_dir}/configure_vps_database.sh\" '${DEPLOY_SHA}' 160.236.192.51 5432 veraspa vera_dev"

      - name: Verify production data sources
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); /opt/vera-spa/.venv/bin/python "${release_dir}/vera_vps_data_check.py"'

      - name: Verify production local Auth health
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://api.veraspa.vn/v2/auth/health"
          last_error = None
          for _ in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      payload = json.load(response)
                  if payload.get("ok") is True and payload.get("provider") == "postgres-local":
                      print("PRODUCTION AUTH CHECK: PostgreSQL local Auth ready")
                      break
                  last_error = RuntimeError(f"unexpected health payload: {payload!r}")
              except Exception as exc:
                  last_error = exc
              time.sleep(3)
          else:
              raise SystemExit(f"Production local Auth health check failed: {last_error}")
          PY

      - name: Report recent API errors
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            'PID=$(pgrep -o -f "vera_web_v2_api_v38:app" || true); [ -n "$PID" ] || exit 0; UNIT=$(sed -n "s#.*system.slice/\([^/]*\.service\).*#\1#p" "/proc/$PID/cgroup" | head -n 1); [ -n "$UNIT" ] || exit 0; sudo -n journalctl -u "$UNIT" --since "60 minutes ago" --priority err --no-pager -n 250 || journalctl -u "$UNIT" --since "60 minutes ago" --priority err --no-pager -n 250 || true'
