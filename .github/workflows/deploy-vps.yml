name: Deploy VPS Production

on:
  push:
    paths:
      - .github/workflows/deploy-vps.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply room mobile CSS
        run: |
          set -e
          FILE=web-v2/src/live-tour-mobile-overrides.css
          if ! grep -q MOBILE_PR_BOTTOM_EMPTY_TEXT_MINUS_15_V1 "$FILE"; then
            cat >> "$FILE" <<'EOF'

/* MOBILE_PR_BOTTOM_EMPTY_TEXT_MINUS_15_V1 */
@media (max-width: 820px) {
  html body .live-tour-page .tour-room-panel .tour-room-grid .tour-room-private-badge {
    top: auto !important;
    bottom: 7px !important;
    scale: 0.8 !important;
    transform-origin: center !important;
  }
  html body .live-tour-page .tour-room-panel .tour-room-grid .tour-room-countdown .tour-room-countdown-empty {
    font-size: min(13.6px, 7.82cqw) !important;
    line-height: 1 !important;
    white-space: nowrap !important;
    overflow-wrap: normal !important;
    word-break: keep-all !important;
  }
}
EOF
          fi
          grep -q 'bottom: 7px !important' "$FILE"
          grep -q 'font-size: min(13.6px, 7.82cqw) !important' "$FILE"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Test and build frontend
        working-directory: web-v2
        run: |
          npm ci
          node --test tests/liveTourAppointments.test.mjs tests/bookingControls.test.mjs tests/bookingAvailability.test.mjs
          npm run build

      - name: Commit functional change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web-v2/src/live-tour-mobile-overrides.css
          git commit -m 'Move mobile PR badge and reduce empty room text'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 180 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "set -e; pid=\$(pgrep -n -f '[v]era_web_v2_api_v38:app'); release_dir=\$(readlink -f /proc/\${pid}/cwd); live_sha=\$(git -C \"\${release_dir}\" rev-parse HEAD); test \"\${live_sha}\" = '${DEPLOY_SHA}'; curl -fsS http://127.0.0.1:8000/v2/auth/health >/dev/null; echo PRODUCTION_COMMIT=\${live_sha}; echo PRODUCTION_HEALTH=OK"
