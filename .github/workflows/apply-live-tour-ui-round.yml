name: Apply Live Tour UI round

on:
  push:
    paths:
      - '.github/workflows/apply-live-tour-ui-round.yml'

permissions:
  contents: write

concurrency:
  group: vera-spa-production
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch Live Tour UI and behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          page = Path('web-v2/src/pages/LiveTourPage.jsx')
          s = page.read_text()

          s = once(s,
          '''function durationText(seconds) {\n  const total = Math.max(0, Math.floor(Math.abs(Number(seconds || 0))))\n  const hours = Math.floor(total / 3600)\n  const minutes = Math.floor((total % 3600) / 60)\n  const secs = total % 60\n  return `${hours ? `${hours}:` : ''}${`${minutes}`.padStart(2, '0')}:${`${secs}`.padStart(2, '0')}`\n}\n''',
          '''function durationText(seconds) {\n  const totalMinutes = Math.max(0, Math.ceil(Math.abs(Number(seconds || 0)) / 60))\n  const hours = Math.floor(totalMinutes / 60)\n  const minutes = totalMinutes % 60\n  return `${hours}:${`${minutes}`.padStart(2, '0')}`\n}\n''', 'duration H:MM')

          s = once(s,
          "  const [selectedRoomKey, setSelectedRoomKey] = useState('')\n  const [clockMs, setClockMs] = useState(Date.now())\n",
          "  const [selectedRoomKey, setSelectedRoomKey] = useState('')\n  const [roomFilterIds, setRoomFilterIds] = useState(() => new Set())\n  const [clockMs, setClockMs] = useState(Date.now())\n", 'room filter state')

          s = once(s,
          "  const normalizedRole = String(user?.role || '').trim().toLowerCase()\n",
          "  const normalizedRole = String(user?.role || '').trim().toLowerCase()\n  const privilegedLiveTourRole = ['admin', 'quanly', 'letan'].includes(normalizedRole)\n", 'privileged role')

          s = once(s,
          '''  const searchedRecords = useMemo(() => {\n    if (employeePickId) return shiftRecords.filter((record) => stableEmployeeId(record) === employeePickId)\n    const needle = normalizedColumn(employeeSearch)\n    const employeeColumn = employeeNameColumn(columns)\n    return needle ? shiftRecords.filter((record) => searchTextMatches(cellValue(record, employeeColumn), needle)) : shiftRecords\n  }, [columns, employeePickId, employeeSearch, shiftRecords])\n''',
          '''  const searchedRecords = useMemo(() => {\n    const roomFiltered = roomFilterIds.size ? shiftRecords.filter((record) => roomFilterIds.has(stableEmployeeId(record))) : shiftRecords\n    if (employeePickId) return roomFiltered.filter((record) => stableEmployeeId(record) === employeePickId)\n    const needle = normalizedColumn(employeeSearch)\n    const employeeColumn = employeeNameColumn(columns)\n    return needle ? roomFiltered.filter((record) => searchTextMatches(cellValue(record, employeeColumn), needle)) : roomFiltered\n  }, [columns, employeePickId, employeeSearch, roomFilterIds, shiftRecords])\n''', 'room list filtering')

          s = once(s,
          "  const reports = filterTourRows(allReports, listFilters)\n  const visibleInvoices = filterTourRows(asArray(data.state?.invoices), listFilters)\n",
          "  const reports = filterTourRows(allReports, listFilters)\n  const visibleInvoices = filterTourRows(asArray(data.state?.invoices), listFilters)\n  const reportInvoiceCount = new Set(reports.map((item) => String(item?.invoice_id || '')).filter(Boolean)).size\n", 'invoice count')

          s = once(s,
          "    { key: 'all', label: 'Tất cả', value: employeeCount, className: '' },\n    { key: 'available', label: 'Có thể lên tua', value: groupCount(shiftRecords, 'available'), className: 'tour-available-metric' },\n    { key: 'idle', label: 'Đang rảnh', value: groupCount(shiftRecords, 'idle'), className: '' },\n    { key: 'finishing', label: 'Sắp xong', value: groupCount(shiftRecords, 'finishing'), className: '' },\n    { key: 'waiting', label: 'Đang chờ', value: groupCount(shiftRecords, 'waiting'), className: '' },\n    { key: 'doing', label: 'Thực hiện', value: groupCount(shiftRecords, 'doing'), className: '' },\n    { key: 'staff', label: 'Số nhân viên', value: employeeCount, className: '' },\n    { key: 'leave', label: 'Nghỉ phép', value: groupCount(shiftRecords, 'leave'), className: '' },\n    { key: 'working', label: 'Đi làm', value: groupCount(shiftRecords, 'working'), className: '' },\n    { key: 'break', label: 'Nghỉ giữa Ca', value: `${breakTotal}-${breakActive}`, className: 'tour-break-metric' },\n",
          "    { key: 'all', label: 'Tất cả', value: employeeCount, className: 'tour-all-metric' },\n    { key: 'available', label: 'Có thể lên tua', value: groupCount(shiftRecords, 'available'), className: 'tour-available-metric' },\n    { key: 'idle', label: 'Đang rảnh', value: groupCount(shiftRecords, 'idle'), className: 'tour-idle-metric' },\n    { key: 'finishing', label: 'Sắp xong', value: groupCount(shiftRecords, 'finishing'), className: 'tour-finishing-metric' },\n    { key: 'waiting', label: 'Đang chờ', value: groupCount(shiftRecords, 'waiting'), className: 'tour-waiting-metric' },\n    { key: 'doing', label: 'Thực hiện', value: groupCount(shiftRecords, 'doing'), className: 'tour-doing-metric' },\n    { key: 'staff', label: 'Số nhân viên', value: employeeCount, className: 'tour-staff-metric' },\n    { key: 'leave', label: 'Nghỉ phép', value: groupCount(shiftRecords, 'leave'), className: 'tour-leave-metric' },\n    { key: 'working', label: 'Đi làm', value: groupCount(shiftRecords, 'working'), className: 'tour-working-metric' },\n    { key: 'break', label: 'Nghỉ giữa Ca', value: `${breakTotal}-${breakActive}`, className: 'tour-break-metric' },\n", 'metric colors')

          s = once(s,
          "              {canReports && <button type=\"button\" className=\"secondary-button\" onClick={() => openWorkspacePanel('reports')}>Báo cáo</button>}\n",
          "              {privilegedLiveTourRole && canReports && <button type=\"button\" className=\"secondary-button\" onClick={() => openWorkspacePanel('reports')}>Báo cáo ({reportInvoiceCount})</button>}\n", 'report menu count')

          for needle in [
              "          {canPayment && <button type=\"button\" className=\"secondary-button\" onClick={() => openModal('quick_checkout', { rowIds: [], defaults: { checkout_source: 'manual' } })} disabled={Boolean(actionBusy)}>Thanh toán nhanh</button>}",
              "          {canPending && <button type=\"button\" className=\"secondary-button\" onClick={() => openWorkspacePanel('pending')}>Hóa đơn chờ thanh toán{allPendingPayments.length ? ` (${allPendingPayments.length})` : ''}</button>}",
              "          {canPaidInvoiceView && <button type=\"button\" className=\"secondary-button\" onClick={() => openWorkspacePanel('invoices')}>Hóa đơn đã thanh toán</button>}",
              "          {canCustomers && <button type=\"button\" className=\"secondary-button\" onClick={() => openWorkspacePanel('customers')}>Khách hàng</button>}",
              "          {canViewComboPackages && <button type=\"button\" className=\"secondary-button\" onClick={() => { setComboLookupSearch(''); setComboLookupOpen(true) }}><Search size={16}/> Gói Combo</button>}",
          ]:
              if needle not in s:
                  raise SystemExit('missing top privileged action: ' + needle[:60])
              s = s.replace(needle, needle.replace('{can', '{privilegedLiveTourRole && can'), 1)

          s = once(s,
          "        <section className=\"panel live-tour-operator live-tour-controls\" aria-label=\"Điều khiển\">\n",
          "        <section className={`panel live-tour-operator live-tour-controls ${privilegedLiveTourRole ? '' : 'live-tour-management-hidden'}`} aria-label=\"Điều khiển\">\n", 'management controls')
          s = once(s,
          "    <section className=\"panel live-tour-operator live-tour-workspace\" ref={workspaceRef}>\n",
          "    <section className={`panel live-tour-operator live-tour-workspace ${privilegedLiveTourRole ? '' : 'live-tour-management-hidden'}`} ref={workspaceRef}>\n", 'management workspace')

          s = once(s,
          "                  onClick={() => { setSelectedRoomKey(key); setSelectedIds(new Set()) }}\n                  onDoubleClick={() => { if (canBook && !actionBusy) { setError(''); setBookingContext({ roomLabel: areaLabel(room), roomGroup: key }) } }}\n                  title=\"Bấm một lần để xem nhân viên; bấm đúp để đặt lịch\" aria-expanded={selectedRoomKey === key}>\n",
          "                  onClick={() => { const active = records.filter((item) => hasGroup(item, 'waiting') || hasGroup(item, 'doing')); const ids = new Set(active.map((item) => stableEmployeeId(item)).filter(Boolean)); setSelectedRoomKey(key); setRoomFilterIds(ids); setSelectedIds(ids); setEmployeePickId(''); setEmployeeSearch(''); setActiveFilter('all') }}\n                  onDoubleClick={() => { if (canBook && !actionBusy) { setError(''); setBookingContext({ roomLabel: areaLabel(room), roomGroup: key }) } }}\n                  title=\"Bấm một lần để lọc nhân viên trong phòng; bấm đúp để đặt lịch\" aria-expanded={selectedRoomKey === key}>\n", 'room single click filter')

          s = once(s,
          "                <div className=\"tour-room-countdown\"><Clock3 size={16}/><span className={['Đang trống', 'Đã hết giờ'].includes(countdown) ? 'tour-room-countdown-label' : undefined}>{countdown}</span></div>\n",
          "                <div className=\"tour-room-countdown\"><Clock3 size={16}/><span className={/^(Còn|Đang chờ|Đang trống)/.test(countdown) ? 'tour-room-countdown-label' : undefined}>{countdown}</span></div>\n", 'compact countdown label')

          s = once(s,
          "        <LiveTourRevenueSummary rows={reports}/>\n",
          "        <LiveTourRevenueSummary rows={reports} invoiceCount={reportInvoiceCount}/>\n", 'revenue invoice count prop')

          s = once(s,
          "  if (action === 'set_shift') return capabilities.isAdmin === true\n",
          "  if (action === 'set_shift' || action === 'restart_booking') return capabilities.isAdmin === true\n", 'admin restart frontend auth')

          restart_button_anchor = "              <button type=\"button\" className=\"secondary-button danger-button\" disabled={!canOperate || !selectedIds.size || Boolean(actionBusy)} onClick={cancelSelectedBooking}>Hủy Booking</button>\n"
          restart_button = restart_button_anchor + "              {isAdmin && <button type=\"button\" className=\"secondary-button danger-button\" disabled={selectedIds.size !== 1 || !hasGroup(selectedRecords[0], 'doing') || Boolean(actionBusy)} onClick={() => { if (window.confirm('Hủy lệnh Thực hiện và đưa booking về trạng thái Đang chờ để tính giờ lại?')) void runSingleSelected('restart_booking') }}>Hủy Thực hiện</button>}\n"
          s = once(s, restart_button_anchor, restart_button, 'admin restart button')

          page.write_text(s)

          booking = Path('web-v2/src/components/LiveTourBookingDialog.jsx')
          s = booking.read_text()
          s = once(s,
          "    ...(!editing ? { share_private_room: sharePrivateRoom } : {}),\n",
          "    share_private_room: sharePrivateRoom,\n", 'share PR payload editing')
          s = once(s,
          "        {canSharePrivateRoom && !editing && <label className=\"wide\"><input type=\"checkbox\" checked={sharePrivateRoom} onChange={event => { setSharePrivateRoom(event.target.checked); setMessage('') }}/> Cho khách dùng chung phòng PR</label>}\n",
          "        {canSharePrivateRoom && <label className=\"wide\"><input type=\"checkbox\" checked={sharePrivateRoom} onChange={event => { setSharePrivateRoom(event.target.checked); setMessage('') }}/> Cho khách dùng chung phòng PR</label>}\n", 'share PR editing UI')
          booking.write_text(s)

          revenue = Path('web-v2/src/components/LiveTourRevenueSummary.jsx')
          s = revenue.read_text()
          s = once(s, "export default function LiveTourRevenueSummary({ rows }) {", "export default function LiveTourRevenueSummary({ rows, invoiceCount = 0 }) {", 'revenue prop')
          s = once(s,
          "    <div className=\"tour-revenue-summary-total\"><dt>Tổng doanh thu</dt><dd>{money(totals.totalRevenue)}</dd></div>\n",
          "    <div className=\"tour-revenue-summary-total\"><dt>Tổng doanh thu</dt><dd>{money(totals.totalRevenue)}</dd></div>\n    <div className=\"tour-revenue-summary-invoices\"><dt>Số hóa đơn</dt><dd>{invoiceCount.toLocaleString('vi-VN')}</dd></div>\n", 'invoice count box')
          revenue.write_text(s)

          controls = Path('web-v2/src/pages/LiveTourControls.css')
          css = controls.read_text()
          marker = '/* 2026-09-16 Live Tour compact room/role/status round */'
          if marker not in css:
              css += r'''\n\n/* 2026-09-16 Live Tour compact room/role/status round */
.live-tour-page .tour-table .tour-col-request{width:41px!important;min-width:41px!important;max-width:41px!important}
.live-tour-page .tour-table .tour-col-remaining{width:44px!important;min-width:44px!important;max-width:44px!important}
.live-tour-page .tour-table .tour-col-room{width:50px!important;min-width:50px!important;max-width:50px!important}
.live-tour-page .live-tour-customer-count{background:#ff8a00!important;border-color:#d45f00!important;color:#241000!important;box-shadow:0 0 0 2px rgba(255,138,0,.2),0 2px 8px rgba(191,80,0,.25)}
.live-tour-page .metric-grid.small .metric-card.tour-metric-card{min-height:22.5px!important}
.live-tour-page .tour-all-metric{background:#eef3f1!important}
.live-tour-page .tour-available-metric{background:#dff4e8!important}
.live-tour-page .tour-idle-metric{background:#e5f7f1!important}
.live-tour-page .tour-finishing-metric{background:#fff0b8!important}
.live-tour-page .tour-waiting-metric{background:var(--tour-row-waiting,#eadcf8)!important}
.live-tour-page .tour-doing-metric{background:#dff4e8!important}
.live-tour-page .tour-staff-metric{background:#e9eef9!important}
.live-tour-page .tour-leave-metric{background:#ffdede!important}
.live-tour-page .tour-working-metric{background:#e7f5df!important}
.live-tour-page .tour-break-metric{background:#ffe6bb!important}
.live-tour-page .tour-room-countdown .tour-room-countdown-label{font-size:50%!important}
.live-tour-page .tour-room-panel .tour-room-grid{grid-auto-rows:auto!important;align-items:start!important;overflow:visible!important}
.live-tour-page .tour-room-panel .tour-room-grid .tour-room-card{height:auto!important;min-height:0!important;align-self:start!important;overflow:visible!important}
.live-tour-page .tour-room-panel .tour-room-grid .tour-room-booking-button{height:auto!important;min-height:0!important}
.live-tour-page .tour-room-panel .tour-room-grid .room-actions button{display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important}
.live-tour-page .tour-room-detail{display:none!important}
.live-tour-page .live-tour-management-hidden{display:none!important}
@media(max-width:820px){
  .live-tour-page .tour-heading-actions button{min-height:14.4px!important;height:auto!important;padding-top:1px!important;padding-bottom:1px!important}
  .live-tour-page .tour-room-panel .tour-room-grid .tour-room-card-head>strong{font-size:12px!important;line-height:1.15!important;white-space:normal!important;overflow-wrap:anywhere!important}
  .live-tour-page .tour-room-panel .tour-room-grid .tour-room-type{font-size:6px!important}
}
'''
          controls.write_text(css)

          service_css = Path('web-v2/src/components/LiveTourServiceActions.css')
          css = service_css.read_text()
          if marker not in css:
              css += r'''\n\n/* 2026-09-16 Live Tour compact room/role/status round */
.live-tour-page .tour-room-grid .tour-room-booking-button{min-height:0!important;height:auto!important}
.live-tour-page .tour-room-grid .tour-room-card{min-height:0!important;height:auto!important}
.live-tour-page .tour-room-grid .room-actions button{align-items:center!important;justify-content:center!important;text-align:center!important}
'''
          service_css.write_text(css)

          backend = Path('vera_web_v2_live_tour.py')
          s = backend.read_text()
          s = once(s,
          '    "update_booking", "cancel_booking", "change_employee", "update_appointment", "update_started_at", "finish_to_pending", "payment_settings_update", "start_room", "finish_room", "clear_orphan_pending",\n',
          '    "update_booking", "cancel_booking", "restart_booking", "change_employee", "update_appointment", "update_started_at", "finish_to_pending", "payment_settings_update", "start_room", "finish_room", "clear_orphan_pending",\n', 'restart idempotency')
          s = once(s,
          'def _required_action_feature(action: str) -> str:\n',
          'def _required_action_feature(action: str) -> str:\n    if action == "restart_booking":\n        return "live_tour_admin"\n', 'restart required feature')
          s = once(s,
          '''    elif action == "cancel_booking":\n        employee = _employee(state, payload.get("employee_id"))\n''',
          '''    elif action == "restart_booking":\n        employee = _employee(state, payload.get("employee_id"))\n        if _norm(employee.get("status")) not in {"dang thuc hien", "dang su dung"} or not employee.get("started_at") or employee.get("completed_at"):\n            raise HTTPException(409, "Chỉ hủy lệnh Thực hiện cho booking đang chạy và chưa hoàn thành.")\n        position = employee.get("pre_start_tour_position") or {}\n        counter_key = "request_count" if _norm(employee.get("request")) == "yc" else "tour_count"\n        if position.get("counter_day") in {None, _counter_business_date(now).isoformat()}:\n            employee[counter_key] = max(0, int(employee.get(counter_key) or 0) - 1)\n        employee["status"] = "Đang chờ"\n        employee["started_at"] = ""\n        employee["completed_at"] = ""\n        employee["payment_status"] = ""\n        employee["completion_note"] = ""\n        employee["completion_delta_minutes"] = None\n        employee["wait_minutes"] = None\n        employee.pop("employee_change_minutes", None)\n        employee.pop("pre_start_tour_position", None)\n        payload = {**payload, "booking_id": employee.get("booking_id", ""), "room": employee.get("room", ""), "service": employee.get("service", "")}\n        result = {"employee": employee, "restarted": True}\n    elif action == "cancel_booking":\n        employee = _employee(state, payload.get("employee_id"))\n''', 'restart action')
          s = once(s,
          '        _check_room_collision(state, employee, room_item["name"], name)\n        identity = _common_customer_identity([employee])\n',
          '        _check_room_collision(state, employee, room_item["name"], name, share_private_room=payload.get("share_private_room") is True)\n        if payload.get("share_private_room") is True and _is_private_service(name):\n            employee["private_room_share_group"] = _catalog_room_group(state, room_item["name"])\n        elif not _is_private_service(name):\n            employee.pop("private_room_share_group", None)\n        identity = _common_customer_identity([employee])\n', 'update booking shared PR')
          backend.write_text(s)

          test = Path('tests/test_live_tour_restart_booking.py')
          test.write_text('''from copy import deepcopy\nimport pytest\nfrom fastapi import HTTPException\nimport vera_web_v2_live_tour as live\nfrom test_live_tour_backend import NOW, employee, state_with\n\n\ndef running(request=''):\n    row = employee('e1', 'An')\n    row.update(status='Đang chờ', service='Body 90', room='1.1', duration=90, request=request, booked_at=live._iso(NOW))\n    state = state_with(row)\n    live._ensure_counter_day(state, NOW)\n    live._start_employee(state, row, NOW)\n    return state, row\n\ndef test_restart_booking_returns_running_to_waiting_without_double_count():\n    state, row = running()\n    assert row['tour_count'] == 1\n    live._apply_action(state, 'restart_booking', {'employee_id':'e1'}, 'admin', NOW)\n    assert row['status'] == 'Đang chờ' and row['started_at'] == ''\n    assert row['tour_count'] == 0\n    live._start_employee(state, row, NOW)\n    assert row['tour_count'] == 1\n\ndef test_restart_booking_request_counter_is_reversible():\n    state, row = running('YC')\n    assert row['request_count'] == 1\n    live._apply_action(state, 'restart_booking', {'employee_id':'e1'}, 'admin', NOW)\n    assert row['request_count'] == 0\n\ndef test_restart_booking_rejects_waiting():\n    row = employee('e1','An'); row.update(status='Đang chờ', service='Body 90', room='1.1')\n    state = state_with(row)\n    with pytest.raises(HTTPException):\n        live._apply_action(state, 'restart_booking', {'employee_id':'e1'}, 'admin', NOW)\n\ndef test_restart_booking_requires_admin_feature():\n    assert live._required_action_feature('restart_booking') == 'live_tour_admin'\n''')
          PY

          python3 -m py_compile vera_web_v2_live_tour.py
          python3 -m pytest -q tests/test_live_tour_restart_booking.py tests/test_live_tour_cancel_booking.py tests/test_live_tour_room_actions.py
          cd web-v2
          npm ci
          npm run build
          cd ..
          git diff --check

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-v2/src/pages/LiveTourPage.jsx web-v2/src/pages/LiveTourControls.css web-v2/src/components/LiveTourBookingDialog.jsx web-v2/src/components/LiveTourServiceActions.css web-v2/src/components/LiveTourRevenueSummary.jsx vera_web_v2_live_tour.py tests/test_live_tour_restart_booking.py
          git commit -m 'Upgrade Live Tour room controls and management UI'
          git push origin HEAD:main

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy patched commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            "timeout 240 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'set -e; curl -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:8000/v2/attendance/break-alerts/dispatch/health; echo; systemctl is-active vera-api.service'
