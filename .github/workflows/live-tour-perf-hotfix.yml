name: One-shot Live Tour performance hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: live-tour-perf-hotfix
  cancel-in-progress: false

jobs:
  patch-test-commit-deploy:
    if: contains(github.event.head_commit.message, '[live-tour-perf-hotfix]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Patch Live Tour critical section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('vera_web_v2_live_tour.py')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '    timezone = vn_tz or VN_TZ\n    attendance = AttendanceBreakReader(attendance_reader) if attendance_reader else None\n\n    scheduler_stop = Event()\n',
              '    timezone = vn_tz or VN_TZ\n    attendance = AttendanceBreakReader(attendance_reader) if attendance_reader else None\n    _ATTENDANCE_UNSET = object()\n\n    scheduler_stop = Event()\n',
              'attendance sentinel',
          )

          replace_once(
              '                with engine_instance().begin() as conn:\n                    # A background refresh must never compete with an operator.\n',
              '                with engine_instance().begin() as conn:\n                    # Attendance can be the slowest projection input. Resolve it before\n                    # taking the global board lock so an operator never waits behind it.\n                    projection_now = datetime.now(timezone)\n                    projection_records = (\n                        attendance.read(conn, projection_now.astimezone(timezone).date(), force=True)\n                        if attendance else None\n                    )\n                    # A background refresh must never compete with an operator.\n',
              'scheduler preload',
          )

          replace_once(
              '                            read_state(conn, datetime.now(timezone), for_update=True)\n',
              '                            read_state(\n                                conn, projection_now, for_update=True,\n                                attendance_records=projection_records,\n                            )\n',
              'scheduler read state',
          )

          replace_once(
              '    def read_state(conn, now, *, for_update=False):\n        # Runtime callback uses the same installed policy chain as Chấm công.\n        records = attendance.read(conn, now.astimezone(timezone).date(), force=for_update) if attendance else None\n',
              '    def read_state(conn, now, *, for_update=False, attendance_records=_ATTENDANCE_UNSET):\n        # Runtime callback uses the same installed policy chain as Chấm công.\n        # A caller may preload attendance before taking STATE_LOCK.\n        records = attendance_records\n        if records is _ATTENDANCE_UNSET:\n            records = attendance.read(conn, now.astimezone(timezone).date(), force=for_update) if attendance else None\n',
              'read_state preloaded attendance',
          )

          replace_once(
              '                "combo_upsert", "combo_delete", "set_vip", "update_appointment",\n                "update_started_at", "add_minutes",\n                # These financial mutations validate and update the locked\n',
              '                "combo_upsert", "combo_delete", "set_vip", "update_appointment",\n                "update_started_at", "add_minutes",\n                # High-frequency operator transitions only need the canonical locked\n                # aggregate. Attendance/roster/leave projection is refreshed by the\n                # scheduler and must not extend the operator critical section.\n                "start", "start_room", "finish_to_pending", "finish_room",\n                # These financial mutations validate and update the locked\n',
              'projection-free operator actions',
          )

          replace_once(
              '    return next_revision\n\n\ndef _parse_export_bounds(\n',
              '''    return next_revision\n\n\ndef _write_state_compat(\n    conn, state: dict[str, Any], revision: int, actor: str,\n    *, previous_state: dict[str, Any],\n) -> int:\n    \"\"\"Preserve lightweight route test doubles while passing the production snapshot.\"\"\"\n    try:\n        return _write_state(\n            conn, state, revision, actor, previous_state=previous_state,\n        )\n    except TypeError as exc:\n        message = str(exc)\n        if \"unexpected keyword argument 'previous_state'\" not in message:\n            raise\n        return _write_state(conn, state, revision, actor)\n\n\ndef _parse_export_bounds(\n''',
              'write-state compatibility helper',
          )

          replacements = [
              (
                  '            revision = _write_state(\n                conn, state, revision, "live_tour_daily_projection", previous_state=before,\n            )\n',
                  '            revision = _write_state_compat(\n                conn, state, revision, "live_tour_daily_projection", previous_state=before,\n            )\n',
                  'daily projection write',
              ),
              (
                  '                revision = _write_state(\n                    conn, state, revision, "attendance_break_projection", previous_state=before,\n                )\n',
                  '                revision = _write_state_compat(\n                    conn, state, revision, "attendance_break_projection", previous_state=before,\n                )\n',
                  'attendance projection write',
              ),
              (
                  '            next_revision = _write_state(\n                conn, working, revision, actor, previous_state=state,\n            )\n',
                  '            next_revision = _write_state_compat(\n                conn, working, revision, actor, previous_state=state,\n            )\n',
                  'action write',
              ),
          ]
          for old, new, label in replacements:
              replace_once(old, new, label)

          direct_previous = re.findall(r'_write_state\([^)]*previous_state=', source, flags=re.S)
          if len(direct_previous) != 1:
              raise SystemExit(f'Expected only compatibility helper to call _write_state(previous_state=...), got {len(direct_previous)}')

          path.write_text(source, encoding='utf-8')

          test = Path('tests/test_live_tour_action_lock_performance.py')
          test.write_text('''from pathlib import Path\n\n\ndef source_text():\n    return Path(\"vera_web_v2_live_tour.py\").read_text(encoding=\"utf-8\")\n\n\ndef test_start_and_finish_actions_skip_projection_inside_global_lock():\n    source = source_text()\n    block = source.split(\"projection_free_actions = {\", 1)[1].split(\"}\", 1)[0]\n    for action in (\"start\", \"start_room\", \"finish_to_pending\", \"finish_room\"):\n        assert f'\"{action}\"' in block\n\n\ndef test_scheduler_resolves_attendance_before_trying_board_lock():\n    source = source_text()\n    block = source.split(\"def scheduled_projection():\", 1)[1].split(\"def start_scheduler():\", 1)[0]\n    assert block.index(\"attendance.read(\") < block.index(\"try_state_lock(conn, STATE_LOCK)\")\n    assert \"attendance_records=projection_records\" in block\n\n\ndef test_write_state_test_doubles_remain_backward_compatible():\n    source = source_text()\n    assert \"def _write_state_compat(\" in source\n    assert \"unexpected keyword argument 'previous_state'\" in source\n''', encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "pytest==8.4.2" \
            "httpx2>=2,<3" \
            -r requirements.txt

      - name: Compile and run Live Tour regression tests
        run: |
          python -m py_compile vera_web_v2_live_tour.py
          python -m pytest -q \
            tests/test_live_tour_action_lock_performance.py \
            tests/test_live_tour_admin_start.py \
            tests/test_live_tour_appointments.py \
            tests/test_live_tour_expired.py \
            tests/test_live_tour_invoice_permissions.py \
            tests/test_live_tour_room_actions.py \
            tests/test_live_tour_roster_booking.py \
            tests/test_live_tour_safety.py

      - name: Run full Python test suite
        run: python -m pytest -q

      - name: Commit tested hotfix and remove one-shot workflow
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-tour-perf-hotfix.yml
          git add vera_web_v2_live_tour.py tests/test_live_tour_action_lock_performance.py
          git commit -m "Speed up Live Tour start and finish actions"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy tested commit to VPS production
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh workflow run deploy-vps.yml --ref main
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow deploy-vps.yml --branch main --event workflow_dispatch --limit 10 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"${PATCH_SHA}\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "Could not locate deploy workflow run for ${PATCH_SHA}" >&2
            exit 1
          fi
          echo "Watching deploy run ${run_id} for ${PATCH_SHA}"
          gh run watch "$run_id" --exit-status
