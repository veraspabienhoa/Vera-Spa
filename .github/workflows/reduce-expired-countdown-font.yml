name: Reduce expired countdown font

on:
  push:
    paths:
      - '.github/workflows/reduce-expired-countdown-font.yml'

permissions:
  contents: write

concurrency:
  group: reduce-expired-countdown-font
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reduce expired countdown text size by 20 percent
        run: |
          python - <<'PY'
          from pathlib import Path

          jsx_path = Path('web-v2/src/pages/LiveTourPage.jsx')
          jsx = jsx_path.read_text(encoding='utf-8')
          old = "<span className={/^(Còn|Đang chờ|Đang trống)/.test(countdown) ? 'tour-room-countdown-label' : undefined}>{countdown}</span>"
          new = "<span className={countdown === 'Đã hết giờ' ? 'tour-room-countdown-expired' : /^(Còn|Đang chờ|Đang trống)/.test(countdown) ? 'tour-room-countdown-label' : undefined}>{countdown}</span>"
          if old not in jsx:
              raise SystemExit('Countdown span pattern not found')
          jsx = jsx.replace(old, new, 1)
          jsx_path.write_text(jsx, encoding='utf-8')

          css_path = Path('web-v2/src/pages/LiveTourControls.css')
          css = css_path.read_text(encoding='utf-8')
          rule = ".live-tour-page .tour-room-countdown .tour-room-countdown-expired{font-size:80%!important}\n"
          if rule not in css:
              css += "\n" + rule
          css_path.write_text(css, encoding='utf-8')

          assert "countdown === 'Đã hết giờ' ? 'tour-room-countdown-expired'" in jsx
          assert '.tour-room-countdown-expired{font-size:80%!important}' in css
          print('EXPIRED_COUNTDOWN_FONT_80_PERCENT=OK')
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Test and build frontend
        working-directory: web-v2
        run: |
          npm ci
          node --test tests/liveTourAppointments.test.mjs tests/bookingControls.test.mjs tests/bookingAvailability.test.mjs
          npm run build

      - name: Commit functional change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-v2/src/pages/LiveTourPage.jsx web-v2/src/pages/LiveTourControls.css
          git commit -m 'Reduce expired room countdown text size'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 180 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "set -e; pid=\$(pgrep -n -f '[v]era_web_v2_api_v38:app'); release_dir=\$(readlink -f /proc/\${pid}/cwd); live_sha=\$(git -C \"\${release_dir}\" rev-parse HEAD); test \"\${live_sha}\" = '${DEPLOY_SHA}'; curl -fsS http://127.0.0.1:8000/v2/auth/health >/dev/null; echo PRODUCTION_COMMIT=\${live_sha}; echo PRODUCTION_HEALTH=OK"
