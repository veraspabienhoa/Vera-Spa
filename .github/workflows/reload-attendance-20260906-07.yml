name: Reload Attendance 2026-09-06 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reload-attendance-20260906-07.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vera-spa-attendance-reload
  cancel-in-progress: false

jobs:
  reload:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy current main commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            "/opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Reload TimeSoft attendance for 6 and 7 Sep 2026
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); bash "${release_dir}/reload_timesoft_attendance_vps.sh"'
