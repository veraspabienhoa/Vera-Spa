name: Reload Attendance 2026-09-06 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reload-attendance-20260906-07.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vera-spa-attendance-reload
  cancel-in-progress: false

jobs:
  reload:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Reload TimeSoft attendance for 6 and 7 Sep 2026
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'set -e
            pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app")
            release_dir=$(readlink -f "/proc/${pid}/cwd")
            test -f "${release_dir}/reload_timesoft_attendance_dates.py"
            /opt/vera-spa/.venv/bin/python - "$pid" "$release_dir" <<'"'"'PY'"'"'
import os
import sys

pid = sys.argv[1]
release_dir = sys.argv[2]
with open(f"/proc/{pid}/environ", "rb") as fh:
    items = fh.read().split(b"\0")
env = {}
for item in items:
    if b"=" not in item:
        continue
    key, value = item.split(b"=", 1)
    env[key.decode("utf-8", "ignore")] = value.decode("utf-8", "ignore")
env["TIMESOFT_SYNC_DAYS"] = "2"
os.chdir(release_dir)
python = "/opt/vera-spa/.venv/bin/python"
os.execve(python, [python, "reload_timesoft_attendance_dates.py"], env)
PY'
