              'payroll new Excel has title period and safe columns': all(token in payroll for token in ('BẢNG LƯƠNG NHÂN VIÊN', 'KỲ LƯƠNG', "Từ ngày {start.strftime('%d/%m/%Y')} đến {end.strftime('%d/%m/%Y')}", '_new_payroll_sheet_title', 'field not in {"Email", "Số dòng Tip"}', 'field == "TT"', 'period_ranges')),
