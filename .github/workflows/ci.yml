              'TimeSoft payroll snapshots self-heal missing historical days': all(token in timesoft_job for token in ('TIMESOFT_PAYROLL_BACKFILL_DAYS', 'TIMESOFT_PAYROLL_BACKFILL_BATCH_DAYS', 'def _missing_payroll_invoice_dates', 'def backfill_missing_payroll_snapshots', 'write_invoice_snapshot(target_date, invoice_df, invoice_meta)')) and 'payroll-timesoft-auto-2026-08-29.2' in payroll_timesoft and all(token in build for token in ('TIMESOFT_PAYROLL_BACKFILL_DAYS=45', 'TIMESOFT_PAYROLL_BACKFILL_BATCH_DAYS=12')),
              'Admin can configure former employee accumulation refunds': all(token in payroll for token in ('AccumulationRefundCreate', '/v2/payroll/accumulation-refunds', '_accumulation_refund_map', 'Chỉ Admin được cài đặt hoàn trả tiền tích lũy', 'Tạm thời nghỉ việc hoặc Đã nghỉ việc')) and all(token in payroll_enhanced_page for token in ('HOÀN TRẢ TIỀN TÍCH LŨY – NHÂN VIÊN NGHỈ VIỆC', 'addAccumulationRefund', 'removeAccumulationRefund')) and all(token in api_client for token in ('payrollAccumulationRefunds', 'createPayrollAccumulationRefund', 'deletePayrollAccumulationRefund')),
