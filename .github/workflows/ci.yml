              'payroll upload calculate save refund and email exist': all(token in payroll for token in ('/v2/payroll/calculate','/v2/payroll/save','Hoàn trả tiền tích lũy','/v2/payroll/email','leader_responsibility_allowance')),
              'payroll validates the exact TimeSoft B/F/G/I format and nonzero Tip result': all(token in payroll for token in ('TIMESOFT_PAYROLL_HEADERS', 'TIP_ITEM_PATTERN', 'def _tip_rows', 'matched_tip_rows', 'matched_salary_total', 'Tổng Tiền Lương đang bằng 0')),
