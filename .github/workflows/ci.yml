          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(('PASS' if ok else 'FAIL') + ': ' + name)
          if failed: raise SystemExit('Failed Web V2 phase-20 invariants: ' + ', '.join(failed))
          PY

      - name: Verify post-login landing and safe Cloud Run rollout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          landing = Path('vera_postlogin_default_page.py').read_text(encoding='utf-8')
          app = Path('app.py').read_text(encoding='utf-8')
          build = Path('cloudbuild.yaml').read_text(encoding='utf-8')
          checks = {
              'leave page is landing target': '📅 Đăng ký nghỉ' in landing,
              'landing applies once per session': '_vera_postlogin_leave_landing_applied' in landing,
              'normal navigation remains after first landing': 'session_state.get(_FLAG, False)' in landing,
              'sidebar/main selector coverage': 'DeltaGenerator' in landing and 'radio' in landing and 'selectbox' in landing,
              'landing shim installed before core exec': 'vera_postlogin_default_page' in app and app.index('vera_postlogin_default_page') < app.index('exec(_compiled_core'),
              'candidate receives no production traffic': '--no-traffic' in build,
              'candidate has unique commit tag': '--tag=candidate-$SHORT_SHA' in build,
              'Streamlit candidate health endpoint checked': '/_stcore/health' in build,
              'exact checked revision is captured': 'revisionName' in build and 'cloud-run-candidate.txt' in build,
              'promotion uses captured exact revision': '--to-revisions=' in build and 'CANDIDATE_REVISION' in build,
              'one warm web instance retained': '--min=1' in build,
              'session affinity retained': '--session-affinity' in build,
              'long-lived Streamlit request timeout retained': '--timeout=3600' in build,
              'production promotion happens after health check': build.index('id: "promote-web-candidate"') > build.index('id: "health-check-web-candidate"'),
          }
          failed = [k for k,v in checks.items() if not v]
          for name, ok in checks.items(): print(('PASS' if ok else 'FAIL') + ': ' + name)
          if failed: raise SystemExit('Failed operational invariants: ' + ', '.join(failed))
          PY

  web-v2:
    name: React Web V2 build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web-v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
