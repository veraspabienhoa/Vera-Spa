name: VERA SPA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vera-spa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python + canonical business checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          files = sorted(Path('.').glob('*.py'))
          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("Python compile failures:")
              print("\n".join(failures))
              sys.exit(1)

          print(f"Compiled {len(files)} Python files successfully.")
          PY

      - name: Verify runtime patch chain compiles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib
          import sys

          source = Path('app_v92699_core.py').read_text(encoding='utf-8')
          patch_modules = [
              'vera_postgres_phase4_patch',
              'vera_postgres_phase7_patch',
              'vera_postgres_phase8_patch',
              'vera_postgres_phase10_patch',
              'vera_postgres_phase11_patch',
              'vera_postgres_phase12_patch',
              'vera_postgres_phase13_patch',
              'vera_postgres_phase14_patch',
              'vera_postgres_phase15_patch_fix',
              'vera_postgres_phase16_patch',
              'vera_postgres_phase17_patch_fix',
              'vera_official_rules_patch',
              'vera_leave_registration_live_patch',
              'vera_web_v2_rules_permission_patch',
          ]

          all_warnings = []
          for module_name in patch_modules:
              module = importlib.import_module(module_name)
              source, warnings = module.apply(source)
              if warnings:
                  all_warnings.extend(f"{module_name}: {w}" for w in warnings)

          if all_warnings:
              print('Patch warnings detected:')
              print('\n'.join(all_warnings))
              sys.exit(1)

          compile(source, 'app_v92699_core.patched.py', 'exec')
          if 'vera_leave_registration_live_shared' not in source:
              raise SystemExit('Shared live validator was not installed into patched core.')
          print('Runtime patch chain applied with zero warnings and compiled successfully.')
          PY

      - name: Verify shared leave validation convergence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          shared = Path('vera_leave_registration_live_shared.py').read_text(encoding='utf-8')
          patch = Path('vera_leave_registration_live_patch.py').read_text(encoding='utf-8')
          api = Path('vera_web_v2_api_shared.py').read_text(encoding='utf-8')
          app = Path('app.py').read_text(encoding='utf-8')
          build = Path('cloudbuild.yaml').read_text(encoding='utf-8')

          for name, source in {
              'shared live validator': shared,
              'Streamlit shared patch': patch,
              'Web V2 shared API wrapper': api,
          }.items():
              ast.parse(source)
              print(f'PASS: {name} parses')

          checks = {
              'canonical validator function exists': 'def validate_leave_registration_request_live' in shared,
              'canonical contract includes accumulated month': '"accumulated_month"' in shared,
              'annual leave 7-day rule centralized': 'Phép năm chỉ được đăng ký tối đa 7 ngày liên tiếp' in shared,
              'past/next-month window centralized': 'employee_registration_window' in shared,
              'weekend monthly limit centralized': 'validate_monthly_weekend_registration_limit' in shared,
              'employee daily 0/0.5/1 rule centralized': 'validate_daily_employee_registration_rule' in shared,
              'daily group quota centralized': 'validate_daily_group_quota' in shared,
              'progressive warning centralized': 'Người Thứ' in shared and 'progressive_ordinal_and_bonus' in shared,
              'Streamlit delegates to canonical validator': 'validate_leave_registration_request_live as _vera_shared_validate_leave_live' in patch,
              'Streamlit keeps legacy helper callbacks': '_validate_daily_employee_registration_rule' in patch and '_validate_daily_group_quota' in patch,
              'app installs shared patch': 'vera_leave_registration_live_patch' in app,
              'wrapper build is V92.23.3': 'v92.23.3-postgres-money-parser-1' in app,
              'Web V2 delegates to canonical validator': 'validate_leave_registration_request_live(payload, live_df, credentials_df, runtime)' in api,
              'Web V2 no browser-supplied calculated days': '"days": float(item["days"] or 0)' in api,
              'Web V2 derives policy group from LoaiNghi type': 'def _policy_group' in api and 'leave_type' in api,
              'Web V2 reads current Config quota with safe defaults': 'weekday_limit' in api and 'weekend_limit' in api and 'phat_sinh_limit' in api,
              'Cloud Run API uses shared wrapper': 'vera_web_v2_api_shared:app' in build,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + name)
          if failed:
              raise SystemExit('Failed shared-validation invariants: ' + ', '.join(failed))
          PY

      - name: Verify Web V2 leave coverage and optional audit isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          from vera_leave_registration_shared import (
              count_unique_leave_people,
              summarize_leave_day,
              summarize_leave_days,
          )

          rows = []
          for index in range(1, 5):
              rows.append({
                  'employee_name': f'Có phép {index}',
                  'leave_reason': 'Nghỉ theo chính sách',
                  'leave_type': 'CÓ phép',
                  'calculated_days': 1,
              })
          for index in range(1, 5):
              rows.append({
                  'employee_name': f'Không phép {index}',
                  'leave_reason': 'Nghỉ theo chính sách',
                  'leave_type': 'KHÔNG phép',
                  'calculated_days': 1,
              })

          # Extra rows must not inflate staff coverage metrics.
          rows.extend([
              {
                  'employee_name': 'Có phép 1',
                  'leave_reason': 'Đi trễ KHÔNG phép',
                  'leave_type': 'KHÔNG phép',
                  'calculated_days': 0,
              },
              {
                  'employee_name': 'Có phép 1',
                  'leave_reason': 'Nghỉ theo chính sách',
                  'leave_type': 'CÓ phép',
                  'calculated_days': 1,
              },
          ])

          actual = summarize_leave_day(rows, 36)
          expected = {'working': 28, 'leave': 8, 'paid': 4, 'unpaid': 4}
          if actual != expected:
              raise SystemExit(f'Coverage summary mismatch: {actual} != {expected}')

          quota_rows = [
              {'employee_name': 'An', 'leave_reason': 'Nghỉ CÓ phép', 'leave_type': 'CÓ phép', 'calculated_days': 0.5},
              {'employee_name': 'An', 'leave_reason': 'Nghỉ CÓ phép', 'leave_type': 'CÓ phép', 'calculated_days': 1},
              {'employee_name': 'Bình', 'leave_reason': 'Nghỉ CÓ phép', 'leave_type': 'CÓ phép', 'calculated_days': 1},
          ]
          quota_actual = count_unique_leave_people(quota_rows)
          quota_expected = {'total_leave': 2, 'paid': 2, 'generated': 0, 'unpaid': 0}
          if quota_actual != quota_expected:
              raise SystemExit(f'Unique-person quota mismatch: {quota_actual} != {quota_expected}')

          personal_rows = [
              {'leave_reason': 'Nghỉ CÓ phép', 'leave_type': 'CÓ phép', 'calculated_days': 1},
              {'leave_reason': 'Nghỉ CÓ phép', 'leave_type': 'CÓ phép', 'calculated_days': 1},
              {'leave_reason': 'Nghỉ CÓ phép', 'leave_type': 'CÓ phép', 'calculated_days': 1},
              {'leave_reason': 'Nghỉ CÓ phép', 'leave_type': 'CÓ phép', 'calculated_days': 1},
              {'leave_reason': 'Về sớm CÓ phép', 'leave_type': 'CÓ phép', 'calculated_days': 0.5},
          ]
          personal_actual = summarize_leave_days(personal_rows)
          if personal_actual['total_leave'] != 4.5 or personal_actual['paid'] != 4.5:
              raise SystemExit(f'Actual-day summary must preserve 0.5 days: {personal_actual}')

          api = Path('vera_web_v2_api.py').read_text(encoding='utf-8')
          permissions = Path('vera_web_v2_permissions.py').read_text(encoding='utf-8')
          shared_api = Path('vera_web_v2_api_shared.py').read_text(encoding='utf-8')
          login_page = Path('web-v2/src/pages/LoginPage.jsx').read_text(encoding='utf-8')
          leave_page = Path('web-v2/src/pages/LeaveRegistrationPage.jsx').read_text(encoding='utf-8')
          leave_day_stats_api = Path('vera_web_v2_leave_day_stats.py').read_text(encoding='utf-8')
          api_entrypoint = Path('vera_web_v2_api_v38.py').read_text(encoding='utf-8')
          web_styles = Path('web-v2/src/styles.css').read_text(encoding='utf-8')
          shell = Path('web-v2/src/components/AppShell.jsx').read_text(encoding='utf-8')
          hardening = Path('web-v2/supabase_web_v2_pilot_hardening.sql').read_text(encoding='utf-8')
          daily_stats_sql = Path('web-v2/supabase_web_v2_daily_stats.sql').read_text(encoding='utf-8')
          penalty_default = Path('web-v2/supabase_web_v2_penalty_permission_default.sql').read_text(encoding='utf-8')
          leave_watch_sql = Path('vera_postgres_phase18_leave_watch.sql').read_text(encoding='utf-8')
          push_sql = Path('vera_postgres_phase19_web_push.sql').read_text(encoding='utf-8')
          api_client = Path('web-v2/src/lib/api.js').read_text(encoding='utf-8')
          leave_list_stats = Path('web-v2/src/pages/LeaveListPersonalStats.jsx').read_text(encoding='utf-8')
          leave_stats_helper = Path('web-v2/src/lib/leaveStats.js').read_text(encoding='utf-8')
          push_client = Path('web-v2/src/lib/pushNotifications.js').read_text(encoding='utf-8')
          service_worker = Path('web-v2/public/sw.js').read_text(encoding='utf-8')
          manifest = Path('web-v2/public/manifest.webmanifest').read_text(encoding='utf-8')
          requirements = Path('requirements.txt').read_text(encoding='utf-8')
          checks = {
              'summary queries canonical leave type': 'employee_name, leave_reason, leave_type, calculated_days' in api,
              'summary uses shared unique-employee helper': 'summarize_leave_day(rows, int(active))' in api,
              'optional audit uses a savepoint': 'with conn.begin_nested()' in api,
              'optional audit remains non-blocking': 'Do not make leave registration depend on an optional telemetry table shape.' in api,
              'Web V2 enforces leave-create permission': '_require_feature(conn, ident, "leave_create")' in api,
              'Web V2 enforces registration role lock': '_registration_role_locked(conn, ident.role)' in api,
              'Web V2 penalty visibility follows feature permission': 'can_view_penalty = _feature_allowed(conn, ident, "employee_penalty_view")' in api,
              'Web V2 defaults penalty visibility to admin only': '"employee_penalty_view"' not in permissions.split('FRONTDESK = {', 1)[1].split('}', 1)[0],
              'Web V2 limits employee-like registration to self': 'if role not in {"admin", "quanly", "letan"} and _norm(employee) != _norm(ident.employee_username)' in api,
              'Web V2 manager and front desk can choose employees': "const canChooseEmployee = ['admin', 'quanly', 'letan'].includes(role)" in leave_page,
              'Web V2 manager and front desk receive employee catalog': 'if ident.role in {"admin", "quanly", "letan"}:' in api,
              'Web V2 login uses full VERA SPA title': '<h2>Đăng nhập VERA SPA</h2>' in login_page,
              'Web V2 penalty column follows returned permission': 'user?.permissions?.employee_penalty_view === true' in leave_page,
              'Web V2 uses dd/mm/yyyy date display': '`${day}/${month}/${year}`' in leave_page,
              'Web V2 hides overview metrics before viewed date': '<section className="metric-grid">' not in leave_page and leave_page.index('<div className="date-toolbar viewed-date-toolbar">') < leave_page.index('<div className="content-grid">'),
              'Web V2 supports requested date ranges': all(label in leave_page for label in ('Hôm qua', 'Hôm nay', 'Tuần này', 'Tuần sau', 'Tháng này', 'Tháng sau', 'Tùy chỉnh')),
              'Web V2 statistics supports the requested custom range': "const STAT_DATE_FILTERS = ['Hôm qua', 'Hôm nay', 'Tuần này', 'Tuần sau', 'Tháng này', 'Tháng sau', 'Tùy chỉnh']" in leave_page and "rangeFilter === 'Tùy chỉnh'" in leave_page and all(token in leave_page for token in ('onChange={changeCustomStart}', 'onChange={changeCustomEnd}', 'statistics-custom-range')),
              'Web V2 viewed date synchronizes statistics and list': all(token in leave_page for token in ('setRangeStart(value)', 'setRangeEnd(value)', 'setListRangeStart(value)', 'setListRangeEnd(value)')),
              'Web V2 mobile order is registration then stats then list': leave_page.index('registration-panel') < leave_page.index('daily-summary-panel') < leave_page.index('leave-list-panel'),
              'Web V2 registration follows viewed-date toolbar': leave_page.index('Ngày đang xem') < leave_page.index('registration-panel'),
              'Web V2 uses requested uppercase section titles': all(title in leave_page for title in ('<h2>ĐĂNG KÝ MỚI</h2>', '<h2>THỐNG KÊ</h2>', '<h2>DANH SÁCH</h2>')),
              'Web V2 removes technical registration helper copy': 'Ngày tính và mức phạt mặc định do server lấy từ Nội quy' not in leave_page,
              'Web V2 daily list contains detail column': '<th>Chi tiết</th>' in leave_page and "item.detail || '—'" in leave_page,
              'Web V2 leave list contains weekday column': '<col className="leave-col-weekday" />' in leave_page and '<th>Ngày</th><th>Thứ</th><th>Nhân viên</th>' in leave_page and 'item.weekday_label || weekdayForDate(item.leave_date)' in leave_page,
              'Web V2 daily quota comes from PostgreSQL': "setting_key='daily_quota'" in api and 'paid_full' in api,
              'Web V2 daily quota counts unique employees': 'count_unique_leave_people(bucket["rows"])' in leave_day_stats_api and 'grouped_employees[policy_group].add(employee_key)' in Path('vera_leave_registration_shared.py').read_text(encoding='utf-8'),
              'Web V2 list statistics sums actual calculated days': '@app.get("/v2/leave/list-stats")' in leave_day_stats_api and 'summarize_leave_days(rows)' in leave_day_stats_api and 'veraApi.leaveListStats' in leave_list_stats and 'summary.total_leave += days' in leave_stats_helper,
              'Web V2 installs separated leave statistics routes': 'install_leave_day_stats_routes(' in api_entrypoint and 'LEAVE_DAY_STATS_RELEASE' in leave_day_stats_api,
              'Web V2 clears stale list statistics before changing employees': 'requestRevisionRef.current += 1' in leave_list_stats and 'setSummary(emptyLeaveDaySummary())' in leave_list_stats,
              'Web V2 daily summary only highlights full paid quota': 'paid-limit-full' in leave_page and 'day.generated_full' not in leave_page,
              'Web V2 daily summary fits all role columns': 'colSpan={canViewPenalty ? 7 : 6}' in leave_page and 'with-penalty' in leave_page and 'without-penalty' in leave_page,
              'Web V2 daily summary has no fixed mobile overflow': 'min-width: 920px' not in web_styles and '.daily-summary-wrap { width: 100%; max-width: 100%; overflow-x: clip; }' in web_styles and 'table-layout: fixed' in web_styles,
              'Web V2 mobile list has no horizontal overflow': 'leave-records-table' in leave_page and '.leave-list-wrap { width: 100%; overflow-x: clip; }' in web_styles and '.leave-records-table { width: 100%; min-width: 0; table-layout: fixed;' in web_styles,
              'Web V2 uses single-column content layout': 'grid-template-columns: minmax(0, 1fr); grid-template-areas: "registration" "statistics" "list";' in web_styles,
              'Web V2 deployed API uses live validation quota': '_api._daily_quota_config = _api_daily_quota_config' in shared_api,
              'Web V2 daily stats RPC is authenticated': 'vera_v2_leave_daily_stats' in daily_stats_sql and 'from public, anon' in daily_stats_sql.lower(),
              'Web V2 login uses split wellbeing message': 'Suối nguồn thư giãn' in login_page and 'Trọn vẹn an yên' in login_page,
              'Web V2 login contains contact and map': '193 Trương Định, Tam Hiệp, Đồng Nai' in login_page and 'maps.app.goo.gl/kkQjkTT7vm9oDWjbA' in login_page,
              'Web V2 legacy login copy removed': 'Trải nghiệm mới' not in login_page and 'Web V2 · React + Supabase' not in login_page,
              'Web V2 topbar uses VERA wellbeing message': 'Suối nguồn thư giãn, trọn vẹn an yên.' in shell,
              'Web V2 uses concise VERA SPA brand name': '<div className="topbar-kicker">VERA SPA</div>' in shell and '<title>VERA SPA</title>' in Path('web-v2/index.html').read_text(encoding='utf-8') and 'VERA SPA ĐỒNG NAI' not in shell,
              'Web V2 excludes system roles from coverage': "NOT IN ('admin','letan','locker','tapvu')" in api,
              'Web V2 RPC penalty follows feature permission': "employee_penalty_view" in hardening and 'case when can_view_penalty' in hardening,
              'Web V2 resets current non-admin penalty grants': "employee_penalty_view" in penalty_default and "'false'::jsonb" in penalty_default,
              'Web V2 RPCs revoke anonymous execution': 'from public, anon' in hardening.lower(),
              'Web V2 reason catalog follows selected date': 'date_value: date = Query(alias="date")' in api and '_day_allowed(item["allowed_days"], date_value)' in api,
              'Web V2 exposes permission-gated edit and delete': '@app.patch("/v2/leave/records/{record_uid}")' in api and '@app.delete("/v2/leave/records")' in api and '_validate_edit_permission' in api and '_validate_delete_permission' in api,
              'Web V2 list supports range queries': 'start_date: date | None = Query(default=None, alias="start")' in api and 'WHERE leave_date BETWEEN :start_date AND :end_date' in api and 'Khoảng danh sách tối đa là 366 ngày' in api,
              'Web V2 list has time and employee filters': 'aria-label="Lọc thời gian danh sách"' in leave_page and 'employeeSearch' in leave_page and 'aria-label="Tìm kiếm tên nhân viên"' in leave_page,
              'Web V2 list checkbox date and weekday stay first': '<th className="select-column">Chọn</th><th>Ngày</th><th>Thứ</th><th>Nhân viên</th>' in leave_page,
              'Web V2 range edit keeps selected-date reasons': 'canEdit && item.leave_date === date' in leave_page,
              'Web V2 registration uses requested result messages': 'Đã ghi lịch nghỉ THÀNH CÔNG' in leave_page and 'KHÔNG THÀNH CÔNG (' in leave_page and 'PostgreSQL và MainData mirror' not in api,
              'Web V2 watches only the six requested paid reasons': '_WATCHED_PAID_REASON_KEYS' in api and all(reason in api for reason in ('Nghỉ CÓ phép', 'Nghỉ CUỐI TUẦN CÓ phép', 'Đi trễ CÓ phép', 'Đi trễ CUỐI TUẦN CÓ phép', 'Về sớm CÓ phép', 'Về sớm CUỐI TUẦN CÓ phép')),
              'Web V2 watch endpoints are identity scoped': '@app.get("/v2/leave/watch-dates")' in api and '@app.post("/v2/leave/watch-dates/acknowledge")' in api and 'auth_user_id=CAST(:auth_user_id AS uuid)' in api,
              'Web V2 watch table is private with RLS': 'ENABLE ROW LEVEL SECURITY' in leave_watch_sql and 'FROM PUBLIC, anon, authenticated' in leave_watch_sql and 'PRIMARY KEY (auth_user_id, watched_date)' in leave_watch_sql,
              'Web V2 displays watched-day notifications': 'watch-notification-panel' in leave_page and 'Đang quan tâm ngày này' in leave_page and 'acknowledgeWatchDates' in Path('web-v2/src/lib/api.js').read_text(encoding='utf-8'),
              'Web V2 rings unread watch alerts until acknowledged': 'playWatchBellSound' in leave_page and 'window.setInterval(ringWatchBell, 5000)' in leave_page and 'watch-bell-shake' in web_styles,
              'Web V2 refreshes watch alerts when reopened': "window.addEventListener('focus', refreshWatchDates)" in leave_page and "document.addEventListener('visibilitychange', refreshWhenVisible)" in leave_page,
              'Web V2 statistics dates have no underline': '.daily-summary-table .date-link { text-decoration: none; }' in web_styles,
              'Web V2 topbar has global refresh': 'topbar-refresh-button' in shell and 'window.location.reload()' in shell and 'Thanks' not in shell,
              'Web V2 uses Cinzel Decorative VERA wordmark': 'Cinzel+Decorative' in web_styles and '<div className="brand-mark large">VERA</div>' in login_page and '<div className="brand-mark">VERA</div>' in shell,
              'Web V2 list actions have dedicated notices': 'listActionNotice' in leave_page and all(label in leave_page for label in ('LƯU SỬA THÀNH CÔNG', 'LƯU SỬA KHÔNG THÀNH CÔNG', 'XÓA ĐÃ CHỌN THÀNH CÔNG', 'XÓA ĐÃ CHỌN KHÔNG THÀNH CÔNG')) and leave_page.index('list-action-notice') > leave_page.index('leave-list-panel'),
              'Web V2 list summary includes weekday and leave wording': 'weekdayForDate(listRangeStart)' in leave_page and 'lịch nghỉ.' in leave_page,
              'Web V2 Excel export is admin-only end to end': '@app.get("/v2/leave/export.xlsx")' in api and 'if ident.role != "admin"' in api and "role === 'admin'" in leave_page and 'Export to Excel' in leave_page and 'exportLeaveExcel' in api_client,
              'Web V2 imports historical leave Excel safely': all(token in api for token in ('@app.post("/v2/leave/import.xlsx")', 'Chỉ tài khoản admin được Import dữ liệu lịch nghỉ cũ', 'LEAVE_IMPORT_MAX_BYTES', 'load_workbook(', 'record_uid IN :uids', 'worksheet.batch_clear([sheet_range])')) and all(token in leave_page for token in ("const canImport = role === 'admin'", 'Import Excel cũ', 'importLeaveExcel(file)', 'leave-file-input')) and "importLeaveExcel: (file) => upload('/v2/leave/import.xlsx', file)" in api_client,
              'Web V2 Push dependency is reproducible': 'pywebpush==2.4.0' in requirements,
              'Web V2 Push subscriptions are private with RLS': 'CREATE TABLE IF NOT EXISTS public.vera_v2_push_subscription' in push_sql and 'ENABLE ROW LEVEL SECURITY' in push_sql and 'FROM PUBLIC, anon, authenticated' in push_sql,
              'Web V2 database webhook uses pg_net and Vault': 'CREATE EXTENSION IF NOT EXISTS pg_net' in push_sql and 'vault.decrypted_secrets' in push_sql and 'net.http_post' in push_sql,
              'Web V2 push dispatch authenticates its webhook': '@app.post("/v2/push/dispatch")' in api and 'hmac.compare_digest' in api and 'vera_v2_push_webhook_secret' in api,
              'Web V2 Push registration is identity scoped': '@app.post("/v2/push/subscriptions")' in api and 'auth_user_id=CAST(:auth_user_id AS uuid)' in api and 'registerPushSubscription' in api_client,
              'Web V2 PWA supports standalone push': '"display": "standalone"' in manifest and 'pushManager.subscribe' in push_client and 'Notification.requestPermission()' in push_client,
              'Web V2 service worker displays and opens notifications': "self.addEventListener('push'" in service_worker and "self.addEventListener('notificationclick'" in service_worker and 'showNotification' in service_worker,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + name)
          if failed:
              raise SystemExit('Failed Web V2 leave invariants: ' + ', '.join(failed))
          print('PASS: 8 employees = 4 paid + 4 unpaid, with duplicate/late rows ignored.')
          PY

      - name: Verify Web V2 employee-management invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          api = Path('vera_web_v2_api.py').read_text(encoding='utf-8')
          permissions = Path('vera_web_v2_permissions.py').read_text(encoding='utf-8')
          staff_api = Path('vera_web_v2_staff.py').read_text(encoding='utf-8')
          app = Path('web-v2/src/App.jsx').read_text(encoding='utf-8')
          shell = Path('web-v2/src/components/AppShell.jsx').read_text(encoding='utf-8')
          page = Path('web-v2/src/pages/EmployeePage.jsx').read_text(encoding='utf-8')
