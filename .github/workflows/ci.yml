              'Bảng tua countdown colors and metrics are preserved': all(token in people for token in ('remaining >= 15', '0 <= remaining < 15', '-15 < remaining < 0', 'remaining <= -15', 'row_style = "break"', 'counters["finishing"] + counters["idle"]', 'doing_count', 'waiting_count', 'finishing_count', 'leave_count')) and all(token in tour_page for token in ('Số nhân viên', 'Có thể lên tua', 'Nghỉ giữa Ca', 'Nghỉ phép', 'Đang thực hiện', 'Đang chờ', 'Sắp xong', 'MÀU DÒNG', 'tour-row-', 'Làm mới Bảng tua')) and 'CHỈ SỐ' not in tour_page,
              'Bảng tua columns are ordered centered and compact': 'remaining_column = "TG CÒN LẠI"' in people and '(status_column, room_column, remaining_column, request_column)' in people and all(token in tour_page for token in ('tour-col-remaining center', 'tour-col-room center', 'tour-col-request center', 'tour-col-appointment')) and all(token in styles for token in ('.tour-col-remaining', '.tour-col-room, .tour-table .tour-col-request', 'max-width: 58px', 'max-width: 54px', 'max-width: 88px')),
              'Bảng tua compact metrics follow the requested two-column order': tour_page.index("{ key: 'available'") < tour_page.index("{ key: 'all'") < tour_page.index("{ key: 'finishing'") < tour_page.index("{ key: 'working'") < tour_page.index("{ key: 'waiting'") < tour_page.index("{ key: 'leave'") < tour_page.index("{ key: 'doing'") < tour_page.index("{ key: 'break'") and all(token in styles for token in ('.tour-metrics { grid-template-columns: repeat(2', 'min-height: 44px', 'padding: 6px 10px')),
