name: Deploy Live Tour Queue Hardening

on:
  push:
    branches:
      - ops/queue-runtime-check-20260916
    paths:
      - '.github/workflows/deploy-live-tour-queue-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vera-spa-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_SHA: 6f77bbcccca62f2d76bd82550f9364910612fc35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6f77bbcccca62f2d76bd82550f9364910612fc35

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact hardening SHA
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          start_epoch="$(ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'date +%s')"
          printf '%s\n' "$start_epoch" > /tmp/deploy_start_epoch
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "/opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify hardened queue runtime
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          start_epoch="$(cat /tmp/deploy_start_epoch)"
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "DEPLOY_SHA='${DEPLOY_SHA}' START_EPOCH='${start_epoch}' bash -s" <<'REMOTE'
          set -euo pipefail
          for attempt in $(seq 1 20); do
            pid="$(pgrep -n -f '[v]era_web_v2_api_v38:app' || true)"
            if [ -n "$pid" ]; then
              release_dir="$(readlink -f "/proc/${pid}/cwd")"
              running_sha="$(git -C "$release_dir" rev-parse HEAD 2>/dev/null || true)"
              if [ "$running_sha" = "$DEPLOY_SHA" ]; then
                health="$(curl -fsS http://127.0.0.1:8000/v2/live-tour/projection-queue/health || true)"
                if [[ "$health" == *'"release":"live-tour-projection-queue-2026-09-16.2-hardening"'* ]]; then
                  echo "RUNTIME_SHA=$running_sha"
                  echo "QUEUE_HEALTH=$health"
                  [[ "$health" == *'"queue_release":"postgres-job-queue-2026-09-16.2-health"'* ]]
                  [[ "$health" == *'"last_success_age":'* ]]
                  [[ "$health" == *'"oldest_pending":'* ]]
                  [[ "$health" == *'"retry":'* ]]
                  [[ "$health" == *'"failed":'* ]]
                  [[ "$health" == *'"stale_processing":'* ]]
                  break
                fi
              fi
            fi
            if [ "$attempt" -eq 20 ]; then
              echo 'Hardened queue runtime did not become ready' >&2
              exit 1
            fi
            sleep 3
          done

          new_schema_errors="$(journalctl --since "@${START_EPOCH}" --no-pager 2>/dev/null \
            | grep -E 'UndefinedTable.*background_job|relation "vera_background_job" does not exist' || true)"
          if [ -n "$new_schema_errors" ]; then
            echo 'QUEUE_SCHEMA_RACE=detected'
            echo "$new_schema_errors"
            exit 1
          fi
          echo 'QUEUE_SCHEMA_RACE=none'
          REMOTE
