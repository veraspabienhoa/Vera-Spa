name: Diagnose TimeSoft Attendance VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-timesoft-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Decode TimeSoft login JavaScript
        run: |
          python - <<'PY'
          import requests
          js = requests.get('https://vera.timesoft.vn/Scripts/User/gym-login-ofs.js?v1=171', timeout=30).text
          stub = r'''
          const chain = new Proxy(function(){ return chain; }, {
            get(target, prop) {
              if (prop === 'length') return 0;
              if (prop === 'ready' || prop === 'click' || prop === 'keyup' || prop === 'keydown' || prop === 'change' || prop === 'on') return function(){ return chain; };
              if (prop === 'val') return function(){ return ''; };
              if (prop === 'is') return function(){ return false; };
              if (prop === 'attr' || prop === 'prop' || prop === 'css' || prop === 'show' || prop === 'hide' || prop === 'focus' || prop === 'each') return function(){ return chain; };
              return chain;
            },
            apply(){ return chain; }
          });
          global.$ = chain; global.jQuery = chain; global.document = {};
          global.window = { location: { href:'', search:'' }, localStorage:{setItem(){},removeItem(){},getItem(){return null;}}, setTimeout(){}, top:null, self:null };
          global.top = global.window; global.self = global.window; global.metroDialog = chain;
          global.$CustomAjax = function(){ return { done(){ return this; }, then(){ return this; } }; };
          global.getQuerystring = function(){ return ''; }; global.encrypt = function(v){ return v; }; global.sendOne = '';
          '''
          with open('/tmp/timesoft_decode.js', 'w', encoding='utf-8') as fh:
              fh.write(stub + '\n' + js)
              fh.write("\nconsole.log('---DECODE---');\nfor (let i=0x160;i<=0x280;i++){try{console.log(i.toString(16)+'='+_0x225b(i));}catch(e){}}\n")
          PY
          node /tmp/timesoft_decode.js 2>/tmp/timesoft_decode.err | sed -n '/---DECODE---/,$p' | grep -E '^(188|189|19a|1ad|1b9|1c2|1dc|193|20a|20c|218|261|246|21c|22e|1a3|1a5|258|263|252|1ed|1f9|22b|23d|266|217|268|1be|1b7|180|1e6|1f1|24b)=' || true
          if [ -s /tmp/timesoft_decode.err ]; then tail -n 20 /tmp/timesoft_decode.err; fi

      - name: Build diagnostic script
        run: |
          cat > /tmp/vera_timesoft_diag.py <<'PY'
          import os, re, sys
          from urllib.parse import urljoin
          import requests
          pid, release_dir = sys.argv[1], sys.argv[2]
          raw = open(f"/proc/{pid}/environ", "rb").read().split(b"\0")
          for item in raw:
              if b"=" not in item: continue
              key, value = item.split(b"=", 1)
              os.environ[key.decode("utf-8", "ignore")] = value.decode("utf-8", "ignore")
          os.chdir(release_dir); sys.path.insert(0, release_dir)
          import timesoft_sync_job as ts
          import vera_postgres as vpg
          login = requests.Session()
          report = login.get(urljoin(ts.BASE_URL + "/", ts.REPORT_CHECKIN_PAGE.lstrip("/")), timeout=20, allow_redirects=True)
          print("report_redirect=", report.status_code, report.url)
          html = report.text
          print("login_inputs=")
          for tag in re.findall(r'<input\b[^>]*>', html, flags=re.I)[:40]: print(re.sub(r'\s+', ' ', tag)[:600])
          try:
              with vpg.get_engine().connect() as conn:
                  from sqlalchemy import text as sql_text
                  rows = conn.execute(sql_text("""
                      SELECT dataset_key, source_version, updated_at,
                             CASE WHEN jsonb_typeof(payload)='array' THEN jsonb_array_length(payload) ELSE NULL END AS row_count
                      FROM vera_dataset_cache
                      WHERE dataset_key='timesoft_employee_checkin_today' OR dataset_key LIKE 'timesoft_employee_checkin_2026090%'
                      ORDER BY updated_at DESC LIMIT 20
                  """)).mappings().all()
                  print("attendance_cache_rows=")
                  for row in rows: print(dict(row))
          except Exception as exc: print("cache_probe_error=", type(exc).__name__, str(exc)[:500])
          PY

      - name: Diagnose TimeSoft login protocol and cache
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 /tmp/vera_timesoft_diag.py "${VPS_USER}@${VPS_HOST}:/tmp/vera_timesoft_diag.py"
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); /opt/vera-spa/.venv/bin/python /tmp/vera_timesoft_diag.py "$pid" "$release_dir"; rm -f /tmp/vera_timesoft_diag.py'