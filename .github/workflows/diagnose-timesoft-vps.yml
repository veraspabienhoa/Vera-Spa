name: Diagnose TimeSoft Attendance VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-timesoft-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build credential-source diagnostic
        run: |
          cat > /tmp/vera_timesoft_diag.py <<'PY'
          import hashlib, os, pathlib, re, sys

          pid, release_dir = sys.argv[1], sys.argv[2]
          env = {}
          for item in open(f"/proc/{pid}/environ", "rb").read().split(b"\0"):
              if b"=" not in item:
                  continue
              key, value = item.split(b"=", 1)
              env[key.decode("utf-8", "ignore")] = value.decode("utf-8", "ignore")

          def sig(value):
              value = str(value or "")
              return hashlib.sha256(value.encode()).hexdigest()[:12] if value else "empty"

          current_u = env.get("TIMESOFT_USERNAME", "")
          current_p = env.get("TIMESOFT_PASSWORD", "")
          print("release_dir=", release_dir)
          print("current_username_meta=", {"length": len(current_u), "sha12": sig(current_u), "trimmed_same": current_u == current_u.strip(), "quoted": current_u[:1] in "\"'" or current_u[-1:] in "\"'"})
          print("current_password_meta=", {"length": len(current_p), "sha12": sig(current_p), "trimmed_same": current_p == current_p.strip(), "quoted": current_p[:1] in "\"'" or current_p[-1:] in "\"'"})

          roots = [pathlib.Path('/opt/vera-spa'), pathlib.Path.home()]
          seen = set()
          candidates = []
          key_pattern = re.compile(r'^\s*(?:export\s+)?(TIMESOFT_USERNAME|TIMESOFT_PASSWORD)\s*=\s*(.*)\s*$')
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  try:
                      if not path.is_file() or path.stat().st_size > 2_000_000:
                          continue
                      if any(part in {'.git', 'node_modules', '.venv', 'releases'} for part in path.parts):
                          continue
                      text = path.read_text(encoding='utf-8', errors='ignore')
                  except Exception:
                      continue
                  if 'TIMESOFT_USERNAME' not in text and 'TIMESOFT_PASSWORD' not in text:
                      continue
                  values = {}
                  for line in text.splitlines():
                      match = key_pattern.match(line)
                      if not match:
                          continue
                      value = match.group(2).strip()
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                          value = value[1:-1]
                      values[match.group(1)] = value
                  if values:
                      key = (values.get('TIMESOFT_USERNAME',''), values.get('TIMESOFT_PASSWORD',''))
                      if key in seen:
                          continue
                      seen.add(key)
                      candidates.append((str(path), values))
          print("credential_source_count=", len(candidates))
          for path, values in candidates[:20]:
              u = values.get('TIMESOFT_USERNAME','')
              p = values.get('TIMESOFT_PASSWORD','')
              print("credential_source=", path, {
                  "username_length": len(u), "username_sha12": sig(u), "username_matches_current": bool(u) and u == current_u,
                  "password_length": len(p), "password_sha12": sig(p), "password_matches_current": bool(p) and p == current_p,
              })
          PY

      - name: Inspect credential sources without exposing secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 /tmp/vera_timesoft_diag.py "${VPS_USER}@${VPS_HOST}:/tmp/vera_timesoft_diag.py"
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); echo "service_unit=$(sed -n "s#.*system.slice/\([^/]*\.service\).*#\1#p" "/proc/${pid}/cgroup" | head -n 1)"; /opt/vera-spa/.venv/bin/python /tmp/vera_timesoft_diag.py "$pid" "$release_dir"; rm -f /tmp/vera_timesoft_diag.py'