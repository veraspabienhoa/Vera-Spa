name: Diagnose TimeSoft Attendance VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-timesoft-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test GitHub TimeSoft secrets without exposing values
        env:
          GH_TIMESOFT_USERNAME: ${{ secrets.TIMESOFT_USERNAME }}
          GH_TIMESOFT_PASSWORD: ${{ secrets.TIMESOFT_PASSWORD }}
          GH_VERA_TIMESOFT_USERNAME: ${{ secrets.VERA_TIMESOFT_USERNAME }}
          GH_VERA_TIMESOFT_PASSWORD: ${{ secrets.VERA_TIMESOFT_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib, os
          from urllib.parse import urljoin
          import requests

          def sig(value):
              value = str(value or '')
              return hashlib.sha256(value.encode()).hexdigest()[:12] if value else 'empty'

          pairs = [
              ('TIMESOFT_*', os.getenv('GH_TIMESOFT_USERNAME',''), os.getenv('GH_TIMESOFT_PASSWORD','')),
              ('VERA_TIMESOFT_*', os.getenv('GH_VERA_TIMESOFT_USERNAME',''), os.getenv('GH_VERA_TIMESOFT_PASSWORD','')),
          ]
          for label, username, password in pairs:
              print(label, {'username_available': bool(username), 'username_length': len(username), 'username_sha12': sig(username), 'password_available': bool(password), 'password_length': len(password), 'password_sha12': sig(password)})
              if not username or not password:
                  continue
              session = requests.Session()
              session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/140 Safari/537.36','Accept-Language':'vi-VN,vi;q=0.9'})
              base='https://vera.timesoft.vn'
              report=urljoin(base+'/', 'Report/ReportEmployeeCheckin/Index')
              page=session.get(report,timeout=20,allow_redirects=True)
              response=session.post(urljoin(base+'/', 'User/ValidateUser'), data={'userName':username,'password':password,'sendOne':''}, headers={'Accept':'application/json, text/javascript, */*; q=0.01','X-Requested-With':'XMLHttpRequest','Referer':str(page.url),'Origin':base}, timeout=20, allow_redirects=False)
              payload=response.json() if 'json' in str(response.headers.get('content-type','')).lower() else {}
              print(label+'_login_test', {key: payload.get(key) for key in ('valid','ErrorCode','Message','linkRedirect') if key in payload})
          PY

      - name: Probe legacy Cloud Run attendance health
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://vera-spa-api-589916994342.asia-southeast1.run.app/v2/attendance/break-alerts/health'
          try:
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0 Chrome/140'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  payload=json.load(response)
              live=payload.get('live_timesoft') or {}
              safe={key:live.get(key) for key in ('release','credentials_ready','last_success_age_seconds','last_error','source','rows','total','summary_rows','raw_log_rows','combined_rows','detailed_log_ready') if key in live}
              print('legacy_cloud_run_http=',200)
              print('legacy_cloud_run_live_timesoft=',safe)
          except Exception as exc:
              print('legacy_cloud_run_error=',type(exc).__name__,str(exc)[:500])
          PY

      - name: Build Secret Manager comparison diagnostic
        run: |
          cat > /tmp/vera_timesoft_diag.py <<'PY'
          import hashlib, os, shutil, subprocess, sys
          from urllib.parse import urljoin
          import requests

          pid, release_dir = sys.argv[1], sys.argv[2]
          env = {}
          for item in open(f"/proc/{pid}/environ", "rb").read().split(b"\0"):
              if b"=" not in item:
                  continue
              key, value = item.split(b"=", 1)
              env[key.decode("utf-8", "ignore")] = value.decode("utf-8", "ignore")
          os.chdir(release_dir)
          sys.path.insert(0, release_dir)
          import timesoft_sync_job as ts

          def sig(value):
              value = str(value or "")
              return hashlib.sha256(value.encode()).hexdigest()[:12] if value else "empty"

          current_u = env.get("TIMESOFT_USERNAME", "")
          current_p = env.get("TIMESOFT_PASSWORD", "")
          print("current_username=", {"length": len(current_u), "sha12": sig(current_u)})
          print("current_password=", {"length": len(current_p), "sha12": sig(current_p)})
          print("gcloud_available=", bool(shutil.which('gcloud')))
          if not shutil.which('gcloud'):
              raise SystemExit(0)

          try:
              project = subprocess.check_output(
                  ['gcloud', 'config', 'get-value', 'project'], stderr=subprocess.DEVNULL, text=True, timeout=15
              ).strip()
          except Exception:
              project = ''
          print("gcloud_project_configured=", bool(project and project != '(unset)'))
          if not project or project == '(unset)':
              raise SystemExit(0)

          def secret(name):
              try:
                  return subprocess.check_output(
                      ['gcloud', 'secrets', 'versions', 'access', 'latest', '--secret', name, '--project', project],
                      stderr=subprocess.DEVNULL, text=True, timeout=20,
                  ).rstrip('\r\n')
              except Exception:
                  return ''

          secret_u = secret('vera-timesoft-username')
          secret_p = secret('vera-timesoft-password')
          print("secret_manager_username=", {"available": bool(secret_u), "length": len(secret_u), "sha12": sig(secret_u), "matches_current": bool(secret_u) and secret_u == current_u})
          print("secret_manager_password=", {"available": bool(secret_p), "length": len(secret_p), "sha12": sig(secret_p), "matches_current": bool(secret_p) and secret_p == current_p})
          if not secret_u or not secret_p or (secret_u == current_u and secret_p == current_p):
              raise SystemExit(0)

          session = requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 Chrome/140 Safari/537.36","Accept-Language":"vi-VN,vi;q=0.9"})
          report_url = urljoin(ts.BASE_URL + '/', ts.REPORT_CHECKIN_PAGE.lstrip('/'))
          login_page = session.get(report_url, timeout=20, allow_redirects=True)
          response = session.post(
              urljoin(ts.BASE_URL + '/', 'User/ValidateUser'),
              data={"userName": secret_u, "password": secret_p, "sendOne": ""},
              headers={"Accept":"application/json, text/javascript, */*; q=0.01","X-Requested-With":"XMLHttpRequest","Referer":str(login_page.url),"Origin":ts.BASE_URL},
              timeout=20, allow_redirects=False,
          )
          payload = response.json() if 'json' in str(response.headers.get('content-type','')).lower() else {}
          print("secret_manager_login_test=", {key: payload.get(key) for key in ('valid','ErrorCode','Message','linkRedirect') if key in payload})
          PY

      - name: Compare production credentials without exposing secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 /tmp/vera_timesoft_diag.py "${VPS_USER}@${VPS_HOST}:/tmp/vera_timesoft_diag.py"
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); /opt/vera-spa/.venv/bin/python /tmp/vera_timesoft_diag.py "$pid" "$release_dir"; rm -f /tmp/vera_timesoft_diag.py'