name: Diagnose TimeSoft Attendance VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-timesoft-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build diagnostic script
        run: |
          cat > /tmp/vera_timesoft_diag.py <<'PY'
          import os, re, sys
          from urllib.parse import urljoin
          import requests

          pid, release_dir = sys.argv[1], sys.argv[2]
          raw = open(f"/proc/{pid}/environ", "rb").read().split(b"\0")
          for item in raw:
              if b"=" not in item:
                  continue
              key, value = item.split(b"=", 1)
              os.environ[key.decode("utf-8", "ignore")] = value.decode("utf-8", "ignore")
          os.chdir(release_dir)
          sys.path.insert(0, release_dir)

          import timesoft_sync_job as ts
          import vera_postgres as vpg

          login = requests.Session()
          report = login.get(urljoin(ts.BASE_URL + "/", ts.REPORT_CHECKIN_PAGE.lstrip("/")), timeout=20, allow_redirects=True)
          print("report_redirect=", report.status_code, report.url)
          html = report.text
          inputs = re.findall(r'<input\b[^>]*>', html, flags=re.I)
          print("login_inputs=")
          for tag in inputs[:40]:
              # login page contains no credentials yet, safe to print input metadata.
              print(re.sub(r'\s+', ' ', tag)[:600])

          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)
          print("login_scripts=", scripts)
          for src in scripts:
              js_url = urljoin(report.url, src)
              try:
                  response = login.get(js_url, timeout=20)
                  js = response.text
              except Exception as exc:
                  print("script_error=", js_url, type(exc).__name__, str(exc)[:180])
                  continue
              print("script=", js_url, "status=", response.status_code, "len=", len(js))
              lowered = js.lower()
              if any(token in lowered for token in ("validateuser", "ajax", "password", "username", "redirecturl", "encrypt")):
                  # JS is public application code and contains no configured credentials.
                  compact = re.sub(r'\s+', ' ', js)
                  print("interesting_script_content=", compact[:16000])

          try:
              with vpg.get_engine().connect() as conn:
                  from sqlalchemy import text as sql_text
                  rows = conn.execute(sql_text("""
                      SELECT dataset_key, source_version, updated_at,
                             CASE WHEN jsonb_typeof(payload)='array' THEN jsonb_array_length(payload) ELSE NULL END AS row_count
                      FROM vera_dataset_cache
                      WHERE dataset_key='timesoft_employee_checkin_today'
                         OR dataset_key LIKE 'timesoft_employee_checkin_2026090%'
                      ORDER BY updated_at DESC LIMIT 20
                  """)).mappings().all()
                  print("attendance_cache_rows=")
                  for row in rows:
                      print(dict(row))
          except Exception as exc:
              print("cache_probe_error=", type(exc).__name__, str(exc)[:500])
          PY

      - name: Diagnose TimeSoft login protocol and cache
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 /tmp/vera_timesoft_diag.py "${VPS_USER}@${VPS_HOST}:/tmp/vera_timesoft_diag.py"
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); /opt/vera-spa/.venv/bin/python /tmp/vera_timesoft_diag.py "$pid" "$release_dir"; rm -f /tmp/vera_timesoft_diag.py'