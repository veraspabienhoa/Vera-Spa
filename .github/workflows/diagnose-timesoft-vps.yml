name: Diagnose TimeSoft Attendance VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-timesoft-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test GitHub TimeSoft secrets without exposing values
        env:
          GH_TIMESOFT_USERNAME: ${{ secrets.TIMESOFT_USERNAME }}
          GH_TIMESOFT_PASSWORD: ${{ secrets.TIMESOFT_PASSWORD }}
          GH_VERA_TIMESOFT_USERNAME: ${{ secrets.VERA_TIMESOFT_USERNAME }}
          GH_VERA_TIMESOFT_PASSWORD: ${{ secrets.VERA_TIMESOFT_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib, os
          from urllib.parse import urljoin
          import requests
          def sig(value):
              value=str(value or '')
              return hashlib.sha256(value.encode()).hexdigest()[:12] if value else 'empty'
          for label, username, password in [
              ('TIMESOFT_*',os.getenv('GH_TIMESOFT_USERNAME',''),os.getenv('GH_TIMESOFT_PASSWORD','')),
              ('VERA_TIMESOFT_*',os.getenv('GH_VERA_TIMESOFT_USERNAME',''),os.getenv('GH_VERA_TIMESOFT_PASSWORD','')),
          ]:
              print(label,{'username_available':bool(username),'username_length':len(username),'username_sha12':sig(username),'password_available':bool(password),'password_length':len(password),'password_sha12':sig(password)})
              if not username or not password: continue
              s=requests.Session(); base='https://vera.timesoft.vn'
              page=s.get(urljoin(base+'/', 'Report/ReportEmployeeCheckin/Index'),timeout=20,allow_redirects=True)
              r=s.post(urljoin(base+'/', 'User/ValidateUser'),data={'userName':username,'password':password,'sendOne':''},headers={'Accept':'application/json, text/javascript, */*; q=0.01','X-Requested-With':'XMLHttpRequest','Referer':str(page.url),'Origin':base},timeout=20,allow_redirects=False)
              payload=r.json() if 'json' in str(r.headers.get('content-type','')).lower() else {}
              print(label+'_login_test',{key:payload.get(key) for key in ('valid','ErrorCode','Message','linkRedirect') if key in payload})
          PY

      - name: Probe legacy Cloud Run attendance health
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://vera-spa-api-589916994342.asia-southeast1.run.app/v2/attendance/break-alerts/health'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0'}),timeout=20) as response:
                  payload=json.load(response)
              live=payload.get('live_timesoft') or {}
              print('legacy_cloud_run_live_timesoft=',{key:live.get(key) for key in ('release','credentials_ready','last_success_age_seconds','last_error','rows','total','summary_rows','raw_log_rows','combined_rows','detailed_log_ready') if key in live})
          except Exception as exc:
              print('legacy_cloud_run_error=',type(exc).__name__,str(exc)[:500])
          PY

      - name: Build VPS credential and cookie diagnostic
        run: |
          cat > /tmp/vera_timesoft_diag.py <<'PY'
          import hashlib, os, shutil, subprocess, sys
          from urllib.parse import urljoin
          import requests
          pid, release_dir=sys.argv[1],sys.argv[2]
          env={}
          for item in open(f'/proc/{pid}/environ','rb').read().split(b'\0'):
              if b'=' in item:
                  key,value=item.split(b'=',1); env[key.decode('utf-8','ignore')]=value.decode('utf-8','ignore')
          os.chdir(release_dir); sys.path.insert(0,release_dir)
          import timesoft_sync_job as ts
          import vera_postgres as vpg
          def sig(value):
              value=str(value or '')
              return hashlib.sha256(value.encode()).hexdigest()[:12] if value else 'empty'
          current_u=env.get('TIMESOFT_USERNAME',''); current_p=env.get('TIMESOFT_PASSWORD','')
          print('current_username=',{'length':len(current_u),'sha12':sig(current_u)})
          print('current_password=',{'length':len(current_p),'sha12':sig(current_p)})

          # Probe legacy Supabase/Vault-style TimeSoft session values if this VPS DB retained them.
          aspnet=''; session_id=''
          try:
              from sqlalchemy import text
              with vpg.get_engine().connect() as conn:
                  rows=conn.execute(text("""
                      SELECT name,decrypted_secret FROM vault.decrypted_secrets
                      WHERE name IN ('timesoft_aspnet_auth','timesoft_session_id')
                  """)).all()
              values={str(name):str(value or '') for name,value in rows}
              aspnet=values.get('timesoft_aspnet_auth',''); session_id=values.get('timesoft_session_id','')
              print('vault_timesoft_cookie=',{'aspxauth_available':bool(aspnet),'aspxauth_length':len(aspnet),'aspxauth_sha12':sig(aspnet),'session_available':bool(session_id),'session_length':len(session_id),'session_sha12':sig(session_id)})
          except Exception as exc:
              print('vault_timesoft_cookie_error=',type(exc).__name__,str(exc)[:300])
          if aspnet or session_id:
              s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/140 Safari/537.36','Accept-Language':'vi-VN,vi;q=0.9'})
              if aspnet: s.cookies.set('.ASPXAUTH',aspnet,domain='vera.timesoft.vn',path='/')
              if session_id: s.cookies.set('ASP.NET_SessionId',session_id,domain='vera.timesoft.vn',path='/')
              report=urljoin(ts.BASE_URL+'/',ts.REPORT_CHECKIN_PAGE.lstrip('/'))
              r=s.get(report,timeout=20,allow_redirects=False)
              location=str(r.headers.get('location') or '')
              usable=not (r.status_code in {301,302,303,307,308} and '/user/login' in location.lower())
              print('vault_cookie_report_test=',{'status':r.status_code,'redirects_to_login':('/user/login' in location.lower()),'usable':usable})
              if usable:
                  try:
                      from datetime import datetime
                      df,meta=ts.fetch_checkin(s,datetime.now(ts.VN_TZ).date())
                      print('vault_cookie_fetch_today=',{'rows':len(df),'total':int(meta.get('Total') or 0)})
                  except Exception as exc:
                      print('vault_cookie_fetch_error=',type(exc).__name__,str(exc)[:500])

          print('gcloud_available=',bool(shutil.which('gcloud')))
          if not shutil.which('gcloud'): raise SystemExit(0)
          try:
              project=subprocess.check_output(['gcloud','config','get-value','project'],stderr=subprocess.DEVNULL,text=True,timeout=15).strip()
          except Exception: project=''
          print('gcloud_project_configured=',bool(project and project!='(unset)'))
          if not project or project=='(unset)': raise SystemExit(0)
          def secret(name):
              try: return subprocess.check_output(['gcloud','secrets','versions','access','latest','--secret',name,'--project',project],stderr=subprocess.DEVNULL,text=True,timeout=20).rstrip('\r\n')
              except Exception: return ''
          secret_u=secret('vera-timesoft-username'); secret_p=secret('vera-timesoft-password')
          print('secret_manager_username=',{'available':bool(secret_u),'length':len(secret_u),'sha12':sig(secret_u),'matches_current':bool(secret_u) and secret_u==current_u})
          print('secret_manager_password=',{'available':bool(secret_p),'length':len(secret_p),'sha12':sig(secret_p),'matches_current':bool(secret_p) and secret_p==current_p})
          PY

      - name: Compare production credential sources without exposing secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 /tmp/vera_timesoft_diag.py "${VPS_USER}@${VPS_HOST}:/tmp/vera_timesoft_diag.py"
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); /opt/vera-spa/.venv/bin/python /tmp/vera_timesoft_diag.py "$pid" "$release_dir"; rm -f /tmp/vera_timesoft_diag.py'