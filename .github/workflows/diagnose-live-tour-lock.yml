name: Diagnose Live Tour lock

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-live-tour-lock.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read bounded production health and diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); git -C "$release_dir" rev-parse HEAD; curl -fsS --max-time 8 http://127.0.0.1:8000/v2/live-tour/projection-queue/health | /opt/vera-spa/.venv/bin/python -c "import json,sys; p=json.load(sys.stdin); print(json.dumps({**{k:p.get(k) for k in (\"ok\",\"release\",\"counts\",\"oldest_pending\",\"last_success_age\")},\"alert_active\":p.get(\"alerting\",{}).get(\"active\"),\"conditions\":p.get(\"alerting\",{}).get(\"conditions\")},sort_keys=True))"; /opt/vera-spa/.venv/bin/python "$release_dir/vera_vps_runtime_diagnostics.py"'
      - name: Identify fence holders and blocked sessions
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); cd "$(readlink -f "/proc/${pid}/cwd")"; /opt/vera-spa/.venv/bin/python -' <<'PY'
          import json, os
          from sqlalchemy import create_engine, text
          from sqlalchemy.pool import NullPool
          from vera_vps_data_check import _database_url, _running_api_environment
          from vera_web_v2_runtime_env import RUNTIME_ENV_KEYS, load_managed_runtime_environment
          env = ({key: os.environ.get(key, '') for key in RUNTIME_ENV_KEYS}
                 if load_managed_runtime_environment() else _running_api_environment())
          sslmode = env.get('DB_SSLMODE', 'require')
          if sslmode not in {'require', 'verify-ca', 'verify-full'}:
              sslmode = 'require'
          engine = create_engine(_database_url(env), poolclass=NullPool, connect_args={
              'connect_timeout': 5, 'sslmode': sslmode,
              'options': '-c default_transaction_read_only=on -c statement_timeout=3000'})
          try:
              with engine.connect() as conn:
                  rows = conn.execute(text('''SELECT a.pid, a.state, a.wait_event_type,
                      COALESCE(EXTRACT(EPOCH FROM clock_timestamp()-a.xact_start)::int,0) AS age_seconds,
                      pg_blocking_pids(a.pid) AS blocked_by,
                      EXISTS (SELECT 1 FROM pg_locks l WHERE l.pid=a.pid AND l.locktype='advisory'
                        AND l.granted) AS holds_advisory
                    FROM pg_stat_activity a WHERE a.datname=current_database()
                      AND a.usename=current_user() AND a.pid<>pg_backend_pid()
                      AND a.state IS DISTINCT FROM 'idle'
                    ORDER BY a.xact_start NULLS LAST LIMIT 40'''),
                    ).mappings().all()
              for row in rows:
                  if row['holds_advisory'] or row['blocked_by'] or row['age_seconds'] > 120:
                      print('FENCE_DETAIL: ' + json.dumps(dict(row), sort_keys=True))
          except Exception as exc:
              print('FENCE_DETAIL: failed type=' + type(exc).__name__ +
                    ' sqlstate=' + str(getattr(getattr(exc, 'orig', None), 'sqlstate', 'unknown')))
              raise SystemExit(1)
          finally:
              engine.dispose()
          PY
