name: Diagnose Live Tour lock

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-live-tour-lock.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read bounded production health and diagnostics
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 \
            "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); release_dir=$(readlink -f "/proc/${pid}/cwd"); git -C "$release_dir" rev-parse HEAD; curl -fsS --max-time 8 http://127.0.0.1:8000/v2/live-tour/projection-queue/health | /opt/vera-spa/.venv/bin/python -c "import json,sys; p=json.load(sys.stdin); print(json.dumps({**{k:p.get(k) for k in (\"ok\",\"release\",\"counts\",\"oldest_pending\",\"last_success_age\")},\"alert_active\":p.get(\"alerting\",{}).get(\"active\"),\"conditions\":p.get(\"alerting\",{}).get(\"conditions\")},sort_keys=True))"; /opt/vera-spa/.venv/bin/python "$release_dir/vera_vps_runtime_diagnostics.py"'

      - name: Identify contended relations without query text
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'cd /opt/vera-spa/current && /opt/vera-spa/.venv/bin/python -' <<'PY'
          import os, json
          from sqlalchemy import create_engine, text
          from sqlalchemy.pool import NullPool
          from vera_vps_data_check import _database_url, _running_api_environment
          from vera_web_v2_runtime_env import RUNTIME_ENV_KEYS, load_managed_runtime_environment
          env = {k: os.environ.get(k, '') for k in RUNTIME_ENV_KEYS} if load_managed_runtime_environment() else _running_api_environment()
          engine = create_engine(_database_url(env), poolclass=NullPool, connect_args={'connect_timeout':5, 'sslmode':env.get('DB_SSLMODE','require'), 'options':'-c default_transaction_read_only=on -c statement_timeout=3000 -c lock_timeout=1000'})
          try:
              with engine.connect() as conn:
                  rows = conn.execute(text("""
                      SELECT a.pid, a.state, l.mode, l.granted, c.relname,
                             pg_blocking_pids(a.pid) AS blockers,
                             EXTRACT(EPOCH FROM clock_timestamp()-a.xact_start)::int AS age
                      FROM pg_locks l JOIN pg_stat_activity a ON a.pid=l.pid
                      JOIN pg_class c ON c.oid=l.relation
                      WHERE a.datname=current_database() AND a.usename=current_user
                        AND a.pid<>pg_backend_pid() AND l.locktype='relation'
                        AND (c.relname LIKE 'vera_%' OR c.relname='employees')
                        AND l.relation IN (SELECT relation FROM pg_locks WHERE NOT granted AND locktype='relation')
                      ORDER BY c.relname, l.granted, a.pid LIMIT 100
                  """)).mappings().all()
              for row in rows:
                  print('RELATION_LOCK: '+json.dumps(dict(row), default=str, sort_keys=True))
              print('RELATION_CHECK_OK')
          except Exception as exc:
              print('RELATION_CHECK_ERROR='+type(exc).__name__)
          finally:
              engine.dispose()
          PY

      - name: Read approved bounded export error summaries
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'cd /opt/vera-spa/current && /opt/vera-spa/.venv/bin/python -' <<'PY'
          import json, re, subprocess
          from pathlib import Path
          from collections import Counter
          from vera_vps_runtime_diagnostics import safe_log_summary
          pid = subprocess.run(['pgrep','-n','-f','[v]era_web_v2_api_v38:app'],capture_output=True,text=True,timeout=5).stdout.strip()
          unit = re.search(r'/system\.slice/([A-Za-z0-9_.@-]+\.service)',Path('/proc/'+pid+'/cgroup').read_text())[1]
          result = subprocess.run(['journalctl','-q','-u',unit,'--since','60 minutes ago','--no-pager','--reverse','-o','json','-n','12000'],capture_output=True,text=True,timeout=15)
          counts = Counter()
          last = {}
          for line in result.stdout.splitlines():
              try:
                  entry=json.loads(line)
              except ValueError:
                  continue
              message=str(entry.get('MESSAGE',''))
              summaries=safe_log_summary(message)
              status=re.search(r'"GET /v2/staff/export\.xlsx(?:\?[^"]*)? HTTP/[0-9.]+" ([0-9]{3})',message)
              if status:
                  summaries.append('STAFF_EXPORT_HTTP='+status[1])
              for summary in summaries:
                  counts[summary]+=1
                  last[summary]=max(last.get(summary,''),str(entry.get('__REALTIME_TIMESTAMP','')))
          for summary,count in counts.items():
              print('EXPORT_DIAGNOSTIC: count='+str(count)+' last_us='+last[summary]+' '+summary)
          PY

      - name: Read bounded request outcomes and lock metadata
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'cd /opt/vera-spa/current && /opt/vera-spa/.venv/bin/python -' <<'PY'
          import os, json, re, subprocess
          from pathlib import Path
          from collections import Counter
          from sqlalchemy import create_engine,text
          from sqlalchemy.pool import NullPool
          from vera_vps_data_check import _database_url,_running_api_environment
          from vera_web_v2_runtime_env import RUNTIME_ENV_KEYS,load_managed_runtime_environment
          env={k:os.environ.get(k,'') for k in RUNTIME_ENV_KEYS} if load_managed_runtime_environment() else _running_api_environment()
          engine=create_engine(_database_url(env),poolclass=NullPool,connect_args={'connect_timeout':5,'sslmode':env.get('DB_SSLMODE','require'),'options':'-c default_transaction_read_only=on -c statement_timeout=3000 -c lock_timeout=1000'})
          try:
              with engine.connect() as conn:
                  for row in conn.execute(text("""SELECT a.pid,a.state,l.mode,l.granted,extract(epoch from clock_timestamp()-a.xact_start)::int AS transaction_seconds
                    FROM pg_locks l JOIN pg_stat_activity a ON a.pid=l.pid
                    WHERE a.datname=current_database() AND a.usename=current_user AND l.locktype='advisory' LIMIT 30""")).mappings():
                      print('ADVISORY_METADATA '+json.dumps(dict(row),default=str))
                  for row in conn.execute(text("""SELECT relname,n_live_tup,pg_total_relation_size(relid) AS bytes
                    FROM pg_stat_user_tables WHERE relname LIKE 'vera_live_tour%' OR relname IN ('vera_app_setting','vera_employee_identity_document')
                    ORDER BY pg_total_relation_size(relid) DESC LIMIT 25""")).mappings():
                      print('TABLE_METADATA '+json.dumps(dict(row),default=str))
          except Exception as exc:
              print('READ_ONLY_METADATA_ERROR='+type(exc).__name__)
          finally:
              engine.dispose()
          pid=subprocess.run(['pgrep','-n','-f','[v]era_web_v2_api_v38:app'],capture_output=True,text=True,timeout=5).stdout.strip()
          if pid.isdigit():
              metrics=subprocess.run(['ps','-p',pid,'-o','pcpu=,pmem=,rss=,nlwp=,etimes='],capture_output=True,text=True,timeout=5).stdout.split()
              if len(metrics)==5 and all(re.fullmatch(r'[0-9.]+',v) for v in metrics):
                  print('PROCESS_METRICS '+json.dumps(dict(zip(['cpu_percent','memory_percent','rss_kb','threads','uptime_seconds'],metrics))))
          engine=create_engine(_database_url(env),poolclass=NullPool,connect_args={'connect_timeout':5,'sslmode':env.get('DB_SSLMODE','require'),'options':'-c default_transaction_read_only=on -c statement_timeout=3000 -c lock_timeout=1000'})
          try:
              with engine.connect() as conn:
                  for table in ['vera_live_tour_audit','vera_live_tour_meta','vera_live_tour_invoice','vera_live_tour_report']:
                      where='' if table.endswith('_meta') else ' WHERE deleted_at IS NULL'
                      row=conn.execute(text('SELECT count(*) AS records,coalesce(sum(pg_column_size(payload)),0) AS stored_payload_bytes FROM '+table+where)).mappings().one()
                      print('PAYLOAD_METRICS '+json.dumps({'table':table,**dict(row)},default=str))
          except Exception as exc:
              print('PAYLOAD_METRICS_ERROR='+type(exc).__name__)
          finally:
              engine.dispose()
          for path in [Path('/var/log/nginx/access.log'),Path('/var/log/nginx/error.log')]:
              if not path.is_file(): continue
              result=subprocess.run(['tail','-n','10000',str(path)],capture_output=True,text=True,timeout=5)
              counts=Counter()
              for line in result.stdout.splitlines():
                  hit=re.search(r'"(?:GET|POST) (/v2/staff/export[.]xlsx|/v2/live-tour/action)(?:[?][^"]*)? HTTP/[0-9.]+" ([0-9]{3})',line)
                  if hit: counts[(hit[1],hit[2])]+=1
              for (route,status),count in counts.items():
                  print('REQUEST_OUTCOME '+json.dumps({'route':route,'status':status,'count':count}))
          PY
