name: Diagnose Payroll SMTP

on:
  push:
    branches:
      - diagnose/payroll-email-502
    paths:
      - '.github/workflows/diagnose-payroll-smtp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe GitHub production SMTP secret without sending email
        env:
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          secret = str(os.getenv("SMTP_APP_PASSWORD") or "").strip()
          print(f"GITHUB_SMTP_SECRET defined={bool(secret)}")
          if not secret:
              raise SystemExit(0)
          server = None
          try:
              server = smtplib.SMTP("smtp.gmail.com", 587, timeout=8)
              server.ehlo()
              server.starttls()
              server.ehlo()
              server.login("veraspabienhoa@gmail.com", secret)
              server.noop()
              print("GITHUB_SMTP_PROBE result=LOGIN_OK")
          except smtplib.SMTPAuthenticationError as exc:
              print(f"GITHUB_SMTP_PROBE result=AUTH_FAILED code={getattr(exc, 'smtp_code', 'unknown')}")
          except Exception as exc:
              print(f"GITHUB_SMTP_PROBE result=ERROR type={type(exc).__name__}")
          finally:
              if server is not None:
                  try:
                      server.quit()
                  except Exception:
                      pass
          PY

      - name: Probe production payroll SMTP without sending email
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'python3 -' <<'PY'
          import os
          import smtplib
          import time
          from pathlib import Path

          marker = "vera_web_v2_api_v38:app"
          env = {}
          for proc in sorted((p for p in Path("/proc").iterdir() if p.name.isdigit()), key=lambda p: int(p.name), reverse=True):
              try:
                  cmd = (proc / "cmdline").read_bytes().replace(b"\0", b" ").decode("utf-8", "replace")
                  if marker not in cmd:
                      continue
                  for entry in (proc / "environ").read_bytes().split(b"\0"):
                      key, sep, value = entry.partition(b"=")
                      name = key.decode("utf-8", "replace")
                      if sep and name in {"SMTP_SENDER_EMAIL", "SMTP_APP_PASSWORD"}:
                          env[name] = value.decode("utf-8", "replace")
                  if env:
                      break
              except (FileNotFoundError, PermissionError, ProcessLookupError):
                  continue

          sender = str(env.get("SMTP_SENDER_EMAIL") or "").strip()
          password = str(env.get("SMTP_APP_PASSWORD") or "").strip()
          print(f"SMTP_ENV sender_defined={bool(sender)} password_defined={bool(password)}")
          if not sender or not password:
              raise SystemExit("SMTP_PROBE_RESULT=MISSING_RUNTIME_CREDENTIALS")

          for mode in ("starttls", "ssl"):
              started = time.monotonic()
              server = None
              try:
                  if mode == "starttls":
                      server = smtplib.SMTP("smtp.gmail.com", 587, timeout=8)
                      server.ehlo()
                      server.starttls()
                      server.ehlo()
                  else:
                      server = smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=8)
                  server.login(sender, password)
                  server.noop()
                  print(f"SMTP_PROBE mode={mode} result=LOGIN_OK elapsed={time.monotonic()-started:.2f}s")
              except smtplib.SMTPAuthenticationError as exc:
                  print(f"SMTP_PROBE mode={mode} result=AUTH_FAILED code={getattr(exc, 'smtp_code', 'unknown')} elapsed={time.monotonic()-started:.2f}s")
              except Exception as exc:
                  print(f"SMTP_PROBE mode={mode} result=ERROR type={type(exc).__name__} elapsed={time.monotonic()-started:.2f}s")
              finally:
                  if server is not None:
                      try:
                          server.quit()
                      except Exception:
                          pass
          PY
