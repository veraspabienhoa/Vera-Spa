name: Deploy Live Tour checkbox column

on:
  push:
    paths:
      - '.github/workflows/deploy-appearance-room-layout.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Add checkbox column to appearance and mobile roster
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found')
              return text.replace(old, new, 1)

          # 1) Appearance model: expose the checkbox selector as a real configurable column.
          path = Path('web-v2/src/lib/liveTourAppearance.js')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              "export const LIVE_TOUR_COLUMN_DEFINITIONS = [\n  'STT', 'Tên nhân viên', 'Thao tác',",
              "export const LIVE_TOUR_COLUMN_DEFINITIONS = [\n  'Ô chọn', 'STT', 'Tên nhân viên', 'Thao tác',",
              'column definitions',
          )
          old = """  const entries = (columns || []).map((column, index) => {\n    const key = liveTourColumnKey(column)\n    const cfg = configured.get(key)\n    return { kind: 'column', column, key, order: cfg?.order ?? 100 + index, visible: cfg?.visible !== false }\n  })\n"""
          new = """  const selectCfg = configured.get('Ô chọn')\n  const entries = [\n    { kind: 'select', column: '', key: 'Ô chọn', order: selectCfg?.order ?? 0, visible: selectCfg?.visible !== false },\n    ...(columns || []).map((column, index) => {\n      const key = liveTourColumnKey(column)\n      const cfg = configured.get(key)\n      return { kind: 'column', column, key, order: cfg?.order ?? 100 + index, visible: cfg?.visible !== false }\n    }),\n  ]\n"""
          text = replace_once(text, old, new, 'table layout select entry')
          path.write_text(text, encoding='utf-8')

          # 2) Render the selector through the configurable table layout so visibility/order/width work.
          path = Path('web-v2/src/pages/LiveTourPage.jsx')
          text = path.read_text(encoding='utf-8')
          old = """<thead><tr><th className=\"live-tour-select-col\"><input type=\"checkbox\" checked={allDisplayedSelected} onChange={toggleDisplayed} aria-label=\"Chọn tất cả nhân viên đang hiển thị\"/></th>{appearanceTableColumns.map((entry) => entry.kind === 'actions'\n        ? <th className=\"live-tour-actions-col\" data-appearance-key=\"Thao tác\" key=\"__actions\">Thao tác</th>\n        : <th className={columnClass(entry.column)} data-appearance-key={entry.key} key={entry.column}>{entry.column}</th>)}</tr></thead>"""
          new = """<thead><tr>{appearanceTableColumns.map((entry) => entry.kind === 'select'\n        ? <th className=\"live-tour-select-col\" data-appearance-key=\"Ô chọn\" key=\"__select\"><input type=\"checkbox\" checked={allDisplayedSelected} onChange={toggleDisplayed} aria-label=\"Chọn tất cả nhân viên đang hiển thị\"/></th>\n        : entry.kind === 'actions'\n          ? <th className=\"live-tour-actions-col\" data-appearance-key=\"Thao tác\" key=\"__actions\">Thao tác</th>\n          : <th className={columnClass(entry.column)} data-appearance-key={entry.key} key={entry.column}>{entry.column}</th>)}</tr></thead>"""
          text = replace_once(text, old, new, 'table header select layout')
          old = """return <tr className={rowClass(item, selectedIds.has(id), data.payment_settings?.shift_ready_times, clockMs)} key={id} onClick={(event) => { if (!event.target.closest('button,input,a,select')) toggleRow(id) }}><td className=\"live-tour-select-col\"><input type=\"checkbox\" checked={selectedIds.has(id)} onChange={() => toggleRow(id)} aria-label={`Chọn ${cellValue(item, employeeColumn)}`}/></td>{appearanceTableColumns.map((entry) => {\n          if (entry.kind === 'actions') return <td className=\"live-tour-actions-col\" data-appearance-key=\"Thao tác\" key=\"__actions\">{employeeServiceActions(item)}</td>"""
          new = """return <tr className={rowClass(item, selectedIds.has(id), data.payment_settings?.shift_ready_times, clockMs)} key={id} onClick={(event) => { if (!event.target.closest('button,input,a,select')) toggleRow(id) }}>{appearanceTableColumns.map((entry) => {\n          if (entry.kind === 'select') return <td className=\"live-tour-select-col\" data-appearance-key=\"Ô chọn\" key=\"__select\"><input type=\"checkbox\" checked={selectedIds.has(id)} onChange={() => toggleRow(id)} aria-label={`Chọn ${cellValue(item, employeeColumn)}`}/></td>\n          if (entry.kind === 'actions') return <td className=\"live-tour-actions-col\" data-appearance-key=\"Thao tác\" key=\"__actions\">{employeeServiceActions(item)}</td>"""
          text = replace_once(text, old, new, 'table body select layout')
          path.write_text(text, encoding='utf-8')

          # 3) Mobile CSS: stop hiding the select column and reserve space for it in the fit-screen table.
          path = Path('web-v2/src/live-tour-mobile-overrides.css')
          text = path.read_text(encoding='utf-8')
          hidden = """  html body .live-tour-page .tour-table .live-tour-select-col,\n  html body .live-tour-page .tour-table .tour-col-mobile-hidden {\n    display: none !important;\n  }"""
          shown = """  html body .live-tour-page .tour-table .tour-col-mobile-hidden {\n    display: none !important;\n  }"""
          if text.count(hidden) != 2:
              raise SystemExit(f'mobile hidden anchors: expected 2, found {text.count(hidden)}')
          text = text.replace(hidden, shown)
          first_visible = """  html body .live-tour-page .tour-table .tour-col-stt,"""
          text = text.replace(first_visible, """  html body .live-tour-page .tour-table .live-tour-select-col,\n  html body .live-tour-page .tour-table .tour-col-stt,""", 2)
          text = replace_once(
              text,
              """  html body .live-tour-page .tour-table .tour-col-stt {\n    width: 44px !important;""",
              """  html body .live-tour-page .tour-table .live-tour-select-col {\n    width: 36px !important;\n    min-width: 36px !important;\n    max-width: 36px !important;\n    text-align: center !important;\n  }\n  html body .live-tour-page .tour-table .tour-col-stt {\n    width: 44px !important;""",
              'mobile px select width',
          )
          old_widths = """  html body .live-tour-page .tour-table .tour-col-stt { width: 5% !important; }\n  html body .live-tour-page .tour-table .tour-col-employee { width: 17% !important; }\n  html body .live-tour-page .tour-table .live-tour-actions-col { width: 13% !important; }\n  html body .live-tour-page .tour-table .tour-col-appointment { width: 12% !important; }\n  html body .live-tour-page .tour-table .tour-col-status { width: 11% !important; }\n  html body .live-tour-page .tour-table .tour-col-room { width: 8% !important; }\n  html body .live-tour-page .tour-table .tour-col-remaining { width: 12% !important; }\n  html body .live-tour-page .tour-table .tour-col-request { width: 9% !important; }\n  html body .live-tour-page .tour-table .tour-col-service { width: 13% !important; }"""
          new_widths = """  html body .live-tour-page .tour-table .live-tour-select-col { width: 4% !important; text-align: center !important; }\n  html body .live-tour-page .tour-table .tour-col-stt { width: 5% !important; }\n  html body .live-tour-page .tour-table .tour-col-employee { width: 15% !important; }\n  html body .live-tour-page .tour-table .live-tour-actions-col { width: 12% !important; }\n  html body .live-tour-page .tour-table .tour-col-appointment { width: 11% !important; }\n  html body .live-tour-page .tour-table .tour-col-status { width: 11% !important; }\n  html body .live-tour-page .tour-table .tour-col-room { width: 8% !important; }\n  html body .live-tour-page .tour-table .tour-col-remaining { width: 12% !important; }\n  html body .live-tour-page .tour-table .tour-col-request { width: 9% !important; }\n  html body .live-tour-page .tour-table .tour-col-service { width: 13% !important; }\n  html body .live-tour-page .tour-table .live-tour-select-col input[type=checkbox] { width: 14px !important; height: 14px !important; margin: 0 auto !important; }"""
          text = replace_once(text, old_widths, new_widths, 'mobile percentage widths')
          path.write_text(text, encoding='utf-8')
          print('LIVE_TOUR_SELECT_COLUMN_PATCH=OK')
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Verify and build
        working-directory: web-v2
        run: |
          set -euo pipefail
          npm ci
          grep -q "'Ô chọn', 'STT'" src/lib/liveTourAppearance.js
          grep -q "kind: 'select'" src/lib/liveTourAppearance.js
          grep -q 'data-appearance-key="Ô chọn"' src/pages/LiveTourPage.jsx
          grep -q 'live-tour-select-col { width: 4%' src/live-tour-mobile-overrides.css
          node --test tests/liveTourAppointments.test.mjs tests/bookingControls.test.mjs tests/bookingAvailability.test.mjs
          npm run build

      - name: Commit functional change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-v2/src/lib/liveTourAppearance.js web-v2/src/pages/LiveTourPage.jsx web-v2/src/live-tour-mobile-overrides.css
          git commit -m 'Show configurable Live Tour checkbox column on mobile'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact functional commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 180 /opt/vera-spa/deploy.sh '$DEPLOY_SHA'"

      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "set -e; pid=\$(pgrep -n -f '[v]era_web_v2_api_v38:app'); release_dir=\$(readlink -f /proc/\${pid}/cwd); live_sha=\$(git -C \"\${release_dir}\" rev-parse HEAD); test \"\${live_sha}\" = '$DEPLOY_SHA'; curl -fsS http://127.0.0.1:8000/v2/auth/health >/dev/null; echo PRODUCTION_COMMIT=\${live_sha}; echo PRODUCTION_HEALTH=OK"
