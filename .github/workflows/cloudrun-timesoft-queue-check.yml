name: Cloud Run TimeSoft + Queue Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudrun-timesoft-queue-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vera-spa-production-observe
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check public Queue health
        run: |
          python - <<'PY'
          import json
          import urllib.request
          req = urllib.request.Request(
              'https://api.veraspa.vn/v2/live-tour/projection-queue/health',
              headers={'Accept': 'application/json', 'Cache-Control': 'no-cache'},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.load(response)
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          assert payload.get('ok') is True, payload
          assert payload.get('claim_strategy') == 'for_update_skip_locked', payload
          assert int(payload.get('refresh_seconds') or 0) == 300, payload
          PY

      - name: Inspect VPS Queue runtime and GCP access path
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          pid=$(pgrep -n -f '[v]era_web_v2_api_v38:app')
          release_dir=$(readlink -f "/proc/${pid}/cwd")
          echo "VPS_RELEASE_SHA=$(git -C "$release_dir" rev-parse HEAD)"
          echo "QUEUE_HEALTH_LOCAL=$(curl -fsS http://127.0.0.1:8000/v2/live-tour/projection-queue/health)"
          if command -v gcloud >/dev/null 2>&1; then
            echo "GCLOUD_INSTALLED=yes"
            account=$(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>/dev/null | head -n1 || true)
            project=$(gcloud config get-value project 2>/dev/null || true)
            if [ -n "$account" ]; then
              echo "GCLOUD_AUTHENTICATED=yes"
              echo "GCLOUD_ACTIVE_ACCOUNT=$account"
            else
              echo "GCLOUD_AUTHENTICATED=no"
            fi
            echo "GCLOUD_PROJECT=${project:-unset}"
          else
            echo "GCLOUD_INSTALLED=no"
            echo "GCLOUD_AUTHENTICATED=no"
            echo "GCLOUD_PROJECT=unset"
          fi
          REMOTE
