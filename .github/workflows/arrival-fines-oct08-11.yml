name: Bounded arrival fines 08-11 October preflight
on:
  push:
    branches: [ops/arrival-fines-oct08-11]
    paths:
      - 'scripts/arrival_fines_oct08_11.py'
      - 'scripts/inspect_confirmed_face_owner.py'
      - 'scripts/repair_confirmed_face_owner.py'
      - '.github/workflows/arrival-fines-oct08-11.yml'
permissions:
  contents: read
concurrency:
  group: vera-arrival-fines-oct08-11
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only confirmed Face ID owner inspection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); test -n "$pid"; release_dir=$(readlink -f "/proc/${pid}/cwd"); cd "$release_dir"; export PYTHONPATH="$release_dir";  timeout 240 /opt/vera-spa/.venv/bin/python -' \
            < scripts/inspect_confirmed_face_owner.py
      - name: Apply authorized bounded arrival fines
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'set -e; pid=$(pgrep -n -f "[v]era_web_v2_api_v38:app"); test -n "$pid"; release_dir=$(readlink -f "/proc/${pid}/cwd"); cd "$release_dir"; export PYTHONPATH="$release_dir"; export VERA_BACKFILL_MODE=apply; timeout 240 /opt/vera-spa/.venv/bin/python -' \
            < scripts/arrival_fines_oct08_11.py
