name: Add combo customer toggle and performance filter

on:
  push:
    paths:
      - '.github/workflows/add-combo-customer-toggle-performance-filter.yml'

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply requested UI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          combo_path = Path('web-v2/src/components/LiveTourComboImportFields.jsx')
          combo = combo_path.read_text(encoding='utf-8')
          if "import { useState } from 'react'" not in combo:
              combo = "import { useState } from 'react'\n" + combo
          marker = "export default function LiveTourComboImportFields({ customers, combos, form, setForm }) {\n"
          state_line = "  const [customerSearchOpen, setCustomerSearchOpen] = useState(true)\n"
          if state_line not in combo:
              if marker not in combo:
                  raise SystemExit('combo marker missing')
              combo = combo.replace(marker, marker + state_line, 1)
          old = "    <LiveTourCheckoutCustomer customers={customers} form={form} setForm={setForm} customerRequired/>"
          new = "    <div className=\"live-tour-field wide live-tour-combo-customer-search-toggle\"><button type=\"button\" className=\"secondary-button\" aria-pressed={customerSearchOpen} onClick={() => setCustomerSearchOpen(current => !current)}>{customerSearchOpen ? 'Tắt tìm kiếm khách hàng' : 'Mở tìm kiếm khách hàng'}</button></div>\n    <LiveTourCheckoutCustomer customers={customerSearchOpen ? customers : []} form={form} setForm={setForm} customerRequired/>"
          if old in combo:
              combo = combo.replace(old, new, 1)
          elif new not in combo:
              raise SystemExit('combo customer field missing')
          combo_path.write_text(combo, encoding='utf-8')

          report_path = Path('web-v2/src/pages/LiveTourReportsPage.jsx')
          report = report_path.read_text(encoding='utf-8')
          state_marker = "  const [tab, setTab] = useState('revenue')\n"
          timing_state = "  const [performanceTiming, setPerformanceTiming] = useState('all')\n"
          if timing_state not in report:
              if state_marker not in report:
                  raise SystemExit('report state marker missing')
              report = report.replace(state_marker, state_marker + timing_state, 1)
          old_perf = "  const performance = filterTourRows(data.performance || [], filters)\n  const rows = tab === 'performance' ? performance : tab === 'tip'"
          new_perf = "  const performance = filterTourRows(data.performance || [], filters)\n  const performanceRows = performance.filter(row => {\n    if (performanceTiming === 'all') return true\n    const delta = Number(row.completion_delta_minutes)\n    if (performanceTiming === 'early') return delta < 0\n    if (performanceTiming === 'late') return delta > 0\n    return delta === 0\n  })\n  const rows = tab === 'performance' ? performanceRows : tab === 'tip'"
          if old_perf in report:
              report = report.replace(old_perf, new_perf, 1)
          elif new_perf not in report:
              raise SystemExit('performance rows marker missing')
          filters_line = "      <LiveTourFilters value={filters} onChange={setFilters} rows={tab === 'performance' ? data.performance || [] : tab === 'combos' ? data.reports.filter(r => r.combo_sale || r.combo_units || /combo/i.test(r.service || '')) : data.reports}/>\n"
          filter_ui = "      {tab === 'performance' && <div className=\"performance-status-filter\" role=\"group\" aria-label=\"Lọc kết quả thời gian dịch vụ\">{[['all', 'Tất cả'], ['ontime', 'Đúng giờ'], ['late', 'Trễ'], ['early', 'Sớm']].map(([key, label]) => <button type=\"button\" key={key} className=\"secondary-button\" aria-pressed={performanceTiming === key} onClick={() => setPerformanceTiming(key)}>{label}</button>)}</div>}\n"
          if filter_ui not in report:
              if filters_line not in report:
                  raise SystemExit('filters marker missing')
              report = report.replace(filters_line, filters_line + filter_ui, 1)
          report = report.replace("<span>Sớm</span><strong>{rows.filter(row => Number(row.completion_delta_minutes) < 0).length}</strong>", "<span>Sớm</span><strong>{performance.filter(row => Number(row.completion_delta_minutes) < 0).length}</strong>")
          report = report.replace("<span>Đúng giờ</span><strong>{rows.filter(row => Number(row.completion_delta_minutes) === 0).length}</strong>", "<span>Đúng giờ</span><strong>{performance.filter(row => Number(row.completion_delta_minutes) === 0).length}</strong>")
          report = report.replace("<span>Muộn</span><strong>{rows.filter(row => Number(row.completion_delta_minutes) > 0).length}</strong>", "<span>Trễ</span><strong>{performance.filter(row => Number(row.completion_delta_minutes) > 0).length}</strong>")
          old_result = "<strong className={Number(row.completion_delta_minutes) < 0 ? 'report-early' : Number(row.completion_delta_minutes) > 0 ? 'report-late' : 'report-ontime'}>{row.completion_result}</strong>"
          new_result = "<span className={Number(row.completion_delta_minutes) < 0 ? 'report-early' : Number(row.completion_delta_minutes) > 0 ? 'report-late' : 'report-ontime'}>{row.completion_result}</span>"
          if old_result in report:
              report = report.replace(old_result, new_result, 1)
          elif new_result not in report:
              raise SystemExit('result marker missing')
          report_path.write_text(report, encoding='utf-8')

          css_path = Path('web-v2/src/pages/LiveTourReportsPage.css')
          css = css_path.read_text(encoding='utf-8')
          old_colors = ".performance-report-table th,.performance-report-table td{text-align:center}.performance-report-table th:first-child,.performance-report-table td:first-child{text-align:left}.report-early{color:#147a43}.report-ontime{color:#72551c}.report-late{color:#b42318}"
          new_colors = ".performance-report-table th,.performance-report-table td{text-align:center}.performance-report-table th:first-child,.performance-report-table td:first-child{text-align:left}.report-early{color:#b42318;font-weight:800}.report-ontime,.report-late{color:inherit;font-weight:400}"
          if old_colors in css:
              css = css.replace(old_colors, new_colors, 1)
          elif new_colors not in css:
              raise SystemExit('color rules missing')
          marker_css = '/* PERFORMANCE_STATUS_FILTER_V1 */'
          if marker_css not in css:
              css += '\n\n' + '\n'.join([
                  marker_css,
                  '.performance-status-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 6px}',
                  '.performance-status-filter .secondary-button{min-width:92px}',
                  '.performance-status-filter .secondary-button[aria-pressed="true"]{background:#1f5d49;color:#fff;border-color:#1f5d49}',
                  '@media(max-width:760px){.performance-status-filter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.performance-status-filter .secondary-button{min-width:0;padding:6px 2px;font-size:10px}}',
              ]) + '\n'
          css_path.write_text(css, encoding='utf-8')

          assert "customerSearchOpen ? 'Tắt tìm kiếm khách hàng' : 'Mở tìm kiếm khách hàng'" in combo
          assert 'customers={customerSearchOpen ? customers : []}' in combo
          assert "['late', 'Trễ']" in report and "['early', 'Sớm']" in report
          assert '<span>Trễ</span>' in report and '<span>Muộn</span>' not in report
          assert '.report-early{color:#b42318;font-weight:800}' in css
          assert '.report-ontime,.report-late{color:inherit;font-weight:400}' in css
          print('REQUESTED_UI_CHANGES=OK')
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-v2/package-lock.json

      - name: Test and build frontend
        working-directory: web-v2
        run: |
          npm ci
          node --test tests/liveTourAppointments.test.mjs tests/bookingControls.test.mjs tests/bookingAvailability.test.mjs
          npm run build

      - name: Commit functional change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-v2/src/components/LiveTourComboImportFields.jsx web-v2/src/pages/LiveTourReportsPage.jsx web-v2/src/pages/LiveTourReportsPage.css
          git commit -m 'Add combo customer search toggle and performance filter'
          git push origin HEAD:main
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 180 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"

      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "set -e; pid=\$(pgrep -n -f '[v]era_web_v2_api_v38:app'); release_dir=\$(readlink -f /proc/\${pid}/cwd); live_sha=\$(git -C \"\${release_dir}\" rev-parse HEAD); test \"\${live_sha}\" = '${DEPLOY_SHA}'; curl -fsS http://127.0.0.1:8000/v2/auth/health >/dev/null; echo PRODUCTION_COMMIT=\${live_sha}; echo PRODUCTION_HEALTH=OK"
