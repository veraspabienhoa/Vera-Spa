name: Apply employee bank and search fix

on:
  push:
    paths:
      - '.github/workflows/apply-employee-bank-search-fix.yml'

permissions:
  contents: write

concurrency:
  group: vera-spa-production
  cancel-in-progress: false

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2" "httpx2>=2,<3" -r requirements.txt
      - name: Apply corrective patch
        run: python ops/apply_employee_bank_search_fix.py
      - name: Compile and focused backend tests
        run: |
          python -m py_compile vera_vietqr_bank.py vera_web_v2_profile.py vera_web_v2_staff.py vera_web_v2_live_tour_payment.py
          python -m pytest -q tests/test_vietqr_bank_normalization.py tests/test_employee_search_blank_screen_guard.py tests/test_employee_toolbar_state_recovery.py tests/test_live_tour_daily_settings.py
      - name: Frontend regression and build
        working-directory: web-v2
        run: |
          npm ci
          node --test tests/bookingControls.test.mjs
          npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vera_vietqr_bank.py vera_web_v2_live_tour_payment.py vera_web_v2_profile.py vera_web_v2_staff.py web-v2/src/pages/ProfilePage.jsx web-v2/src/pages/EmployeePage.jsx web-v2/src/lib/employeeDirectoryUx.js tests/test_vietqr_bank_normalization.py tests/test_employee_search_blank_screen_guard.py
          git commit -m 'Fix employee bank code and search white screen'
          git push origin HEAD:main
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy patched commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          DEPLOY_SHA="$(git rev-parse HEAD)"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "timeout 240 /opt/vera-spa/deploy.sh '${DEPLOY_SHA}'"
      - name: Verify production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" 'set -e; curl -fsS --connect-timeout 3 --max-time 10 http://127.0.0.1:8000/v2/attendance/break-alerts/dispatch/health; echo; systemctl is-active vera-api.service'
