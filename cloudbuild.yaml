steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-commit-image"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-latest-image"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest"

  # ============================================================
  # WEB V2 PYTHON BUSINESS API
  # Public Cloud Run ingress is required by GitHub Pages, but every business
  # endpoint validates the Supabase Bearer session before reading/writing data.
  # Payroll 3.8 wraps the former vera_web_v2_api_shared:app entrypoint and
  # V3.9 installs the current leave/payroll policy on top of that shared API.
  # ============================================================
  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-web-v2-api"
    args:
      - "run"
      - "deploy"
      - "${_WEB_V2_API_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--service-account=${_RUN_SERVICE_ACCOUNT}"
      - "--allow-unauthenticated"
      - "--cpu=1"
      - "--memory=1Gi"
      - "--min=0"
      - "--max=2"
      - "--concurrency=20"
      - "--timeout=300"
      - "--clear-cloudsql-instances"
      - "--command=uvicorn"
      - "--args=vera_web_v2_api_v38:app,--host,0.0.0.0,--port,8080"
      - "--set-env-vars=DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_POOL_SIZE=2,DB_MAX_OVERFLOW=0,DB_POOL_RECYCLE=600,SUPABASE_URL=https://nunxfjhrszmlyyrvphuq.supabase.co,SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY},VERA_LEAVE_SHEET_ID=1Kz0aw-JatptAN9G7YSwZ6rJO09urOPaD-rS-18eZSY0,VERA_V2_CORS_ORIGINS=https://veraspabienhoa.github.io,SMTP_SENDER_EMAIL=veraspabienhoa@gmail.com"
      - "--set-secrets=DB_PASS=${_DB_SECRET}:latest,SMTP_APP_PASSWORD=vera-smtp-app-password:latest"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "health-check-web-v2-api"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        API_URL="$$(gcloud run services describe "${_WEB_V2_API_SERVICE}" --region="${_REGION}" --platform=managed --format='value(status.url)')"
        test -n "$${API_URL}"
        echo "Health checking Web V2 API: $${API_URL}/v2/health"
        python3 - "$${API_URL}/v2/health" <<'PY'
        import sys, time, urllib.request
        url=sys.argv[1]
        last=None
        for attempt in range(1,13):
            try:
                with urllib.request.urlopen(url, timeout=15) as r:
                    body=r.read(1024).decode('utf-8','replace')
                    if 200 <= r.status < 300:
                        print(body)
                        raise SystemExit(0)
                    last=RuntimeError(f'HTTP {r.status}: {body}')
            except Exception as exc:
                last=exc
                print(f'API health attempt {attempt}/12 failed: {exc}', file=sys.stderr)
            time.sleep(5)
        raise SystemExit(f'Web V2 API health check failed: {last}')
        PY

        echo "Health checking Payroll 3.8: $${API_URL}/v2/payroll-v38/health"
        python3 - "$${API_URL}/v2/payroll-v38/health" <<'PY'
        import json, sys, time, urllib.request
        url=sys.argv[1]
        expected='3.8-payroll-employee-overrides'
        expected_reader='payroll-timesoft-sheet-reader-2026-09-01.3'
        last=None
        for attempt in range(1,13):
            try:
                with urllib.request.urlopen(url, timeout=15) as r:
                    body=r.read(2048).decode('utf-8','replace')
                    payload=json.loads(body)
                    if (200 <= r.status < 300 and payload.get('ok') is True
                            and payload.get('release') == expected
                            and payload.get('source_worksheet') == 'Báo cáo doanh thu hóa đơn'
                            and payload.get('source_reader_release') == expected_reader
                            and payload.get('source_reader_mode') == 'openpyxl-normal-workbook'
                            and payload.get('email_template_release') == 'payroll-email-layout-2026-09-01.1'):
                        print(body)
                        raise SystemExit(0)
                    last=RuntimeError(f'Unexpected Payroll 3.8 health payload: {body}')
            except Exception as exc:
                last=exc
                print(f'Payroll 3.8 health attempt {attempt}/12 failed: {exc}', file=sys.stderr)
            time.sleep(5)
        raise SystemExit(f'Payroll 3.8 health check failed: {last}')
        PY

        echo "Health checking TourVera leave sync: $${API_URL}/v2/tour-leave-sync/health"
        python3 - "$${API_URL}/v2/tour-leave-sync/health" <<'PY'
        import json, sys, time, urllib.request
        url=sys.argv[1]
        expected='tour-leave-sync-2026-09-01.1'
        last=None
        for attempt in range(1,13):
            try:
                with urllib.request.urlopen(url, timeout=15) as r:
                    body=r.read(2048).decode('utf-8','replace')
                    payload=json.loads(body)
                    if (200 <= r.status < 300 and payload.get('ok') is True
                            and payload.get('release') == expected
                            and payload.get('source_sheet') == 'MainData'
                            and payload.get('catalog_sheet') == 'LoaiNghi'
                            and payload.get('target_file') == 'TourVera.xlsm'
                            and payload.get('preserves_vba') is True
                            and payload.get('concurrency_guard') == 'drive-etag'):
                        print(body)
                        raise SystemExit(0)
                    last=RuntimeError(f'Unexpected TourVera leave sync health payload: {body}')
            except Exception as exc:
                last=exc
                print(f'TourVera leave sync health attempt {attempt}/12 failed: {exc}', file=sys.stderr)
            time.sleep(5)
        raise SystemExit(f'TourVera leave sync health check failed: {last}')
        PY

        echo "Health checking Policy V3.9: $${API_URL}/v2/policy-v39/health"
        python3 - "$${API_URL}/v2/policy-v39/health" <<'PY'
        import json, sys, time, urllib.request
        url=sys.argv[1]
        expected='3.9-policy-payroll-period'
        last=None
        for attempt in range(1,13):
            try:
                with urllib.request.urlopen(url, timeout=15) as r:
                    body=r.read(2048).decode('utf-8','replace')
                    payload=json.loads(body)
                    if (200 <= r.status < 300 and payload.get('ok') is True
                            and payload.get('release') == expected
                            and payload.get('payroll_sheet') == 'Sheet2'
                            and int(payload.get('auto_penalty_minutes') or 0) == 5):
                        print(body)
                        raise SystemExit(0)
                    last=RuntimeError(f'Unexpected V3.9 health payload: {body}')
            except Exception as exc:
                last=exc
                print(f'V3.9 health attempt {attempt}/12 failed: {exc}', file=sys.stderr)
            time.sleep(5)
        raise SystemExit(f'Policy V3.9 health check failed: {last}')
        PY

        echo "Health checking Payroll TimeSoft auto source: $${API_URL}/v2/payroll-timesoft-auto/health"
        python3 - "$${API_URL}/v2/payroll-timesoft-auto/health" <<'PY'
        import json, sys, time, urllib.request
        url=sys.argv[1]
        expected='payroll-timesoft-auto-2026-08-29.2'
        last=None
        for attempt in range(1,13):
            try:
                with urllib.request.urlopen(url, timeout=15) as r:
                    body=r.read(2048).decode('utf-8','replace')
                    payload=json.loads(body)
                    if (200 <= r.status < 300 and payload.get('ok') is True
                            and payload.get('release') == expected
                            and payload.get('source') == 'timesoft_summary_invoice_YYYYMMDD'):
                        print(body)
                        raise SystemExit(0)
                    last=RuntimeError(f'Unexpected Payroll TimeSoft health payload: {body}')
            except Exception as exc:
                last=exc
                print(f'Payroll TimeSoft health attempt {attempt}/12 failed: {exc}', file=sys.stderr)
            time.sleep(5)
        raise SystemExit(f'Payroll TimeSoft health check failed: {last}')
        PY

  # ============================================================
  # WEB APP VERA SPA - SAFE CANDIDATE REVISION
  # Supabase Session Pooler Singapore is preserved exactly as before.
  # The new revision receives NO production traffic until all deployment
  # checks/jobs below finish successfully.
  # ============================================================
  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-web-candidate"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--service-account=${_RUN_SERVICE_ACCOUNT}"
      - "--allow-unauthenticated"
      - "--cpu=2"
      - "--memory=4Gi"
      - "--min=1"
      - "--max=2"
      - "--concurrency=8"
      - "--timeout=3600"
      - "--cpu-boost"
      - "--session-affinity"
      - "--clear-cloudsql-instances"
      - "--no-traffic"
      - "--tag=candidate-$SHORT_SHA"
      - "--set-env-vars=VERA_DB_ENABLED=1,VERA_DATA_BACKEND=postgres,DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_POOL_SIZE=2,DB_MAX_OVERFLOW=0,DB_POOL_TIMEOUT=20,DB_POOL_RECYCLE=600,DB_CONNECT_TIMEOUT=10,VERA_SHEETS_MIRROR_MODE=optional,VERA_PHASE17_FINAL_BACKEND=postgres,SMTP_SENDER_EMAIL=veraspabienhoa@gmail.com,TIMESOFT_BASE_URL=https://vera.timesoft.vn"
      - "--set-secrets=DB_PASS=${_DB_SECRET}:latest,SMTP_APP_PASSWORD=vera-smtp-app-password:latest,TIMESOFT_USERNAME=vera-timesoft-username:latest,TIMESOFT_PASSWORD=vera-timesoft-password:latest"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "health-check-web-candidate"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        TAG="candidate-$SHORT_SHA"
        SERVICE_JSON="/workspace/cloud-run-service.json"
        CANDIDATE_META="/workspace/cloud-run-candidate.txt"

        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --platform=managed \
          --format=json > "$${SERVICE_JSON}"

        python3 - "$${SERVICE_JSON}" "$${TAG}" > "$${CANDIDATE_META}" <<'PY'
        import json
        import sys
        path, wanted_tag = sys.argv[1], sys.argv[2]
        with open(path, "r", encoding="utf-8") as fh:
            service = json.load(fh)
        for item in service.get("status", {}).get("traffic", []):
            if item.get("tag") == wanted_tag:
                revision = str(item.get("revisionName") or "").strip()
                url = str(item.get("url") or "").strip()
                if revision and url:
                    print(revision)
                    print(url)
                    raise SystemExit(0)
        raise SystemExit(f"Candidate tag not found: {wanted_tag}")
        PY

        CANDIDATE_REVISION="$$(sed -n '1p' "$${CANDIDATE_META}")"
        CANDIDATE_URL="$$(sed -n '2p' "$${CANDIDATE_META}")"
        test -n "$${CANDIDATE_REVISION}"
        test -n "$${CANDIDATE_URL}"

        echo "Health checking $${CANDIDATE_REVISION} at $${CANDIDATE_URL}/_stcore/health"
        python3 - "$${CANDIDATE_URL}/_stcore/health" <<'PY'
        import sys
        import time
        import urllib.request
        url = sys.argv[1]
        last_error = None
        for attempt in range(1, 19):
            try:
                with urllib.request.urlopen(url, timeout=20) as response:
                    body = response.read(1024).decode("utf-8", "replace").strip()
                    if 200 <= response.status < 300:
                        print(f"Candidate healthy on attempt {attempt}: {body[:200]}")
                        raise SystemExit(0)
                    last_error = RuntimeError(f"HTTP {response.status}: {body[:200]}")
            except Exception as exc:
                last_error = exc
                print(f"Health attempt {attempt}/18 failed: {exc}", file=sys.stderr)
            time.sleep(5)
        raise SystemExit(f"Candidate health check failed: {last_error}")
        PY

  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-timesoft-job"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "${_TIMESOFT_JOB}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--service-account=${_RUN_SERVICE_ACCOUNT}"
      - "--cpu=1"
      - "--memory=2Gi"
      - "--task-timeout=900s"
      - "--max-retries=1"
      - "--tasks=1"
      - "--parallelism=1"
      - "--command=python"
      - "--args=timesoft_snapshot_job.py"
      - "--set-env-vars=VERA_DB_ENABLED=1,VERA_DATA_BACKEND=postgres,DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_POOL_SIZE=2,DB_MAX_OVERFLOW=0,DB_POOL_TIMEOUT=20,DB_POOL_RECYCLE=600,DB_CONNECT_TIMEOUT=10,TIMESOFT_BASE_URL=https://vera.timesoft.vn,TIMESOFT_SYNC_DAYS=2,TIMESOFT_PAYROLL_BACKFILL_DAYS=45,TIMESOFT_PAYROLL_BACKFILL_BATCH_DAYS=12,TIMESOFT_CHECKIN_PAGE_SIZE=100"
      - "--set-secrets=DB_PASS=${_DB_SECRET}:latest,TIMESOFT_USERNAME=vera-timesoft-username:latest,TIMESOFT_PASSWORD=vera-timesoft-password:latest"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "clear-timesoft-cloudsql"
    args:
      - "run"
      - "jobs"
      - "update"
      - "${_TIMESOFT_JOB}"
      - "--region=${_REGION}"
      - "--clear-cloudsql-instances"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-auto-penalty-job"
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "${_AUTO_PENALTY_JOB}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--service-account=${_RUN_SERVICE_ACCOUNT}"
      - "--cpu=1"
      - "--memory=2Gi"
      - "--task-timeout=900s"
      - "--max-retries=1"
      - "--tasks=1"
      - "--parallelism=1"
      - "--command=python"
      - "--args=auto_penalty_runtime_wrapper_v39.py"
      - "--set-env-vars=SMTP_SENDER_EMAIL=veraspabienhoa@gmail.com,TIMESOFT_BASE_URL=https://vera.timesoft.vn,TIMESOFT_CHECKIN_PAGE_SIZE=100"
      - "--set-secrets=SMTP_APP_PASSWORD=vera-smtp-app-password:latest,TIMESOFT_USERNAME=vera-timesoft-username:latest,TIMESOFT_PASSWORD=vera-timesoft-password:latest"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "promote-web-candidate"
    entrypoint: "bash"
    args:
      - "-ceu"
      - |
        CANDIDATE_META="/workspace/cloud-run-candidate.txt"
        CANDIDATE_REVISION="$$(sed -n '1p' "$${CANDIDATE_META}")"
        test -n "$${CANDIDATE_REVISION}"
        echo "Promoting verified revision: $${CANDIDATE_REVISION}"
        gcloud run services update-traffic "${_SERVICE}" \
          --region="${_REGION}" \
          --platform=managed \
          --to-revisions="$${CANDIDATE_REVISION}=100"

substitutions:
  _REGION: "asia-southeast1"
  _AR_REPO: "vera-spa"
  _SERVICE: "vera-spa"
  _WEB_V2_API_SERVICE: "vera-spa-api"
  _TIMESOFT_JOB: "vera-spa-timesoft-sync"
  _AUTO_PENALTY_JOB: "vera-spa-auto-penalty-2000"
  _RUN_SERVICE_ACCOUNT: "vera-spa-run@vera-hr-app.iam.gserviceaccount.com"
  _DB_HOST: "aws-0-ap-southeast-1.pooler.supabase.com"
  _DB_PORT: "5432"
  _DB_NAME: "postgres"
  _DB_USER: "postgres.nunxfjhrszmlyyrvphuq"
  _DB_SECRET: "vera-supabase-db-password"
  _SUPABASE_ANON_KEY: "sb_publishable_idnn4HeEozpAonmSqM4Tgw_bB8HW4FX"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest"
